# WordPress against a managed MariaDB (managed-database.yaml).
# Companion to deploy.sh in this directory, which sets externalDatabase.host,
# port, user and database from the binding's Secret wp-db.
#
# Service auto-hostname: wp-wordpress-<project-namespace>.<installation domain>
# (Helm release "wp" + chart "wordpress" produce Service "wp-wordpress")

mariadb:
  enabled: false

externalDatabase:
  # Bitnami's chart hard-codes the secret key to "mariadb-password" and offers
  # no override at v30.x. The binding's Secret stores the password under key
  # "password", so deploy.sh creates a small bridge Secret named wp-db-bridge
  # with the chart's expected key name.
  existingSecret: wp-db-bridge

# HTTPS through the platform Gateway: a ClusterIP Service with expose-route
# gets a hostname and a certificate and allocates no external IP. No Ingress,
# HTTPRoute or Gateway resource is needed; the platform creates them.
service:
  type: ClusterIP
  annotations:
    service.nlb.kube-dc.com/expose-route: "https"
    service.nlb.kube-dc.com/https-redirect: "true"

networkPolicy:
  enabled: false

podDisruptionBudget:
  enabled: false

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
