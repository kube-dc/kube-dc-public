apiVersion: v1
kind: Pod
metadata:
  name: gpu-accounting-one
  namespace: gpu-hrq-validation-child
spec:
  # The accounting spike must never consume a real GPU.
  schedulerName: kube-dc-gpu-quota-validation-noop
  restartPolicy: Never
  containers:
    - name: hold
      image: registry.k8s.io/pause:3.9
      resources:
        requests:
          nvidia.com/gpu: "1"
          nvidia.com/gpumem: "1024"
          nvidia.com/gpucores: "10"
        limits:
          nvidia.com/gpu: "1"
          nvidia.com/gpumem: "1024"
          nvidia.com/gpucores: "10"
