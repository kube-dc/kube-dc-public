apiVersion: v1
kind: Pod
metadata:
  name: gpu-valid
  namespace: gpu-admission-validation
  labels:
    kube-dc.com/gpu-profile: nvidia-v100-hami
spec:
  restartPolicy: Never
  containers:
    - name: workload
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      resources:
        requests:
          nvidia.com/gpu: "1"
          nvidia.com/gpumem: "1024"
          nvidia.com/gpucores: "10"
        limits:
          nvidia.com/gpu: "1"
          nvidia.com/gpumem: "1024"
          nvidia.com/gpucores: "10"
