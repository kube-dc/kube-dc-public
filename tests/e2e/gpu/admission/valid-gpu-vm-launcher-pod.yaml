apiVersion: v1
kind: Pod
metadata:
  name: gpu-vm-launcher-policy-test
  namespace: placeholder
  labels:
    kube-dc.com/gpu-profile: nvidia-v100-passthrough
  ownerReferences:
    - apiVersion: kubevirt.io/v1
      kind: VirtualMachineInstance
      name: gpu-vm-launcher-policy-test
      uid: 00000000-0000-0000-0000-000000000001
      controller: true
      blockOwnerDeletion: true
spec:
  restartPolicy: Never
  containers:
    - name: compute
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          nvidia.com/GV100GL_TESLA_V100_PCIE_32GB: "1"
        limits:
          nvidia.com/GV100GL_TESLA_V100_PCIE_32GB: "1"
