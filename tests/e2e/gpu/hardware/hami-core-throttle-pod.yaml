apiVersion: v1
kind: Pod
metadata:
  name: hami-core-throttle
  namespace: gpu-hardware-validation
  labels:
    app.kubernetes.io/name: kube-dc-gpu-core-throttle
    kube-dc.com/gpu-profile: nvidia-v100-hami
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: torch-benchmark
      image: docker.io/pytorch/pytorch@sha256:68c022c2f4627943a6f3e574cfd2c8ae4256210d5f66ae2b117942e0a8d4fa9d
      imagePullPolicy: IfNotPresent
      command:
        - python
        - -u
        - -c
      args:
        - |
          import torch
          a = torch.randn(4096, 4096, device="cuda")
          b = torch.randn(4096, 4096, device="cuda")
          print(f"benchmark-ready device={torch.cuda.get_device_name(0)}", flush=True)
          while True:
              # Keep this identical to HAMi v2.9.0's published qualification
              # workload. The pointwise division makes the launch path visible
              # to HAMi-core in addition to the cuBLAS matrix multiplication.
              a = a @ b / 4096
      env:
        - name: GPU_CORE_UTILIZATION_POLICY
          value: force
        - name: HOME
          value: /tmp
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
          nvidia.com/gpu: "1"
          nvidia.com/gpumem: "4096"
          nvidia.com/gpucores: "30"
        limits:
          cpu: "2"
          memory: 2Gi
          nvidia.com/gpu: "1"
          nvidia.com/gpumem: "4096"
          nvidia.com/gpucores: "30"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 256Mi
