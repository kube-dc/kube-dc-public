apiVersion: v1
kind: Namespace
metadata:
  name: gpu-vfio-validation
  labels:
    # Exercise the same VM/VMI admission bindings as a tenant project without
    # attaching this short-lived fixture to an Organization or HNC hierarchy.
    kube-dc.com/project: ""
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: v100-lifecycle
  namespace: gpu-vfio-validation
  labels:
    app.kubernetes.io/name: kube-dc-v100-lifecycle
    kube-dc.com/gpu-profile: nvidia-v100-passthrough
spec:
  runStrategy: Manual
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-dc-v100-lifecycle
        kube-dc.com/gpu-profile: nvidia-v100-passthrough
    spec:
      evictionStrategy: None
      nodeSelector:
        kube-dc.com/gpu.workload-mode: vm-passthrough
      domain:
        cpu:
          cores: 1
        resources:
          requests:
            memory: 256Mi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
          gpus:
            - name: gpu0
              deviceName: nvidia.com/GV100GL_TESLA_V100_PCIE_32GB
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          containerDisk:
            image: quay.io/kubevirt/cirros-container-disk-demo:v1.8.1
