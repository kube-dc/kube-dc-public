{{- /*
A namespace's "default" ServiceAccount never becomes a platform-managed one.
docs/prd/admission-webhooks-must-not-block-the-platform.md, step 2b.

The reference gate does not route pods that run as "default" (they are nearly
all pods), on the premise that "default" is never marked: the token
controller creates it unmarked, and the platform names its accounts after
its engines. This policy makes the premise a rule, for every identity, on
creation and on update (marking it, or re-creating it marked after a
delete). The managed-platform-creations webhook refuses the same on creation.

Selected by the marker (objectSelector, old or new object), so ordinary
accounts never reach it. failurePolicy: Ignore -- evaluated violations are
refused (the binding's Deny); a policy that cannot be evaluated does not
block ServiceAccount writes. Rendered from manager.webhook.broadGatesHandoffPhase 1.
*/ -}}
{{- $p := .Values.projectPolicies.protectManagedServices }}
{{- if and $p.enabled (ge (int .Values.manager.webhook.broadGatesHandoffPhase) 1) }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: managed-default-serviceaccount
spec:
  failurePolicy: Ignore
  matchConstraints:
    objectSelector:
      matchExpressions:
        - {key: services.kube-dc.com/managed-by, operator: Exists}
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["serviceaccounts"]
  validations:
    - expression: >-
        object.metadata.name != 'default' ||
        !(has(object.metadata.labels) && 'services.kube-dc.com/managed-by' in object.metadata.labels)
      messageExpression: >-
        'ServiceAccount ' + request.namespace + '/default is the account of every pod that names none; it never carries the platform marker (services.kube-dc.com/managed-by)'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: managed-default-serviceaccount
spec:
  policyName: managed-default-serviceaccount
  validationActions: {{ toJson $p.validationActions }}
{{- end }}
