{{- /*
Hand-off of valkey-shared-startup-v1 (docs/prd/admission-webhooks-must-not-block-the-platform.md,
step 3; docs/prd/admission-webhooks-step3-valkey-shared.md). Phases 0 and 1
render the configuration in shared-startup-webhooks.yaml unchanged; from
phase 2 this file renders it split in two:

  - valkey-shared-startup-v1 (the authority entry): name, path and
    failurePolicy Fail kept, selected on the platform's labels (rule 1).
    CREATE and UPDATE only (rule 2: DELETE is no longer matched, so
    namespace teardown never waits on the manager); bookkeeping updates
    skipped (rules 2 and 5).
  - valkey-shared-startup-references-v1 (failurePolicy Ignore): what the
    authority entry cannot select -- pods/binding, unlabelled typed
    references in Pods, workloads, Services, claims, RBAC, cert-manager and
    the operators' APIs, ambient RBAC and Kube-OVN's slr- shadows. Its pure
    refusals are repeated by the policy valkey-shared-startup-reserved,
    which alone holds unlabelled Secrets, ConfigMaps and ServiceAccounts
    (every refusal there is pure).
*/ -}}
{{- $p := .Values.projectPolicies.protectManagedServices }}
{{- if and .Values.manager.webhook.enabled $p.enabled $p.sharedStartup.valkey }}
{{- $phase := include "kube-dc.sharedStartup.handoffPhase" (dict "root" $ "family" "valkey") }}
{{- if eq (int $phase) 2 }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: kube-dc-valkey-shared-startup-v1
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "kube-dc.manager.fullname" . }}-webhook-serving-cert
webhooks:
  # Every request the handler judges with a lookup on a platform object
  # carries these labels on the new or the old object.
  - name: valkey-shared-startup-v1.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    objectSelector:
      matchExpressions:
        - {key: services.kube-dc.com/managed-by, operator: Exists}
        - {key: services.kube-dc.com/startup-contract, operator: In, values: ["shared-service-startup-v1"]}
    # Rules 2 and 5: an UPDATE whose authority payload is unchanged -- every
    # top-level field other than metadata and status, and every label and
    # annotation -- changes only finalizers, ownerReferences (including
    # blockOwnerDeletion) and server bookkeeping. That is what garbage
    # collection, orphaning and namespace teardown write; it never reaches
    # the manager. A tenant cannot make it on platform-marked objects at all
    # (protect-managed-services-in-projects). The kube-dc-services runner
    # checks this exact condition before it accepts the shape.
    matchConditions:
      - name: exclude-bookkeeping-updates
        expression: >-
          {{ include "kube-dc.valkeySharedStartup.bookkeeping" . }}
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-valkey-shared-startup-v1
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "secrets", "configmaps", "services", "serviceaccounts", "persistentvolumeclaims"]
        scope: Namespaced
{{- include "kube-dc.valkeySharedStartup.rules" . }}
  # No object selector can keep these away (a Binding carries none of the
  # pod's labels; the references and shadows carry none by design), so
  # failurePolicy Ignore. While the manager answers it judges what the
  # previous entry judged on them; a lookup that fails is admitted (the
  # manager runs with this phase). Unlabelled Secrets, ConfigMaps and
  # ServiceAccounts are not routed: every refusal of them is pure and held by
  # the policy valkey-shared-startup-reserved.
  - name: valkey-shared-startup-references-v1.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 10
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    matchConditions:
      # The authority entry's objects (its selector, on the new or the old
      # object) are judged there, fail-closed. Bindings stay here whatever
      # labels the Binding carries (the authority entry does not route them).
      - name: exclude-platform-objects
        expression: >-
          request.subResource != '' || !((object != null && has(object.metadata.labels) && 'services.kube-dc.com/managed-by' in object.metadata.labels && 'services.kube-dc.com/startup-contract' in object.metadata.labels && object.metadata.labels['services.kube-dc.com/startup-contract'] == 'shared-service-startup-v1') || (oldObject != null && has(oldObject.metadata.labels) && 'services.kube-dc.com/managed-by' in oldObject.metadata.labels && 'services.kube-dc.com/startup-contract' in oldObject.metadata.labels && oldObject.metadata.labels['services.kube-dc.com/startup-contract'] == 'shared-service-startup-v1'))
      - name: exclude-bookkeeping-updates
        expression: >-
          {{ include "kube-dc.valkeySharedStartup.bookkeeping" . }}
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-valkey-shared-startup-v1
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods/binding"]
        scope: Namespaced
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "services", "persistentvolumeclaims"]
        scope: Namespaced
{{- include "kube-dc.valkeySharedStartup.rules" . }}
{{- end }}
{{- end }}

{{- define "kube-dc.valkeySharedStartup.bookkeeping" -}}
!(request.operation == 'UPDATE' && object.all(k, k == 'metadata' || k == 'status' || (k in oldObject && object[k] == oldObject[k])) && oldObject.all(k, k == 'metadata' || k == 'status' || k in object) && (has(object.metadata.labels) ? object.metadata.labels : {}) == (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}) && (has(object.metadata.annotations) ? object.metadata.annotations : {}) == (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}))
{{- end }}

{{- /* The previous entry's non-core rules, CREATE and UPDATE only. */ -}}
{{- define "kube-dc.valkeySharedStartup.rules" }}
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "replicasets", "statefulsets"]
        scope: Namespaced
      - apiGroups: ["batch", "rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs", "roles", "rolebindings"]
        scope: Namespaced
      - apiGroups: ["cert-manager.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["issuers", "certificates", "certificaterequests"]
        scope: Namespaced
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["clusterroles", "clusterrolebindings"]
        scope: Cluster
      - apiGroups: ["postgresql.cnpg.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["clusters", "backups", "scheduledbackups", "poolers", "databases", "publications", "subscriptions"]
        scope: Namespaced
      - apiGroups: ["valkey.buf.red"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["failovers", "sentinels", "users"]
        scope: Namespaced
      - apiGroups: ["mysql.oracle.com"]
        apiVersions: ["v2"]
        operations: ["CREATE", "UPDATE"]
        resources: ["innodbclusters", "mysqlbackups", "mysqlclustersetfailovers"]
        scope: Namespaced
      - apiGroups: ["k8s.mariadb.com"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["mariadbs", "users", "grants", "databases", "backups", "physicalbackups", "pointintimerecoveries", "restores", "sqljobs", "maxscales", "connections"]
        scope: Namespaced
      - apiGroups: ["kafka.strimzi.io"]
        apiVersions: ["v1", "v1beta2"]
        operations: ["CREATE", "UPDATE"]
        resources: ["kafkas", "kafkanodepools", "kafkausers", "kafkatopics", "strimzipodsets", "kafkaconnects", "kafkamirrormakers", "kafkamirrormaker2s", "kafkabridges", "kafkarebalances", "kafkaconnectors"]
        scope: Namespaced
      - apiGroups: ["core.strimzi.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["strimzipodsets"]
        scope: Namespaced
      - apiGroups: ["clickhouse.altinity.com", "clickhouse-keeper.altinity.com"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["clickhouseinstallations", "clickhouseinstallationtemplates", "clickhousekeeperinstallations", "clickhousekeeperinstallationtemplates"]
        scope: Namespaced
{{- end }}

{{- /*
kube-dc.valkeySharedStartup.scan: valkeySharedReferences (valkey_shared_startup.go)
as CEL, to a fixed depth: a string under one of the typed authority keys, or
in a list under passwordSecrets/resourceNames, containing mss-v1-vk-, anywhere
in the map/list tree below "x" (a map or a list). Two-variable comprehensions
(Kubernetes 1.33 for a new policy) visit a map's keys and values and a list's
elements alike, so every node is visited once. Arguments: dict "x" (a CEL expression), "d"
(levels below this one).
*/ -}}
{{- define "kube-dc.valkeySharedStartup.scan" -}}
{{- $k := printf "k%d" (int .d) }}{{- $v := printf "v%d" (int .d) }}{{- $e := printf "e%d" (int .d) -}}
{{ .x }}.exists({{ $k }}, {{ $v }}, type({{ $k }}) == string && ({{ $k }} in ['name', 'secretName', 'instanceName', 'certIssuer', 'defaultPasswordSecret', 'externalTLSSecret', 'passwordSecret', 'tlsSecret', 'oldPasswordSecret', 'serviceAccountName', 'claimName'] && type({{ $v }}) == string && string({{ $v }}).contains('mss-v1-vk-') || {{ $k }} in ['passwordSecrets', 'resourceNames'] && type({{ $v }}) == list && {{ $v }}.exists({{ $e }}, type({{ $e }}) == string && string({{ $e }}).contains('mss-v1-vk-')))
{{- if gt (int .d) 0 }} || (type({{ $v }}) == map || type({{ $v }}) == list) && {{ include "kube-dc.valkeySharedStartup.scan" (dict "x" $v "d" (sub (int .d) 1)) }}{{ end }})
{{- end }}
