{{- /*
Hand-off phase 2 of the Kafka and ClickHouse shared startup gates (step 3 of
docs/prd/admission-webhooks-must-not-block-the-platform.md; as built in
docs/prd/admission-webhooks-step3-kafka-clickhouse.md). Phases 0 and 1 are
rendered unchanged by shared-startup-webhooks.yaml. The configuration keeps its
name; the handler (internal/webhook/core/ch_kafka_startup_webhook.go) serves
both entries on the same path.

  <family>-shared-startup-v1             failurePolicy Fail, selected on the
      platform's labels for this family (rule 1): every request the handler
      judges with a lookup on a platform object carries them on the new or the
      old object. CREATE/UPDATE only (rule 2); an UPDATE that changes no
      authority payload, label or annotation (finalizers, ownerReferences,
      server bookkeeping) is skipped (rules 2 and 5).
  <family>-shared-startup-references-v1  failurePolicy Ignore, unselected:
      what cannot carry the marker. pods/binding (a Binding carries no
      labels), Kube-OVN's slr- shadow Services, unlabelled objects of the
      operators' API groups, and (Kafka) the entity operator's Secret writes,
      with no DELETE. Requests the authority entry selects are excluded. From
      this phase the manager admits a request on this route whose lookups
      fail.

The pure refusals (squatting, typed borrowing of reserved names, the ClickHouse
recovery-Secret writer rule, the shadow writer rule) are held by the policy
<family>-shared-startup-reserved (vap-kafka-clickhouse-shared-startup-reserved.yaml).
*/ -}}
{{- $root := . -}}
{{- range $family := list "kafka" "clickhouse" }}
{{- $phase := include "kube-dc.chkStartup.phase" (list $root $family) }}
{{- if and $root.Values.manager.webhook.enabled $root.Values.projectPolicies.protectManagedServices.enabled (include "kube-dc.chkStartup.split" (list $root $family)) }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: kube-dc-{{ $family }}-shared-startup-v1
  annotations:
    cert-manager.io/inject-ca-from: {{ $root.Release.Namespace }}/{{ include "kube-dc.manager.fullname" $root }}-webhook-serving-cert
webhooks:
  - name: {{ $family }}-shared-startup-v1.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    objectSelector:
      matchExpressions:
        - {key: services.kube-dc.com/managed-by, operator: Exists}
        - {key: services.kube-dc.com/startup-contract, operator: In, values: ["shared-service-startup-v1"]}
        - {key: services.kube-dc.com/family, operator: In, values: [{{ $family | quote }}]}
    # Rules 2 and 5: an UPDATE whose authority payload is unchanged -- every
    # top-level field other than metadata and status (a Secret's data,
    # stringData, type and immutable; a ConfigMap's data, binaryData and
    # immutable; a Pod's, workload's, claim's, Service's, account's, RBAC
    # object's or operator object's spec, rules, subjects or roleRef), and
    # every label and annotation -- changes only finalizers, ownerReferences
    # (including blockOwnerDeletion) and server bookkeeping. That is what
    # garbage collection, orphaning and namespace teardown write; it never
    # reaches the manager. A tenant cannot make it on platform-marked objects
    # at all (protect-managed-services-in-projects). The kube-dc-services
    # runner checks this exact condition before it accepts the shape.
    matchConditions:
      - name: exclude-bookkeeping-updates
        expression: >-
          !(request.operation == 'UPDATE' && object.all(k, k == 'metadata' || k == 'status' || (k in oldObject && object[k] == oldObject[k])) && oldObject.all(k, k == 'metadata' || k == 'status' || k in object) && (has(object.metadata.labels) ? object.metadata.labels : {}) == (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}) && (has(object.metadata.annotations) ? object.metadata.annotations : {}) == (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}))
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" $root }}-webhook
        namespace: {{ $root.Release.Namespace }}
        path: /validate-{{ $family }}-shared-startup-v1
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "secrets", "configmaps", "services", "serviceaccounts", "persistentvolumeclaims"]
        scope: Namespaced
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "replicasets", "statefulsets"]
        scope: Namespaced
      - apiGroups: ["batch", "rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs", "roles", "rolebindings"]
        scope: Namespaced
      - apiGroups: ["cert-manager.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["issuers", "certificates", "certificaterequests"]
        scope: Namespaced
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["clusterroles", "clusterrolebindings"]
        scope: Cluster
{{- include "kube-dc.chkStartup.operatorRules" . }}
  # Ignore, unselected: what no object selector can reach. The first condition
  # leaves the authority entry's requests to it (a Binding is never one: the
  # authority entry does not route pods/binding, whatever labels the Binding
  # object carries); the second keeps ordinary
  # tenant Services{{ if eq $family "kafka" }} and Secrets{{ end }} away from the manager.
  - name: {{ $family }}-shared-startup-references-v1.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 10
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    matchConditions:
      - name: not-authority-selected
        expression: >-
          request.subResource == 'binding' || ![object, oldObject].exists(o, {{ include "kube-dc.chkStartup.selectedCEL" $family }})
      - name: judged-requests
        expression: >-
          request.resource.group != '' || request.subResource == 'binding' ||
          request.resource.resource == 'services' && object.metadata.?name.orValue('').startsWith('slr-')
{{- if eq $family "kafka" }} ||
          request.resource.resource == 'secrets' && request.userInfo.username.startsWith('system:serviceaccount:' + request.namespace + ':') && request.userInfo.username.endsWith('-entity-operator')
{{- end }}
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" $root }}-webhook
        namespace: {{ $root.Release.Namespace }}
        path: /validate-{{ $family }}-shared-startup-v1
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods/binding"]
        scope: Namespaced
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: [{{ if eq $family "kafka" }}"secrets", {{ end }}"services"]
        scope: Namespaced
      - apiGroups: ["cert-manager.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["issuers", "certificates", "certificaterequests"]
        scope: Namespaced
{{- include "kube-dc.chkStartup.operatorRules" . }}
{{- end }}
{{- end }}
