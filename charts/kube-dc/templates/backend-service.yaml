apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-dc.backend.fullname" . }}
  labels:
    {{- include "kube-dc.backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.backend.metrics.enabled }}
    - port: {{ .Values.backend.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "kube-dc.backend.selectorLabels" . | nindent 4 }}
