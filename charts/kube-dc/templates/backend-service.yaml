apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-dc.backend.fullname" . }}
  labels:
    {{- include "kube-dc.backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.observabilityUID.enabled }}
    - port: 3335
      targetPort: 3335
      protocol: TCP
      name: observability-auth
    {{- end }}
    {{- if .Values.backend.metrics.enabled }}
    - port: {{ .Values.backend.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "kube-dc.backend.selectorLabels" . | nindent 4 }}
{{- if include "kube-dc.backend.grafanaDedicated" . }}
---
# The dedicated Grafana UID replica: launches, the Grafana login check and the
# query proxy (point PAYG_QUERY_BACKEND_SERVICE / grafanaProxyURL here).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-dc.backend.fullname" . }}-grafana
  labels:
    {{- include "kube-dc.backend.grafana.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 3335
      targetPort: 3335
      protocol: TCP
      name: observability-auth
  selector:
    {{- include "kube-dc.backend.grafana.selectorLabels" . | nindent 4 }}
{{- end }}
