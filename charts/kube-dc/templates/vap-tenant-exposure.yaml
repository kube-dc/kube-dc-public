{{- $manager := printf "system:serviceaccount:%s:%s" .Release.Namespace (include "kube-dc.manager.serviceAccountName" .) -}}
# =============================================================================
# Tenant exposure policies, evaluated by the API server (no webhook dependency).
#
# Routes on the shared platform Gateway are generated by kube-dc controllers
# from Service annotations, and Project roles cannot write routes. These
# policies close the remaining tenant paths in Project namespaces:
#  - only the core controller writes the Service exposure acknowledgement and
#    hostname ownership marker, and the HTTPS redirect annotation is valid;
#  - a tenant Issuer cannot solve HTTP-01 on the platform Gateway, and a tenant
#    Certificate cannot use a ClusterIssuer. Either would let cert-manager answer an ACME
#    challenge on the shared Gateway for a hostname the tenant does not own,
#    or sign any name with a platform CA. Platform certificates come from the
#    controller. dns01, CA, self-signed and own-ingress HTTP-01 Issuers stay available.
# An UPDATE that keeps the spec (or the protected annotations) unchanged is
# always allowed, so existing objects can still be relabelled and deleted.
# =============================================================================
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kube-dc-tenant-service-exposure
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
  matchConditions:
    - name: exclude-core-controller
      expression: request.userInfo.username != '{{ $manager }}'
    - name: exclude-cluster-admins
      expression: >-
        !('system:masters' in request.userInfo.groups || 'platform:admin' in request.userInfo.groups)
  variables:
    - name: annotations
      expression: "has(object.metadata.annotations) ? object.metadata.annotations : {}"
    - name: oldAnnotations
      expression: "request.operation == 'UPDATE' && has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}"
  validations:
    - expression: |-
        ['network.kube-dc.com/load-balancer-source-ranges-applied', 'network.kube-dc.com/hostname-managed'].all(k,
          (k in variables.annotations) == (k in variables.oldAnnotations) &&
          (!(k in variables.annotations) || variables.annotations[k] == variables.oldAnnotations[k]))
      message: "Service exposure acknowledgements and hostname ownership markers are controller-managed."
    - expression: |-
        !('service.nlb.kube-dc.com/https-redirect' in variables.annotations) || variables.annotations['service.nlb.kube-dc.com/https-redirect'] == 'false' || (variables.annotations['service.nlb.kube-dc.com/https-redirect'] in ['true', 'forwarded-proto'] &&
         'service.nlb.kube-dc.com/expose-route' in variables.annotations &&
         variables.annotations['service.nlb.kube-dc.com/expose-route'] == 'https')
      message: "service.nlb.kube-dc.com/https-redirect must be true, false, or forwarded-proto, and requires HTTPS expose-route."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kube-dc-tenant-service-exposure
spec:
  policyName: kube-dc-tenant-service-exposure
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kube-dc.com/project
          operator: Exists
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kube-dc-tenant-certificate-issuers
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["cert-manager.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["issuers", "certificates"]
  matchConditions:
    - name: exclude-platform-service-accounts
      expression: >-
        !request.userInfo.username.startsWith('system:serviceaccount:{{ .Release.Namespace }}:') &&
        !request.userInfo.username.startsWith('system:serviceaccount:kube-dc-service-runner:')
    - name: exclude-cluster-admins
      expression: >-
        !('system:masters' in request.userInfo.groups || 'platform:admin' in request.userInfo.groups)
    - name: changed-spec
      expression: "request.operation == 'CREATE' || object.spec != oldObject.spec"
  validations:
    # HTTP-01 through the tenant's own ingress or Gateway stays available. A
    # solver attached to the platform Gateway namespace would answer
    # challenges for any hostname routed by the shared Gateway.
    - expression: |-
        request.resource.resource != 'issuers' || !has(object.spec.acme) || !has(object.spec.acme.solvers) || !object.spec.acme.solvers.exists(s, has(s.http01) && has(s.http01.gatewayHTTPRoute) &&
          has(s.http01.gatewayHTTPRoute.parentRefs) &&
          s.http01.gatewayHTTPRoute.parentRefs.exists(p, has(p.namespace) && p.namespace == 'envoy-gateway-system'))
      message: "Project Issuers cannot solve ACME HTTP-01 on the platform Gateway: expose the Service with expose-route, and the platform issues its certificate. Use your own ingress or Gateway, dns01, CA or self-signed Issuers for other certificates."
    - expression: >-
        request.resource.resource != 'certificates' ||
        !has(object.spec.issuerRef.kind) || object.spec.issuerRef.kind != 'ClusterIssuer' ||
        (has(object.spec.issuerRef.group) && object.spec.issuerRef.group != '' && object.spec.issuerRef.group != 'cert-manager.io')
      message: "Project Certificates cannot use platform ClusterIssuers: expose the Service with expose-route, and the platform issues its certificate."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kube-dc-tenant-certificate-issuers
spec:
  policyName: kube-dc-tenant-certificate-issuers
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kube-dc.com/project
          operator: Exists
