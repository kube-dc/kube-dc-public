{{- if and .Values.manager.webhook.enabled .Values.projectPolicies.protectManagedServices.enabled .Values.projectPolicies.protectManagedServices.postgresqlStartup.enabled }}
{{- $ps := .Values.projectPolicies.protectManagedServices.postgresqlStartup }}
{{- if not (has (toString ($ps.handoffPhase | default 0)) (list "0" "1" "2")) }}
{{- fail "projectPolicies.protectManagedServices.postgresqlStartup.handoffPhase must be 0, 1 or 2 (docs/prd/admission-webhooks-must-not-block-the-platform.md, step 3)" }}
{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: kube-dc-postgresql-startup-v1
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "kube-dc.manager.fullname" . }}-webhook-serving-cert
webhooks:
{{- if lt (int ($ps.handoffPhase | default 0)) 2 }}
  - name: postgresql-development-startup-v1.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-postgresql-development-startup-v2
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["secrets"]
        scope: Namespaced
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods/binding"]
        scope: Namespaced
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets", "configmaps", "serviceaccounts", "persistentvolumeclaims", "services", "pods"]
        scope: Namespaced
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "replicasets"]
        scope: Namespaced
      - apiGroups: ["batch", "rbac.authorization.k8s.io", "postgresql.cnpg.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "roles", "rolebindings", "clusters", "backups", "scheduledbackups", "poolers", "publications", "subscriptions", "databases"]
        scope: Namespaced
{{- else }}
  # Hand-off phase 2 (docs/prd/admission-webhooks-must-not-block-the-platform.md,
  # step 3; docs/prd/admission-webhooks-step3-postgresql.md). The authority
  # entry keeps its name, path and failurePolicy Fail, selected on the
  # platform's labels (rule 1): every request on the startup domain that the
  # handler judges with a lookup carries them on the new or the old object. No
  # DELETE and no pods/binding. Unlabelled objects that take, label or
  # reference reserved material are pure refusals, held by the policy
  # postgresql-development-startup-reserved.
  - name: postgresql-development-startup-v1.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    objectSelector:
      matchExpressions:
        - {key: services.kube-dc.com/managed-by, operator: Exists}
        - {key: services.kube-dc.com/startup-contract, operator: In, values: ["postgresql-development-v1"]}
    # Rules 2 and 5: an UPDATE whose authority payload is unchanged -- every
    # top-level field other than metadata and status (a Secret's data,
    # stringData, type and immutable; a ConfigMap's data, binaryData and
    # immutable; the spec of a Pod, workload, claim, Service or CNPG object; an
    # account's secrets; a Role's rules; a RoleBinding's roleRef and subjects),
    # and every label and annotation -- changes only finalizers,
    # ownerReferences (including blockOwnerDeletion) and server bookkeeping.
    # That is what garbage collection, orphaning, PVC protection, the Job
    # controller and namespace teardown write; it never reaches the manager. A
    # tenant cannot make it on platform-marked objects at all
    # (protect-managed-services-in-projects). The kube-dc-services runner
    # checks this exact condition before it accepts the shape.
    matchConditions:
      - name: exclude-bookkeeping-updates
        expression: >-
          !(request.operation == 'UPDATE' && object.all(k, k == 'metadata' || k == 'status' || (k in oldObject && object[k] == oldObject[k])) && oldObject.all(k, k == 'metadata' || k == 'status' || k in object) && (has(object.metadata.labels) ? object.metadata.labels : {}) == (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}) && (has(object.metadata.annotations) ? object.metadata.annotations : {}) == (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}))
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-postgresql-development-startup-v2
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets", "configmaps", "serviceaccounts", "persistentvolumeclaims", "services", "pods"]
        scope: Namespaced
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "replicasets"]
        scope: Namespaced
      - apiGroups: ["batch", "rbac.authorization.k8s.io", "postgresql.cnpg.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "roles", "rolebindings", "clusters", "backups", "scheduledbackups", "poolers", "publications", "subscriptions", "databases"]
        scope: Namespaced
  # The recovery broker shared by every restore family: its restore-broker-*
  # Secrets carry the platform marker and services.kube-dc.com/restore-target-uid,
  # not the startup contract. Fail-closed on that protected marker (rule 1),
  # CREATE/UPDATE only, bookkeeping skipped. The pure parts of broker DELETE
  # (identity groups, a named request with its UID precondition, namespace
  # teardown read from the namespace object) and unlabelled broker names are
  # held by the policy postgresql-development-startup-reserved.
  - name: postgresql-development-startup-broker-v1.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    objectSelector:
      matchExpressions:
        - {key: services.kube-dc.com/managed-by, operator: Exists}
        - {key: services.kube-dc.com/restore-target-uid, operator: Exists}
    matchConditions:
      - name: exclude-bookkeeping-updates
        expression: >-
          !(request.operation == 'UPDATE' && object.all(k, k == 'metadata' || k == 'status' || (k in oldObject && object[k] == oldObject[k])) && oldObject.all(k, k == 'metadata' || k == 'status' || k in object) && (has(object.metadata.labels) ? object.metadata.labels : {}) == (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}) && (has(object.metadata.annotations) ? object.metadata.annotations : {}) == (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}))
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-postgresql-development-startup-v2
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
        scope: Namespaced
  # What the authority entry cannot select, failurePolicy Ignore: pods/binding
  # (a Binding carries none of the pod's labels: always routed), unlabelled
  # CNPG objects (the
  # recursive reference walk over their spec cannot be a policy), and the copy
  # comparison of CNPG's ownerless cnpg-default-monitoring ConfigMap (its
  # writer identity is held by the policy). Requests the authority entry
  # selects are excluded. A served path of its own: the manager admits a
  # request on it whose lookups fail (it runs with this phase); the
  # fail-closed path never does.
  - name: postgresql-development-startup-references-v1.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 10
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    matchConditions:
      # A Binding's own metadata is the requester's, not the pod's: bindings
      # are always routed, whatever labels the Binding carries.
      - name: exclude-authority-objects
        expression: >-
          request.subResource == 'binding' || ![object, oldObject].exists(o, o != null && has(o.metadata.labels) && 'services.kube-dc.com/managed-by' in o.metadata.labels && o.metadata.labels[?'services.kube-dc.com/startup-contract'].orValue('') == 'postgresql-development-v1')
      - name: monitoring-configmap-only
        expression: >-
          request.resource.resource != 'configmaps' || object.metadata.name == 'cnpg-default-monitoring'
      # Rules 2 and 5: garbage collection and teardown on these objects are
      # not judged even while the manager answers.
      - name: exclude-bookkeeping-updates
        expression: >-
          !(request.operation == 'UPDATE' && object.all(k, k == 'metadata' || k == 'status' || (k in oldObject && object[k] == oldObject[k])) && oldObject.all(k, k == 'metadata' || k == 'status' || k in object) && (has(object.metadata.labels) ? object.metadata.labels : {}) == (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}) && (has(object.metadata.annotations) ? object.metadata.annotations : {}) == (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}))
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-postgresql-development-startup-references-v2
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods/binding"]
        scope: Namespaced
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["configmaps"]
        scope: Namespaced
      - apiGroups: ["postgresql.cnpg.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["clusters", "backups", "scheduledbackups", "poolers", "publications", "subscriptions", "databases"]
        scope: Namespaced
{{- end }}
{{- end }}
