{{- if and .Values.manager.webhook.enabled .Values.projectPolicies.protectManagedServices.enabled .Values.projectPolicies.protectManagedServices.valkeyStartup.enabled }}
{{- $vs := .Values.projectPolicies.protectManagedServices.valkeyStartup }}
{{- if not (has (toString ($vs.handoffPhase | default 0)) (list "0" "1" "2")) }}
{{- fail "projectPolicies.protectManagedServices.valkeyStartup.handoffPhase must be 0, 1 or 2 (docs/prd/admission-webhooks-must-not-block-the-platform.md, step 3)" }}
{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: kube-dc-valkey-startup-v1
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "kube-dc.manager.fullname" . }}-webhook-serving-cert
webhooks:
{{- if lt (int ($vs.handoffPhase | default 0)) 2 }}
  - name: valkey-development-startup-v1.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-valkey-development-startup-v1
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods/binding"]
        scope: Namespaced
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets", "configmaps"]
        scope: Namespaced
      - apiGroups: ["cert-manager.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["issuers", "certificates", "certificaterequests"]
        scope: Namespaced
{{- else }}
  # Hand-off phase 2 (docs/prd/admission-webhooks-must-not-block-the-platform.md,
  # step 3). The authority entry keeps its name, path and failurePolicy Fail,
  # selected on the platform's labels (rule 1): every request the handler
  # judges with a lookup carries them on the new or the old object. Unlabelled
  # Secrets, ConfigMaps and cert-manager objects naming reserved material are
  # pure refusals, held by the policy valkey-development-startup-reserved.
  - name: valkey-development-startup-v1.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    objectSelector:
      matchExpressions:
        - {key: services.kube-dc.com/managed-by, operator: Exists}
        - {key: services.kube-dc.com/startup-contract, operator: In, values: ["valkey-development-v1"]}
    # Rules 2 and 5: an UPDATE whose authority payload is unchanged -- every
    # top-level field other than metadata and status (a Secret's data,
    # stringData, type and immutable; a ConfigMap's data, binaryData and
    # immutable; a cert-manager object's spec), and every label
    # and annotation -- changes only finalizers, ownerReferences (including
    # blockOwnerDeletion) and server bookkeeping. That is what garbage
    # collection, orphaning and namespace teardown write; it never reaches the
    # manager. A tenant cannot make it on platform-marked objects at all
    # (protect-managed-services-in-projects). The kube-dc-services runner
    # checks this exact condition before it accepts the shape.
    matchConditions:
      - name: exclude-bookkeeping-updates
        expression: >-
          !(request.operation == 'UPDATE' && object.all(k, k == 'metadata' || k == 'status' || (k in oldObject && object[k] == oldObject[k])) && oldObject.all(k, k == 'metadata' || k == 'status' || k in object) && (has(object.metadata.labels) ? object.metadata.labels : {}) == (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}) && (has(object.metadata.annotations) ? object.metadata.annotations : {}) == (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}))
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-valkey-development-startup-v1
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets", "configmaps"]
        scope: Namespaced
      - apiGroups: ["cert-manager.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["issuers", "certificates", "certificaterequests"]
        scope: Namespaced
  # A Binding carries none of the pod's labels, so no selector can keep the
  # scheduler's bindings away: failurePolicy Ignore. The platform's server pod
  # is re-verified at bind time while the manager answers; a lookup that fails
  # is admitted (the manager runs with this phase).
  - name: valkey-development-startup-binding-v1.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 10
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-valkey-development-startup-v1
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods/binding"]
        scope: Namespaced
{{- end }}
{{- end }}
