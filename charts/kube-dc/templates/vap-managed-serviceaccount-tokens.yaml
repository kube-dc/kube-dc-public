{{- /*
The pure part of managed-serviceaccount-token.kube-dc.com, as a
ValidatingAdmissionPolicy. docs/prd/admission-webhooks-must-not-block-the-platform.md,
step 2b (owner decision 2026-10-15: no admission webhook may be able to block
all operations).

The webhook now fails OPEN (it sees the kubelet's projected-token refresh for
every pod in every project). What holds while the manager is unreachable is
this policy: it runs in the API server and reads the namespace's marked
ServiceAccounts as params (paramKind ServiceAccount, selected by the marker
label), so "is the account marked?" needs no webhook. It is
internal/webhook/core/serviceaccount_token_webhook.go's Handle() without its
lookups:

  - a token for a marked account requested by anyone but a platform identity
    or a node is refused, with the handler's message;
  - a node's token for a marked account must be bound to a pod (the handler
    then proves that pod is the platform's; that part needs the pod and its
    owner, and stays in the webhook).

Identities exempt: exactly platformIdentity() except nodes (the cluster-admin
groups, the control plane and the derived exempt ServiceAccount namespaces).
An account that is not marked matches no param and is admitted
(parameterNotFoundAction: Allow when the namespace has no marked account at
all). The handler keeps every check, so chart/manager skew stays closed.

Rendered from manager.webhook.broadGatesHandoffPhase 1, so it is cached before
the webhook fails open at phase 2. failurePolicy: Ignore (see below): what
cannot be evaluated is admitted, and the creation-side checks plus the
phase-1 audit are what keep a squatted account from existing.

Params are read from the API server's ServiceAccount informer, the one its
ServiceAccount admission plugin already keeps; an account marked a moment ago
can be missing from it for that moment, and the webhook (reading through the
API) covers that while it is reachable.
*/ -}}
{{- $p := .Values.projectPolicies.protectManagedServices }}
{{- if and $p.enabled (ge (int .Values.manager.webhook.broadGatesHandoffPhase) 1) }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: managed-serviceaccount-tokens
spec:
  # Ignore: a policy with params returns a CONFIGURATION error before it
  # selects any param when the param informer has not synced (the API server
  # waits about a second), and CEL evaluation or cost errors are failures
  # too. With Fail either would refuse every token request in every project,
  # ordinary kubelet refreshes included -- the outage this policy replaces.
  # Evaluated violations are still refused (the binding's Deny).
  failurePolicy: Ignore
  paramKind:
    apiVersion: v1
    kind: ServiceAccount
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["serviceaccounts/token"]
  matchConditions:
    - name: tenants-and-nodes
      expression: {{ printf "!%s || %s" (include "kube-dc.managedReferences.platformIdentityCEL" .) (include "kube-dc.managedReferences.nodeIdentityCEL" .) | quote }}
  variables:
    - name: node
      expression: {{ include "kube-dc.managedReferences.nodeIdentityCEL" . | quote }}
    # Each param is one marked ServiceAccount of the request's namespace.
    - name: marked
      expression: "params.metadata.name == request.name"
  validations:
    - expression: "!variables.marked || variables.node"
      messageExpression: >-
        'ServiceAccount ' + request.namespace + '/' + request.name +
        ' belongs to a platform-managed service (services.kube-dc.com/managed-by); tokens for it are minted only by the platform, not by a tenant identity'
      reason: Forbidden
    - expression: |-
        !variables.marked || !variables.node || (has(object.spec) && has(object.spec.boundObjectRef) && has(object.spec.boundObjectRef.kind) && object.spec.boundObjectRef.kind == 'Pod' &&
         has(object.spec.boundObjectRef.name) && object.spec.boundObjectRef.name != '')
      messageExpression: >-
        'a token for platform-managed ServiceAccount ' + request.namespace + '/' + request.name + ' is bound to the pod that uses it'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: managed-serviceaccount-tokens
spec:
  policyName: managed-serviceaccount-tokens
  validationActions: {{ toJson $p.validationActions }}
  paramRef:
    selector:
      matchExpressions:
        - {key: services.kube-dc.com/managed-by, operator: Exists}
    parameterNotFoundAction: Allow
{{- end }}
