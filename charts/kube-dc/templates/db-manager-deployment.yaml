{{/*
Trusted-CA source for db-manager. An explicit dbManager.trustedCA.configMapName
wins; otherwise inherit what the platform already trusts, so a private-CA
cluster that set MANAGER_TRUSTED_CA_CONFIGMAP gets db-manager fixed with no
extra key to discover.
*/}}
{{- $dbTrustedCA := .Values.dbManager.trustedCA.configMapName | default .Values.platformTrustBundle.configMapName | default .Values.manager.trustedCA.configMapName }}
{{- if .Values.dbManager.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-dc.dbmanager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-dc.dbmanager.labels" . | nindent 4 }}
    control-plane: db-manager
spec:
  replicas: {{ .Values.dbManager.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "kube-dc.dbmanager.selectorLabels" . | nindent 6 }}
      control-plane: db-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        {{- include "kube-dc.dbmanager.selectorLabels" . | nindent 8 }}
        {{- include "kube-dc.podVersionLabel" . | nindent 8 }}
        control-plane: db-manager
    spec:
      serviceAccountName: {{ include "kube-dc.dbmanager.fullname" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      {{- with .Values.dbManager.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dbManager.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dbManager.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: manager
        image: "{{ .Values.dbManager.image.repository }}:{{ .Values.dbManager.image.tag }}"
        imagePullPolicy: {{ .Values.dbManager.image.pullPolicy | default "IfNotPresent" }}
        command:
        - /manager
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        {{- if or .Values.dbManager.metrics.enabled .Values.dbManager.metricsEnabled }}
        - --metrics-bind-address=:8443
        - --metrics-secure=true
        {{- else }}
        - --metrics-bind-address=0
        {{- end }}
        env:
        # How long a KdcDatabase must have been observed before its engine is
        # created (kube-dc reserves the engine's names meanwhile). Operator floor is
        # 10s; 90s was the pre-0.7.5 default and made every new database look Failed.
        - name: KDC_ENGINE_SETTLE_WINDOW
          value: {{ .Values.dbManager.engineSettleWindow | default "10s" | quote }}
        - name: INFRA_API_ENDPOINT
          value: {{ include "kube-dc.managementAPIEndpoint" (list $ .Values.dbManager.infraAPIEndpoint) | quote }}
        # Cluster-level S3 endpoint, used by KdcDatabase backups when
        # `spec.backup.s3Endpoint` is not set per-resource. db-manager
        # has no hardcoded fallback — empty value means backups
        # without an explicit s3Endpoint will fail loudly rather than
        # silently route to a wrong domain.
        {{- if .Values.s3Endpoint }}
        - name: S3_ENDPOINT
          value: "{{ .Values.s3Endpoint }}"
        {{- end }}
        {{- if and .Values.manager.openBao .Values.manager.openBao.enabled }}
        # M3-T05 envelope encryption for KdcDatabase backups. db-manager
        # wraps a per-database DEK against per-Org Transit keys via the
        # auth/k8s-host `db-manager` role provisioned by
        # hack/openbao-setup-controller-auth.sh. Same OPENBAO_URL +
        # CA bundle the manager + backend already share via master-config.
        # OPENBAO_AUTH_ROLE defaults to "db-manager" in the controller —
        # left unset here so an operator can override per-cluster via
        # dbManager.extraEnv without bypassing the master-config wiring.
        - name: OPENBAO_URL
          valueFrom:
            secretKeyRef:
              name: master-config
              key: openbao_url
        - name: OPENBAO_CA_BUNDLE
          valueFrom:
            secretKeyRef:
              name: master-config
              key: openbao_ca_bundle
              optional: true
        {{- end }}
        {{- with .Values.dbManager.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $dbTrustedCA }}
        # Additional CA roots for clusters whose platform hostnames are served by
        # a PRIVATE CA. db-manager calls the platform's own https endpoints — the
        # OpenBao login at auth/k8s-host, the object-store endpoint for backups —
        # and Go verifies those with the process trust store, so OPENBAO_CA_BUNDLE
        # alone does not cover every client. Without these roots a KdcDatabase
        # reports
        #   openbao login: ... x509: certificate signed by unknown authority
        # and envelope encryption never gets configured.
        #
        # SSL_CERT_DIR (not SSL_CERT_FILE): Go reads the distro bundle AND every
        # file here, so this ADDS roots instead of replacing the system store.
        - name: SSL_CERT_DIR
          value: {{ .Values.dbManager.trustedCA.mountPath | quote }}
        {{- end }}
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        {{- if or .Values.dbManager.metrics.enabled .Values.dbManager.metricsEnabled }}
        - containerPort: 8443
          name: metrics
          protocol: TCP
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.dbManager.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        {{- if $dbTrustedCA }}
        volumeMounts:
        - name: trusted-ca
          mountPath: {{ .Values.dbManager.trustedCA.mountPath | quote }}
          readOnly: true
        {{- end }}
      {{- if $dbTrustedCA }}
      volumes:
      - name: trusted-ca
        configMap:
          name: {{ $dbTrustedCA | quote }}
      {{- end }}
{{- end }}
