# Worker-autoscaling quota rail: a KubeVirt worker is a VMI pod in the
# cluster's project namespace, so each node it adds is charged against that
# namespace's quota (the tenant's billing plan). The autoscaler reads it to
# refuse a scale-up that quota would reject anyway, reporting limitedBy=Quota
# instead of piling up Machines that admission rejects. Read-only. CloudSigma
# pools are account VMs and consume no namespace quota, so they are never
# charged against this.
#
# resourcequotas, NOT hierarchicalresourcequotas: the tenant plan is authored
# as an HRQ in the ORG-ROOT namespace, but a KdcCluster lives in the PROJECT
# namespace, so a namespace-scoped HRQ read there matches nothing. HNC projects
# every HRQ into the subtree as a plain ResourceQuota (`hrq.hnc.x-k8s.io`) with
# identical hard/used, and that projection is what admission actually enforces.
# BOTH groups are granted, deliberately, and this is not redundancy: a chart
# upgrade rolls before or after the operator image, in either order, and a
# rollback reverses it. The PREVIOUS k8-manager reads hierarchicalresourcequotas;
# this one reads resourcequotas. Granting only the new resource 403s the old pod
# for the length of the rollout — and for as long as a rollback lasts — which
# turns a quota read into a scale-up refusal. Keeping both costs two read-only
# verbs; drop the HNC one only once no supported version reads it.
- apiGroups:
  - hnc.x-k8s.io
  resources:
  - hierarchicalresourcequotas
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - resourcequotas
  verbs:
  - get
  - list
  - watch
{{- end }}

{{- if .Values.k8Manager.mgmtAutoscaling.enabled }}
# ── Management-worker autoscaling ──────────────────────────────────────────
# MgmtWorkerPool is the ledger; nodes are labelled/tainted by the acceptance
# gate. NO node delete: nothing in this feature ever removes a node.
- apiGroups: [k8s.kube-dc.com]
  resources: [mgmtworkerpools]
  verbs: [get, list, watch]
- apiGroups: [k8s.kube-dc.com]
  resources: [mgmtworkerpools/status]
  verbs: [get, update, patch]
- apiGroups: [""]
  resources: [nodes]
  verbs: [get, list, watch, update, patch]
{{- end }}
