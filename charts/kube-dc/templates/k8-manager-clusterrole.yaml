  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Read-only access to cert-manager Issuer and ClusterIssuer resources.
# Required by reconcileCertificateCARotation in the KdcClusterDatastore
# controller so it can resolve the Issuer's CA secret and compare the
# upstream CA Subject Key Identifier against the SKI embedded in
# leaf cert Secrets it manages. Without this, the drift detector logs
# "CA rotation: could not resolve Issuer CA, skipping drift check" on
# every reconcile and never forces leaf re-issuance after a CA rotation.
- apiGroups:
  - cert-manager.io
  resources:
  - issuers
  - clusterissuers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cluster.x-k8s.io
  resources:
  - clusters
  - machinedeployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# machinesets needs patch for the MS status-drift self-heal annotation
# (pokeMachineSetIfStatusDrift). machines (read-only) is the ground-truth
# the self-heal counts to compare against MS.status.readyReplicas.
- apiGroups:
  - cluster.x-k8s.io
  resources:
  - machinesets
  verbs:
  - get
  - list
  - patch
  - update
  - watch
# machines update + machinedeployments/scale: held so the manager can GRANT
# them to the per-cluster cluster-autoscaler Role (autoscaling.mode:
# ClusterAutoscaler) — RBAC no-escalation means the manager delegates only
# verbs it holds. `machines update` is how upstream CA stamps the
# delete-machine annotation so the MachineSet removes the node CA drained. A
# machines update/patch grant was added and reverted once before (b2daf40a)
# because its consumer was dead code; this consumer deploys with the mode.
- apiGroups:
  - cluster.x-k8s.io
  resources:
  - machines
  verbs:
  - get
  - list
  - update
  - watch
- apiGroups:
  - cluster.x-k8s.io
  resources:
  - machinedeployments/scale
  verbs:
  - get
  - patch
  - update
# machinepools read-only: held ONLY to delegate to the per-cluster
# cluster-autoscaler Role. The clusterapi provider starts an informer for
# every discovered CAPI resource and blocks its cache sync forever on a
# Forbidden machinepools watch — the autoscaler sat at "Initializing"
# indefinitely (found on a live cluster). Kube-DC never creates MachinePools.
- apiGroups:
  - cluster.x-k8s.io
  resources:
  - machinepools
  verbs:
  - get
  - list
  - watch
- apiGroups:
