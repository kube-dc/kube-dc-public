{{- /*
The pure refusals of the service-publication-writes webhook, for the External
Secrets account. docs/prd/admission-webhooks-remaining-design.md, item 3
(service-publication-writes).

A Secret is PROTECTED when it carries a reserved label key (the platform's
markers, the startup contract, every registered family's selector keys) or a
non-empty services.kube-dc.com/publication-uid, exactly what the handler's
protected() reads. External Secrets may:
  - never DELETE a protected Secret (a tenant ExternalSecret can drive writes
    under the same identity; the platform's projections are removed by GC);
  - never CREATE or UPDATE a Secret, or UPDATE an ExternalSecret's status,
    where the old or new object is protected but not marked
    (services.kube-dc.com/managed-by): such a write can never pass the
    publication proof (Astra round 5: the status rule too, which the webhook
    no longer sees for unmarked ExternalSecrets from phase 2).
Marked writes are still proven by the webhook, which from
manager.webhook.narrowGatesHandoffPhase 2 is selected on the marker and no
longer matches DELETE: tenants' own ExternalSecrets then sync while the
manager is unreachable.

No params, failurePolicy Fail. Rendered from narrowGatesHandoffPhase 1.
*/ -}}
{{- $p := .Values.projectPolicies.protectManagedServices }}
{{- if and .Values.manager.webhook.enabled $p.enabled (ne (include "kube-dc.narrowGates.phase" .) "0") }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: service-publication-eso-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets"]
        scope: Namespaced
      - apiGroups: ["external-secrets.io"]
        apiVersions: ["*"]
        operations: ["UPDATE"]
        resources: ["externalsecrets/status"]
        scope: Namespaced
  matchConditions:
    - name: exact-eso-account
      expression: {{ printf "request.userInfo.username == '%s'" (include "kube-dc.publicationESO.serviceAccount" .) | quote }}
  variables:
    - name: reservedKeys
      expression: {{ include "kube-dc.reservedLabelKeysCEL" . }}
    - name: protectedKeys
      expression: "variables.reservedKeys + ['services.kube-dc.com/startup-contract']"
    - name: oldLabels
      expression: "request.operation != 'CREATE' && has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}"
    - name: newLabels
      expression: "request.operation != 'DELETE' && has(object.metadata.labels) ? object.metadata.labels : {}"
    - name: oldProtected
      expression: >-
        variables.protectedKeys.exists(k, k in variables.oldLabels) ||
        ('services.kube-dc.com/publication-uid' in variables.oldLabels && variables.oldLabels['services.kube-dc.com/publication-uid'] != '')
    - name: newProtected
      expression: >-
        variables.protectedKeys.exists(k, k in variables.newLabels) ||
        ('services.kube-dc.com/publication-uid' in variables.newLabels && variables.newLabels['services.kube-dc.com/publication-uid'] != '')
  validations:
    - expression: "request.operation != 'DELETE' || !variables.oldProtected"
      message: "External Secrets may not delete a Secret that carries the platform's reserved labels or a publication UID; the platform's projections are removed with their owner"
      reason: Forbidden
    - expression: |-
        request.operation == 'DELETE' || !((variables.oldProtected && !('services.kube-dc.com/managed-by' in variables.oldLabels)) ||
          (variables.newProtected && !('services.kube-dc.com/managed-by' in variables.newLabels)))
      message: "External Secrets may write an object carrying the platform's reserved labels or a publication UID only when it is platform-marked (services.kube-dc.com/managed-by); this write can never match a provider credential publication"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: service-publication-eso-secrets
spec:
  policyName: service-publication-eso-secrets
  validationActions: {{ toJson $p.validationActions }}
{{- end }}
