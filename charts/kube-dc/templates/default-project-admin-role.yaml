# Kube-DC Security Manager — developer gets full CRUD on
# secrets/certs/DB-creds. KMS is locked down to read-only at the
# CR plane (per M3 review): create/rotate/min-DV/schedule/cancel
# are project-manager+ via OpenBao policy + backend SSAR. encrypt
# and decrypt go through the backend's data-plane endpoints which
# only need `get kmskeys` (loadKMSKey for the keyName lookup).
# Hard destroy (?destroy=true on secrets) is gated at the backend;
# K8s API just sees soft-delete semantics on the CR.
- apiGroups: [security.kube-dc.com]
  resources: [managedsecrets, managedcertificates, databasecredentialpolicies]
  verbs: [create, get, list, watch, update, patch, delete]
- apiGroups: [security.kube-dc.com]
  resources: [kmskeys]
  verbs: [get, list, watch]
- apiGroups: [security.kube-dc.com]
  resources: [managedsecrets/status, managedcertificates/status, kmskeys/status, databasecredentialpolicies/status]
  verbs: [get, list, watch]

---
# Project Manager Role - Can view all resources, manage some settings (no VM/container CRUD)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: default-project-manager-role
rules:
# Core resources - read + limited write
- apiGroups: [""]
  resources: [persistentvolumeclaims, services, serviceaccounts, configmaps]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, list]
- apiGroups: [""]
  resources: [resourcequotas]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [limitranges]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [endpoints]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [pods/log]
  verbs: [get, list]
- apiGroups: [""]
  resources: [events]
  verbs: [get, list, watch]
# Metrics (kubectl top pods)
- apiGroups: [metrics.k8s.io]
  resources: [pods]
  verbs: [get, list]
# Apps - read only
- apiGroups: [apps]
  resources: [deployments, daemonsets, replicasets, statefulsets]
  verbs: [get, list, watch]
{{- if .Values.gpu.tenantDirectApply }}
# Shared GPU (DRA) read-only visibility
- apiGroups: [resource.k8s.io]
  resources: [resourceclaimtemplates, resourceclaims]
  verbs: [get, list, watch]
{{- end }}
# Networking - read only
- apiGroups: [k8s.cni.cncf.io]
  resources: [network-attachment-definitions]
  verbs: [get, list]
- apiGroups: [networking.k8s.io]
  resources: [ingresses]
  verbs: [get, list, watch]
# KubeVirt VMs - read + console access
- apiGroups: [kubevirt.io]
  resources: [virtualmachines, virtualmachineinstances]
  verbs: [get, list, watch]
- apiGroups: [subresources.kubevirt.io]
  resources: [virtualmachineinstances/guestosinfo, virtualmachineinstances/console, virtualmachineinstances/vnc]
  verbs: [get]
# CDI - read only
- apiGroups: [cdi.kubevirt.io]
  resources: ["*"]
  verbs: [get, list, watch]
# VolumeSnapshots — read golden images for the instant-clone (vm-startup Phase C+D)
- apiGroups: [snapshot.storage.k8s.io]
  resources: [volumesnapshots]
  verbs: [get, list, watch]
# Autoscaling - read only
- apiGroups: [autoscaling]
  resources: [horizontalpodautoscalers]
  verbs: [get, list, watch]
# Cluster API - read only
- apiGroups: [cluster.x-k8s.io]
  resources: [clusters, machinedeployments]
  verbs: [get, list, watch]
- apiGroups: [controlplane.cluster.x-k8s.io]
  resources: [kthreescontrolplanes]
  verbs: [get, list, watch]
- apiGroups: [infrastructure.cluster.x-k8s.io]
  resources: [kubevirtmachinetemplates, kubevirtclusters]
  verbs: [get, list, watch]
# Batch - read only
- apiGroups: [batch]
  resources: [jobs, cronjobs]
  verbs: [get, list, watch]
# Kube-DC resources - read only
- apiGroups: [kube-dc.com]
  resources: [eips, fips]
  verbs: [get, list, watch]
- apiGroups: [k8s.kube-dc.com]
  resources: [kdcclusters, kdcclusterdatastores]
  verbs: [get, list, watch]
# Cert-manager - read only
- apiGroups: [cert-manager.io]
  resources: [issuers, certificates]
  verbs: [get, list, watch]
- apiGroups: [acme.cert-manager.io]
  resources: [challenges]
  verbs: [get, list, watch]
# Policy - read only
- apiGroups: [policy]
  resources: [poddisruptionbudgets]
  verbs: [get, list, watch]
# Discovery
- apiGroups: [discovery.k8s.io]
  resources: [endpointslices]
  verbs: [get, list]
# Gateway API - read only
- apiGroups: [gateway.networking.k8s.io]
  resources: [httproutes, grpcroutes, tlsroutes]
  verbs: [get, list, watch]
- apiGroups: [gateway.envoyproxy.io]
  resources: [backends]
  verbs: [get, list, watch]
# Object Storage - read only
- apiGroups: [objectbucket.io]
  resources: [objectbucketclaims]
  verbs: [get, list, watch]
# Database Service - read only
- apiGroups: [db.kube-dc.com]
  resources: [kdcdatabases]
  verbs: [get, list, watch]
# Managed services (kube-dc-services) - read only
- apiGroups: [services.kube-dc.com]
  resources: [managedservices, managedservices/status, serviceoperations, serviceoperations/status, servicebindings, servicebindings/status, servicecredentialpolicies, servicecredentialpolicies/status, serviceplacements, serviceplacements/status, servicebackups, servicebackups/status]
  verbs: [get, list, watch]
# Match legacy credential-policy access: project-manager may pause or adjust
# an existing schedule, but may not create/delete policy objects.
- apiGroups: [services.kube-dc.com]
  resources: [servicecredentialpolicies]
  verbs: [update, patch]
# Database Engine Resources - read only
- apiGroups: [postgresql.cnpg.io]
  resources: [backups, scheduledbackups, clusters]
  verbs: [get, list, watch]
- apiGroups: [k8s.mariadb.com]
  resources: [physicalbackups, backups, databases, users, grants, mariadbs]
  verbs: [get, list, watch]
# Velero - read only
- apiGroups: [velero.io]
  resources: [backups, restores, schedules, backupstoragelocations]
  verbs: [get, list, watch]
- apiGroups: [velero.io]
  resources: [backups/status, restores/status]
  verbs: [get, list, watch]
# Kube-DC Security Manager — project-manager reads everything and
# toggles sync configuration on secrets/certs/DB-creds; cannot
# create new secrets/certs (per dev-scope §6, that's developer-and-
# above). On KMS the design inverts: kmskeys create + rotate +
# min-decryption-version are project-manager+ (UX PRD §4.3), so PM
# gets create + patch on kmskeys. Schedule/cancel-delete are
# admin-only and gated by a backend SSAR check (M3-T02 review-pass);
# PM's `patch` capability covers the refresh-annotation patch the
# backend writes after rotate / min-DV mutations to wake the
# reconciler for status mirroring.
- apiGroups: [security.kube-dc.com]
  resources: [managedsecrets, managedcertificates, databasecredentialpolicies]
  verbs: [get, list, watch, update, patch]
- apiGroups: [security.kube-dc.com]
  resources: [kmskeys]
  verbs: [get, list, watch, create, update, patch]
- apiGroups: [security.kube-dc.com]
  resources: [managedsecrets/status, managedcertificates/status, kmskeys/status, databasecredentialpolicies/status]
  verbs: [get, list, watch]

---
# User Role - Read-only access to project resources
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: default-project-user-role
rules:
# Core resources - read only (no secrets)
- apiGroups: [""]
  resources: [persistentvolumeclaims, services, serviceaccounts, configmaps]
  verbs: [get, list]
- apiGroups: [""]
  resources: [resourcequotas]
  verbs: [get, list]
- apiGroups: [""]
  resources: [limitranges]
  verbs: [get, list]
- apiGroups: [""]
  resources: [endpoints]
  verbs: [get, list]
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list]
- apiGroups: [""]
  resources: [pods/log]
  verbs: [get]
- apiGroups: [""]
  resources: [events]
  verbs: [get, list]
# Metrics (kubectl top pods)
- apiGroups: [metrics.k8s.io]
  resources: [pods]
  verbs: [get, list]
# Apps - read only
- apiGroups: [apps]
  resources: [deployments, daemonsets, replicasets, statefulsets]
  verbs: [get, list]
{{- if .Values.gpu.tenantDirectApply }}
# Shared GPU (DRA) read-only visibility
- apiGroups: [resource.k8s.io]
  resources: [resourceclaimtemplates, resourceclaims]
  verbs: [get, list]
{{- end }}
# Networking - read only
- apiGroups: [k8s.cni.cncf.io]
  resources: [network-attachment-definitions]
  verbs: [get, list]
- apiGroups: [networking.k8s.io]
  resources: [ingresses]
  verbs: [get, list]
# KubeVirt VMs - read only (no console)
- apiGroups: [kubevirt.io]
  resources: [virtualmachines, virtualmachineinstances]
  verbs: [get, list]
- apiGroups: [subresources.kubevirt.io]
  resources: [virtualmachineinstances/guestosinfo]
  verbs: [get]
# CDI - read only
- apiGroups: [cdi.kubevirt.io]
  resources: ["*"]
  verbs: [get, list]
# VolumeSnapshots — read golden images for the instant-clone (vm-startup Phase C+D)
- apiGroups: [snapshot.storage.k8s.io]
  resources: [volumesnapshots]
  verbs: [get, list]
# Autoscaling - read only
- apiGroups: [autoscaling]
  resources: [horizontalpodautoscalers]
  verbs: [get, list]
# Cluster API - read only
- apiGroups: [cluster.x-k8s.io]
  resources: [clusters, machinedeployments]
  verbs: [get, list]
# Batch - read only. cronjobs added in M1-T11 review pass: the
# /api/secrets/{name}/consumers scanner lists CronJobs alongside
# the other workload kinds, and the dev-scope §6 matrix puts that
# endpoint at `user` minimum role — without `cronjobs` list here
# the scan returned a partial 403 on every user-role call.
- apiGroups: [batch]
  resources: [jobs, cronjobs]
  verbs: [get, list]
# Kube-DC resources - read only
- apiGroups: [kube-dc.com]
  resources: [eips, fips]
  verbs: [get, list]
- apiGroups: [k8s.kube-dc.com]
  resources: [kdcclusters, kdcclusterdatastores]
  verbs: [get, list]
# Cert-manager - read only
- apiGroups: [cert-manager.io]
  resources: [issuers, certificates]
  verbs: [get, list]
- apiGroups: [acme.cert-manager.io]
  resources: [challenges]
  verbs: [get, list]
# Policy - read only
- apiGroups: [policy]
  resources: [poddisruptionbudgets]
  verbs: [get, list]
# Discovery
- apiGroups: [discovery.k8s.io]
  resources: [endpointslices]
  verbs: [get, list]
# Gateway API - read only
- apiGroups: [gateway.networking.k8s.io]
  resources: [httproutes, grpcroutes, tlsroutes]
  verbs: [get, list]
- apiGroups: [gateway.envoyproxy.io]
  resources: [backends]
  verbs: [get, list]
# Object Storage - read only
- apiGroups: [objectbucket.io]
  resources: [objectbucketclaims]
  verbs: [get, list]
# Database Service - read only
- apiGroups: [db.kube-dc.com]
  resources: [kdcdatabases]
  verbs: [get, list]
# Service metadata is readable like the legacy database metadata; no values,
# engine writes, placement mutation or credential operations are granted.
- apiGroups: [services.kube-dc.com]
  resources: [managedservices, managedservices/status, serviceoperations, serviceoperations/status, servicebindings, servicebindings/status, servicecredentialpolicies, servicecredentialpolicies/status, serviceplacements, serviceplacements/status, servicebackups, servicebackups/status]
  verbs: [get, list, watch]
# Database Engine Resources - read only
- apiGroups: [postgresql.cnpg.io]
  resources: [backups, scheduledbackups, clusters]
  verbs: [get, list]
- apiGroups: [k8s.mariadb.com]
  resources: [physicalbackups, backups, databases, users, grants, mariadbs]
  verbs: [get, list]
# Velero - read only
- apiGroups: [velero.io]
  resources: [backups, restores, schedules, backupstoragelocations]
  verbs: [get, list]
- apiGroups: [velero.io]
  resources: [backups/status, restores/status]
  verbs: [get, list]
# Kube-DC Security Manager (M1+) — user role gets metadata-only reads.
# Values are gated by OpenBao policy (project-<p>-user only has
# metadata read, not data), but K8s RBAC still controls whether the
# user can even see the CR list.
- apiGroups: [security.kube-dc.com]
  resources: [managedsecrets, managedcertificates, kmskeys, databasecredentialpolicies]
  verbs: [get, list, watch]
- apiGroups: [security.kube-dc.com]
  resources: [managedsecrets/status, managedcertificates/status, kmskeys/status, databasecredentialpolicies/status]
  verbs: [get, list, watch]
