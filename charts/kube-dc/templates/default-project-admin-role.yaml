---
# Project Manager Role - Can view all resources, manage some settings (no VM/container CRUD)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: default-project-manager-role
rules:
# Core resources - read + limited write
- apiGroups: [""]
  resources: [persistentvolumeclaims, services, serviceaccounts, configmaps]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, list]
- apiGroups: [""]
  resources: [resourcequotas]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [limitranges]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [endpoints]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [pods/log]
  verbs: [get, list]
- apiGroups: [""]
  resources: [events]
  verbs: [get, list, watch]
# Metrics (kubectl top pods)
- apiGroups: [metrics.k8s.io]
  resources: [pods]
  verbs: [get, list]
# Apps - read only
- apiGroups: [apps]
  resources: [deployments, daemonsets, replicasets, statefulsets]
  verbs: [get, list, watch]
{{- if .Values.gpu.tenantDirectApply }}
# Shared GPU (DRA) read-only visibility
- apiGroups: [resource.k8s.io]
  resources: [resourceclaimtemplates, resourceclaims]
  verbs: [get, list, watch]
{{- end }}
# Networking - read only
- apiGroups: [k8s.cni.cncf.io]
  resources: [network-attachment-definitions]
  verbs: [get, list]
- apiGroups: [networking.k8s.io]
  resources: [ingresses]
  verbs: [get, list, watch]
# KubeVirt VMs - read + console access
- apiGroups: [kubevirt.io]
  resources: [virtualmachines, virtualmachineinstances]
  verbs: [get, list, watch]
- apiGroups: [subresources.kubevirt.io]
  resources: [virtualmachineinstances/guestosinfo, virtualmachineinstances/filesystemlist, virtualmachineinstances/console, virtualmachineinstances/vnc]
  verbs: [get]
# CDI - read only
- apiGroups: [cdi.kubevirt.io]
  resources: ["*"]
  verbs: [get, list, watch]
# VolumeSnapshots — read golden images for the instant-clone (vm-startup Phase C+D)
- apiGroups: [snapshot.storage.k8s.io]
  resources: [volumesnapshots]
  verbs: [get, list, watch]
# Autoscaling - read only
- apiGroups: [autoscaling]
  resources: [horizontalpodautoscalers]
  verbs: [get, list, watch]
# Cluster API - read only
# Worker inventory is read-only, including for project administrators.
- apiGroups: [cluster.x-k8s.io]
  resources: [machines]
  verbs: [get, list, watch]
- apiGroups: [cluster.x-k8s.io]
  resources: [clusters, machinedeployments]
  verbs: [get, list, watch]
- apiGroups: [controlplane.cluster.x-k8s.io]
  resources: [kthreescontrolplanes]
  verbs: [get, list, watch]
- apiGroups: [infrastructure.cluster.x-k8s.io]
  resources: [kubevirtmachinetemplates, kubevirtclusters]
  verbs: [get, list, watch]
# Batch - read only
- apiGroups: [batch]
  resources: [jobs, cronjobs]
  verbs: [get, list, watch]
# Kube-DC resources - read only
- apiGroups: [kube-dc.com]
  resources: [eips, fips]
  verbs: [get, list, watch]
- apiGroups: [k8s.kube-dc.com]
  resources: [kdcclusters, kdcclusterdatastores]
  verbs: [get, list, watch]
# Cert-manager - read only
- apiGroups: [cert-manager.io]
  resources: [issuers, certificates]
  verbs: [get, list, watch]
- apiGroups: [acme.cert-manager.io]
  resources: [challenges]
  verbs: [get, list, watch]
# Policy - read only
- apiGroups: [policy]
  resources: [poddisruptionbudgets]
  verbs: [get, list, watch]
# Discovery
- apiGroups: [discovery.k8s.io]
  resources: [endpointslices]
  verbs: [get, list]
# Gateway API - read only
- apiGroups: [gateway.networking.k8s.io]
  resources: [httproutes, grpcroutes, tlsroutes]
  verbs: [get, list, watch]
- apiGroups: [gateway.envoyproxy.io]
  resources: [backends]
  verbs: [get, list, watch]
# Object Storage - read only
- apiGroups: [objectbucket.io]
  resources: [objectbucketclaims]
  verbs: [get, list, watch]
# Database Service - read only
- apiGroups: [db.kube-dc.com]
  resources: [kdcdatabases]
  verbs: [get, list, watch]
# Managed services (kube-dc-services) - read only
- apiGroups: [services.kube-dc.com]
  resources: [replicationgroups, managedservices, managedservices/status, serviceoperations, serviceoperations/status, servicebindings, servicebindings/status, servicecredentialpolicies, servicecredentialpolicies/status, serviceplacements, serviceplacements/status, servicebackups, servicebackups/status, replicationgroups/status, topologychanges, topologychanges/status, servicedataplanegrants, servicedataplanegrants/status]
  verbs: [get, list, watch]
# Service offerings (kube-dc-services service-offerings design, Tenant RBAC):
# every Project role reads the plans offered to the Project and, reserved for
# Stage 2, their prices. Read only: offerings are written by the platform's
# kube-dc-offerings projector, never by a tenant, and nothing here grants
# serviceofferings/status or any write verb (chart contract test).
- apiGroups: [services.kube-dc.com]
  resources: [serviceofferings, serviceofferingprices]
  verbs: [get, list, watch]
# Match legacy credential-policy access: project-manager may pause or adjust
# an existing schedule, but may not create/delete policy objects.
- apiGroups: [services.kube-dc.com]
  resources: [servicecredentialpolicies]
  verbs: [update, patch]
# Database Engine Resources - read only
- apiGroups: [postgresql.cnpg.io]
  resources: [backups, scheduledbackups, clusters]
  verbs: [get, list, watch]
- apiGroups: [k8s.mariadb.com]
  resources: [physicalbackups, backups, databases, users, grants, mariadbs]
  verbs: [get, list, watch]
# Velero - read only
- apiGroups: [velero.io]
  resources: [backups, restores, schedules, backupstoragelocations]
  verbs: [get, list, watch]
- apiGroups: [velero.io]
  resources: [backups/status, restores/status]
  verbs: [get, list, watch]
# Kube-DC Security Manager — project-manager reads everything and
# toggles sync configuration on secrets/certs/DB-creds; cannot
# create new secrets/certs (per dev-scope §6, that's developer-and-
# above). On KMS the design inverts: kmskeys create + rotate +
# min-decryption-version are project-manager+ (UX PRD §4.3), so PM
# gets create + patch on kmskeys. Schedule/cancel-delete are
# admin-only and gated by a backend SSAR check (M3-T02 review-pass);
# PM's `patch` capability covers the refresh-annotation patch the
# backend writes after rotate / min-DV mutations to wake the
# reconciler for status mirroring.
- apiGroups: [security.kube-dc.com]
  resources: [managedsecrets, managedcertificates, databasecredentialpolicies]
  verbs: [get, list, watch, update, patch]
- apiGroups: [security.kube-dc.com]
  resources: [kmskeys]
  verbs: [get, list, watch, create, update, patch]
- apiGroups: [security.kube-dc.com]
  resources: [managedsecrets/status, managedcertificates/status, kmskeys/status, databasecredentialpolicies/status]
  verbs: [get, list, watch]
{{- if (.Values.platformOperations | default dict).enabled }}
# Typed KMS operations (platform.kube-dc.com; docs/internal/platform-api-typed-operations.md),
# the OpenBao transit tiers as RBAC: encrypt for every role, decrypt for developer+.
- apiGroups: [platform.kube-dc.com]
  resources: [kmsencryptions, kmsdecryptions]
  verbs: [create]
- apiGroups: [security.kube-dc.com]
  resources: [kmskeys/encrypt, kmskeys/decrypt]
  verbs: [create]
# ManagedSecret values, the OpenBao KV tiers as RBAC: developer+ read and write.
- apiGroups: [platform.kube-dc.com]
  resources: [managedsecretvalues]
  verbs: [get, update]
# KMSKey rotation and database credentials, the OpenBao tiers as RBAC:
# project-manager+ rotate and read static credentials; developer+ issue
# dynamic ones.
- apiGroups: [platform.kube-dc.com]
  resources: [kmskeyrotations, databasecredentials, databasecredentialissues, databasecredentialrotations]
  verbs: [create, get]
- apiGroups: [security.kube-dc.com]
  resources: [kmskeys/rotate, databasecredentialpolicies/issue, databasecredentialpolicies/rotate]
  verbs: [create]
# The project's platform audit log (every project role, as in the console).
- apiGroups: [platform.kube-dc.com]
  resources: [auditevents]
  verbs: [list]
{{- end }}

