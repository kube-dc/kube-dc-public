# =============================================================================
# Project Role Templates
# These roles are copied to each project namespace during project creation.
# =============================================================================

---
# Admin Role - Full access to all project resources
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: default-project-admin-role
rules:
# Core resources
- apiGroups: [""]
  resources: [persistentvolumeclaims, services, secrets, serviceaccounts, configmaps]
  # Explicit verbs: a wildcard would also grant impersonate (ServiceAccounts) and
  # escalate/bind (Roles, RoleBindings), which let a project identity act as the
  # managed engines' accounts or mint roles it does not hold.
  verbs: [get, list, watch, create, update, patch, delete, deletecollection]
# serviceaccounts/token is a SEPARATE RBAC resource from serviceaccounts: the grant
# above does not confer it. Without this rule a project admin has no way to obtain a
# non-interactive credential at all -- `kubectl create token` is Forbidden, and the
# legacy kubernetes.io/service-account-token Secret is refused by the
# managed-references webhook (the token controller fills such a Secret with a
# NON-EXPIRING credential for whichever account holds that name when it gets there,
# a race no lookup can close). That left CI/CD with no supported path.
#
# Safe because the gate already exists: ManagedServiceAccountTokenValidator admits a
# TokenRequest only for an account WITHOUT services.kube-dc.com/managed-by, so a
# project admin can mint for their own ci-deploy account but not for a managed
# engine's (CNPG runs each instance under a ServiceAccount named after its Cluster,
# in the project namespace). That webhook's own comment anticipates "a project admin
# who holds create on serviceaccounts/token" -- it was written for this grant.
#
# Admin only. Developer, manager and user roles must NOT hold this: minting a
# credential is an administrative act.
- apiGroups: [""]
  resources: [serviceaccounts/token]
  verbs: [create]
- apiGroups: [""]
  resources: [resourcequotas]
  # ResourceQuotas are owned by the HNC and kube-dc quota controllers. Tenant
  # mutation would let a project admin spoof quota attribution in API/UI data.
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [limitranges]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [endpoints]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [pods]
  verbs: [create, get, list, watch, delete]
- apiGroups: [""]
  resources: [pods/log]
  verbs: [get, list]
- apiGroups: [""]
  resources: [events]
  verbs: [get, list, watch]
# Metrics (kubectl top pods)
- apiGroups: [metrics.k8s.io]
  resources: [pods]
  verbs: [get, list]
# Apps
- apiGroups: [apps]
  resources: [deployments]
  verbs: ["*"]
{{- if .Values.gpu.tenantDirectApply }}
# Shared GPU (DRA) self-service. The DRA shape admission policies force the exact
# fixed product and the per-DeviceClass ResourceQuota bounds count, so this grant
# cannot exceed the project's GPU entitlement.
- apiGroups: [resource.k8s.io]
  resources: [resourceclaimtemplates]
  verbs: [create, get, list, watch, update, patch, delete]
- apiGroups: [resource.k8s.io]
  resources: [resourceclaims]
  verbs: [get, list, watch]
{{- end }}
# update/patch as developer has them: admin must hold every Project role's
# rules so an org-admin can bind any of them to the project's ServiceAccounts
# (TestProjectAdminRoleCoversEveryProjectRole).
- apiGroups: [apps]
  resources: [daemonsets, replicasets, statefulsets]
  verbs: [create, get, list, watch, delete, update, patch]
# RBAC
- apiGroups: [rbac.authorization.k8s.io]
  resources: [roles, rolebindings]
  # Explicit verbs: a wildcard would also grant impersonate (ServiceAccounts) and
  # escalate/bind (Roles, RoleBindings), which let a project identity act as the
  # managed engines' accounts or mint roles it does not hold.
  verbs: [get, list, watch, create, update, patch, delete, deletecollection]
# Networking
- apiGroups: [k8s.cni.cncf.io]
  resources: [network-attachment-definitions]
  verbs: [get, list]
- apiGroups: [networking.k8s.io]
  resources: [ingresses]
  verbs: [create, get, list, watch, delete]
# KubeVirt VMs
- apiGroups: [kubevirt.io]
  resources: [virtualmachines, virtualmachineinstances]
  verbs: ["*"]
- apiGroups: [subresources.kubevirt.io]
  resources: [virtualmachineinstances/guestosinfo, virtualmachineinstances/filesystemlist, virtualmachineinstances/console, virtualmachineinstances/vnc]
  verbs: [get]
- apiGroups: [subresources.kubevirt.io]
  resources: [virtualmachines/start, virtualmachines/stop, virtualmachines/restart, virtualmachines/addvolume, virtualmachines/removevolume, virtualmachines/migrate, virtualmachines/memorydump, virtualmachines/pause]
  verbs: [update]
- apiGroups: [subresources.kubevirt.io]
  resources: [virtualmachineinstances/pause, virtualmachineinstances/unpause, virtualmachineinstances/addvolume, virtualmachineinstances/removevolume, virtualmachineinstances/freeze, virtualmachineinstances/unfreeze, virtualmachineinstances/softreboot, virtualmachineinstances/sev/setupsession, virtualmachineinstances/sev/injectlaunchsecret]
  verbs: [update]
- apiGroups: [subresources.kubevirt.io]
  resources: [virtualmachines/expand-spec]
  verbs: [update]
# CDI (Containerized Data Importer)
- apiGroups: [cdi.kubevirt.io]
  resources: ["*"]
  verbs: ["*"]
# VolumeSnapshots — read golden images for the instant-clone (vm-startup Phase C+D)
- apiGroups: [snapshot.storage.k8s.io]
  resources: [volumesnapshots]
  verbs: [get, list, watch]
# Autoscaling
- apiGroups: [autoscaling]
  resources: [horizontalpodautoscalers]
  verbs: ["*"]
# Cluster API (KDC Clusters)
# Worker inventory is read-only, including for project administrators.
- apiGroups: [cluster.x-k8s.io]
  resources: [machines]
  verbs: [get, list, watch]
- apiGroups: [cluster.x-k8s.io]
  resources: [clusters, machinedeployments]
  verbs: ["*"]
- apiGroups: [controlplane.cluster.x-k8s.io]
  resources: [kthreescontrolplanes]
  verbs: ["*"]
- apiGroups: [infrastructure.cluster.x-k8s.io]
  resources: [kubevirtmachinetemplates, kubevirtclusters]
  verbs: ["*"]
- apiGroups: [bootstrap.cluster.x-k8s.io]
  resources: [kthreesconfigtemplates]
  verbs: ["*"]
- apiGroups: [addons.cluster.x-k8s.io]
  resources: [clusterresourcesets]
  verbs: ["*"]
# Batch
- apiGroups: [batch]
  resources: [jobs]
  verbs: [create, get, list, watch, delete]
# CronJobs: the authority Jobs already have, plus update and patch.
# Owner decision 2026-10-16; previously read-only.
#
# A CronJob is a Job with a schedule, so creating one confers nothing that
# creating a Job does not. Every CREATE and UPDATE still passes the same three
# project admission policies a Job passes: pod security (no host access, no
# privileged containers), reserved platform identities (labels, owner
# references, reserved ServiceAccounts) and managed-service template markers.
#
# update and patch are granted where Jobs have none because a CronJob is
# long-lived and mutable: suspend and resume, schedule and image changes, and
# a plain `kubectl apply` of one that already exists all need them. A Job's
# pod template is immutable, so Jobs never needed them.
#
# Platform-owned CronJobs also live in project namespaces (the managed-cluster
# <cluster>-etcd-backup, db-manager backup post-processing). Editing or
# deleting one is NOT equivalent to creating a Job: it would stop or take over
# the real schedule. protect-platform-cronjobs-in-projects
# (vap-protect-platform-cronjobs.yaml) refuses tenant UPDATE and DELETE of
# those, judged from the stored object.
#
# The Danger Zone "Take snapshot now" still reads the etcd-backup jobTemplate
# to create a one-off Job from it.
- apiGroups: [batch]
  resources: [cronjobs]
  verbs: [create, get, list, watch, update, patch, delete]
# Leases: leader election for tenant controllers (owner decision 2026-10-17;
# client-go's leaderelection supports no other lock since the ConfigMap lock
# was removed). A Lease confers nothing outside the namespace; platform Leases
# are kube-system/kube-dc, out of reach. protect-platform-leases-in-projects
# (vap-protect-platform-leases.yaml) refuses tenant UPDATE and DELETE of a
# platform-marked Lease should a platform controller ever elect in a project.
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [create, get, list, watch, update, patch, delete]
# Kube-DC resources
- apiGroups: [kube-dc.com]
  resources: [eips, fips]
  # update/patch: server-side apply (Terraform, kubectl apply --server-side)
  # creates with PATCH. Nothing settable here that create does not allow.
  verbs: [create, get, list, watch, update, patch, delete]
{{- if .Values.routedNetwork.enabled }}
- apiGroups: [kube-dc.com]
  resources: [projectrouteattachments]
  verbs: [create, get, list, watch, delete]
{{- end }}
- apiGroups: [k8s.kube-dc.com]
  resources: [kdcclusters, kdcclusterdatastores]
  verbs: [create, get, list, watch, delete, patch, update]
# Cert-manager
- apiGroups: [cert-manager.io]
  resources: [issuers, certificates]
  verbs: [create, get, list, watch, delete]
- apiGroups: [acme.cert-manager.io]
  resources: [challenges]
  verbs: [get, list, watch, delete]
# Policy
- apiGroups: [policy]
  resources: [poddisruptionbudgets]
  verbs: [create, get, list, watch, delete]
# Discovery
- apiGroups: [discovery.k8s.io]
  resources: [endpointslices]
  verbs: [get, list]
# Gateway API
# Routes on the shared Gateway are created only by platform controllers from
# Service annotations; tenants never write them. RBAC enforces it.
- apiGroups: [gateway.networking.k8s.io]
  resources: [httproutes, grpcroutes, tlsroutes]
  verbs: [get, list, watch]
- apiGroups: [gateway.envoyproxy.io]
  resources: [backends]
  verbs: [get, list, watch]
# Object Storage (Rook-Ceph S3 buckets)
- apiGroups: [objectbucket.io]
  resources: [objectbucketclaims]
  verbs: [create, get, list, watch, delete]
# Database Service (db-manager)
- apiGroups: [db.kube-dc.com]
  resources: [kdcdatabases]
  verbs: [create, get, list, watch, delete, patch, update]
# Managed services (kube-dc-services): the tenant-facing objects, same rights
# as KdcDatabase. Placements are the hub's; readable so status makes sense.
- apiGroups: [services.kube-dc.com]
  resources: [managedservices, serviceoperations, servicebindings, servicecredentialpolicies, replicationgroups]
  verbs: [create, get, list, watch, delete, patch, update]
# D1: a Project admin registers one of the Project's KdcClusters as a managed
# services data plane with a ServiceDataPlaneGrant. The spec is immutable, so
# no update or patch; the hub writes its status.
- apiGroups: [services.kube-dc.com]
  resources: [servicedataplanegrants]
  verbs: [create, get, list, watch, delete]
- apiGroups: [services.kube-dc.com]
  resources: [servicedataplanegrants/status]
  verbs: [get, list, watch]
- apiGroups: [services.kube-dc.com]
  resources: [managedservices/status, serviceoperations/status, servicebindings/status, servicecredentialpolicies/status, serviceplacements, serviceplacements/status, servicebackups, servicebackups/status, replicationgroups/status, topologychanges, topologychanges/status]
  verbs: [get, list, watch]
# Service offerings (kube-dc-services service-offerings design, Tenant RBAC):
# every Project role reads the plans offered to the Project and, reserved for
# Stage 2, their prices. Read only: offerings are written by the platform's
# kube-dc-offerings projector, never by a tenant, and nothing here grants
# serviceofferings/status or any write verb (chart contract test).
- apiGroups: [services.kube-dc.com]
  resources: [serviceofferings, serviceofferingprices]
  verbs: [get, list, watch]
# Database Engine Resources (CNPG + MariaDB operator)
# `clusters` and `mariadbs` reads let the UI surface engine-side recovery
# progress (status.bootstrap, status.conditions) during a restore.
- apiGroups: [postgresql.cnpg.io]
  resources: [backups, scheduledbackups]
  verbs: [create, get, list, watch, delete]
- apiGroups: [postgresql.cnpg.io]
  resources: [clusters]
  verbs: [get, list, watch]
- apiGroups: [k8s.mariadb.com]
  resources: [physicalbackups, backups, databases, users, grants]
  verbs: [create, get, list, watch, delete]
- apiGroups: [k8s.mariadb.com]
  resources: [mariadbs]
  verbs: [get, list, watch]
# Velero (Backup & Restore)
- apiGroups: [velero.io]
  resources: [backups, restores, schedules, backupstoragelocations]
  verbs: [create, get, list, watch, delete, update, patch]
- apiGroups: [velero.io]
  resources: [backups/status, restores/status]
  verbs: [get, list, watch]
# Kube-DC Security Manager (M1+) — admin gets full CRUD on every
# security CRD in the project namespace. UI/CLI surface lives in
# the backend; the backend re-uses the user's JWT against the K8s
# API so these RBAC rules govern what tenants can do without the
# OpenBao policy layer (defence in depth).
# Archive rotation affects a shared Project claim and is admin-only. patch sets
# spec.abandon, once (CEL keeps every other spec field immutable); the
# kube-dc-archive-rotation-finalizer policy keeps the retirement finalizer
# with the rotation controller. No update: nothing else is writable.
- apiGroups: [security.kube-dc.com]
  resources: [objectbucketkeyrotations]
  verbs: [create, get, list, watch, delete, patch]
- apiGroups: [security.kube-dc.com]
  resources: [managedsecrets, managedcertificates, kmskeys, databasecredentialpolicies]
  verbs: ["*"]
- apiGroups: [security.kube-dc.com]
  resources: [managedsecrets/status, managedcertificates/status, kmskeys/status, databasecredentialpolicies/status]
  verbs: [get, list, watch]
{{- if (.Values.platformOperations | default dict).enabled }}
# Typed KMS operations (platform.kube-dc.com; docs/internal/platform-api-typed-operations.md),
# the OpenBao transit tiers as RBAC: encrypt for every role, decrypt for developer+.
- apiGroups: [platform.kube-dc.com]
  resources: [kmsencryptions, kmsdecryptions]
  verbs: [create]
- apiGroups: [security.kube-dc.com]
  resources: [kmskeys/encrypt, kmskeys/decrypt]
  verbs: [create]
# ManagedSecret values, the OpenBao KV tiers as RBAC: developer+ read and write.
- apiGroups: [platform.kube-dc.com]
  resources: [managedsecretvalues]
  verbs: [get, update]
# KMSKey rotation and database credentials, the OpenBao tiers as RBAC:
# project-manager+ rotate and read static credentials; developer+ issue
# dynamic ones.
- apiGroups: [platform.kube-dc.com]
  resources: [kmskeyrotations, databasecredentials, databasecredentialissues, databasecredentialrotations]
  verbs: [create, get]
- apiGroups: [security.kube-dc.com]
  resources: [kmskeys/rotate, databasecredentialpolicies/issue, databasecredentialpolicies/rotate]
  verbs: [create]
# Destroying ManagedSecret versions for good: admin only (the OpenBao KV tier).
- apiGroups: [platform.kube-dc.com]
  resources: [managedsecretversiondestructions]
  verbs: [create]
- apiGroups: [security.kube-dc.com]
  resources: [managedsecrets/destroy-version]
  verbs: [create]
# The project's platform audit log (every project role, as in the console).
- apiGroups: [platform.kube-dc.com]
  resources: [auditevents]
  verbs: [list]
{{- end }}

---
# Developer Role - Can manage VMs, containers, workloads + project secrets (no RBAC)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: default-project-developer-role
rules:
# Core resources (no secrets write)
- apiGroups: [""]
  resources: [persistentvolumeclaims, services, serviceaccounts, configmaps]
  # Explicit verbs: a wildcard would also grant impersonate (ServiceAccounts) and
  # escalate/bind (Roles, RoleBindings), which let a project identity act as the
  # managed engines' accounts or mint roles it does not hold.
  verbs: [get, list, watch, create, update, patch, delete, deletecollection]
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, list]
- apiGroups: [""]
  resources: [resourcequotas]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [limitranges]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [endpoints]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [pods]
  verbs: [create, get, list, watch, delete]
- apiGroups: [""]
  resources: [pods/log]
  verbs: [get, list]
- apiGroups: [""]
  resources: [events]
  verbs: [get, list, watch]
# Metrics (kubectl top pods)
- apiGroups: [metrics.k8s.io]
  resources: [pods]
  verbs: [get, list]
# Apps
- apiGroups: [apps]
  resources: [deployments, daemonsets, replicasets, statefulsets]
  verbs: [create, get, list, watch, delete, update, patch]
{{- if .Values.gpu.tenantDirectApply }}
# Shared GPU (DRA) self-service — see admin role note.
- apiGroups: [resource.k8s.io]
  resources: [resourceclaimtemplates]
  verbs: [create, get, list, watch, update, patch, delete]
- apiGroups: [resource.k8s.io]
  resources: [resourceclaims]
  verbs: [get, list, watch]
{{- end }}
# Networking
- apiGroups: [k8s.cni.cncf.io]
  resources: [network-attachment-definitions]
  verbs: [get, list]
- apiGroups: [networking.k8s.io]
  resources: [ingresses]
  verbs: [create, get, list, watch, delete]
# KubeVirt VMs - full CRUD
- apiGroups: [kubevirt.io]
  resources: [virtualmachines, virtualmachineinstances]
  verbs: ["*"]
- apiGroups: [subresources.kubevirt.io]
  resources: [virtualmachineinstances/guestosinfo, virtualmachineinstances/filesystemlist, virtualmachineinstances/console, virtualmachineinstances/vnc]
  verbs: [get]
- apiGroups: [subresources.kubevirt.io]
  resources: [virtualmachines/start, virtualmachines/stop, virtualmachines/restart, virtualmachines/addvolume, virtualmachines/removevolume, virtualmachines/migrate, virtualmachines/memorydump, virtualmachines/pause]
  verbs: [update]
- apiGroups: [subresources.kubevirt.io]
  resources: [virtualmachineinstances/pause, virtualmachineinstances/unpause, virtualmachineinstances/addvolume, virtualmachineinstances/removevolume, virtualmachineinstances/freeze, virtualmachineinstances/unfreeze, virtualmachineinstances/softreboot]
  verbs: [update]
- apiGroups: [subresources.kubevirt.io]
  resources: [virtualmachines/expand-spec]
  verbs: [update]
# CDI
- apiGroups: [cdi.kubevirt.io]
  resources: ["*"]
  verbs: ["*"]
# VolumeSnapshots — read golden images for the instant-clone (vm-startup Phase C+D)
- apiGroups: [snapshot.storage.k8s.io]
  resources: [volumesnapshots]
  verbs: [get, list, watch]
# Autoscaling
- apiGroups: [autoscaling]
  resources: [horizontalpodautoscalers]
  verbs: [create, get, list, watch, delete, update, patch]
# KDC Clusters - full CRUD
# Worker inventory is read-only, including for project administrators.
- apiGroups: [cluster.x-k8s.io]
  resources: [machines]
  verbs: [get, list, watch]
- apiGroups: [cluster.x-k8s.io]
  resources: [clusters, machinedeployments]
  verbs: [get, list, watch]
- apiGroups: [k8s.kube-dc.com]
  resources: [kdcclusters, kdcclusterdatastores]
  verbs: [create, get, list, watch, delete, patch, update]
# Batch
- apiGroups: [batch]
  resources: [jobs]
  verbs: [create, get, list, watch, delete]
# CronJobs — see admin role above.
- apiGroups: [batch]
  resources: [cronjobs]
  verbs: [create, get, list, watch, update, patch, delete]
# Leases — see admin role above.
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [create, get, list, watch, update, patch, delete]
# Kube-DC resources
- apiGroups: [kube-dc.com]
  resources: [eips, fips]
  # update/patch: server-side apply (Terraform, kubectl apply --server-side)
  # creates with PATCH. Nothing settable here that create does not allow.
  verbs: [create, get, list, watch, update, patch, delete]
# Cert-manager
- apiGroups: [cert-manager.io]
  resources: [issuers, certificates]
  verbs: [create, get, list, watch, delete]
- apiGroups: [acme.cert-manager.io]
  resources: [challenges]
  verbs: [get, list, watch, delete]
# Policy
- apiGroups: [policy]
  resources: [poddisruptionbudgets]
  verbs: [create, get, list, watch, delete]
# Discovery
- apiGroups: [discovery.k8s.io]
  resources: [endpointslices]
  verbs: [get, list]
# Gateway API
# Routes on the shared Gateway are created only by platform controllers from
# Service annotations; tenants never write them. RBAC enforces it.
- apiGroups: [gateway.networking.k8s.io]
  resources: [httproutes, grpcroutes, tlsroutes]
  verbs: [get, list, watch]
- apiGroups: [gateway.envoyproxy.io]
  resources: [backends]
  verbs: [get, list, watch]
# Object Storage (Rook-Ceph S3 buckets)
- apiGroups: [objectbucket.io]
  resources: [objectbucketclaims]
  verbs: [create, get, list, watch, delete]
# Database Service (db-manager)
- apiGroups: [db.kube-dc.com]
  resources: [kdcdatabases]
  verbs: [create, get, list, watch, delete, patch, update]
# Managed services (kube-dc-services): the tenant-facing objects, same rights
# as KdcDatabase. Placements are the hub's; readable so status makes sense.
- apiGroups: [services.kube-dc.com]
  resources: [managedservices, serviceoperations, servicebindings, servicecredentialpolicies, replicationgroups]
  verbs: [create, get, list, watch, delete, patch, update]
# D1: grants are the Project admin's; other roles read them.
- apiGroups: [services.kube-dc.com]
  resources: [servicedataplanegrants, servicedataplanegrants/status]
  verbs: [get, list, watch]
- apiGroups: [services.kube-dc.com]
  resources: [managedservices/status, serviceoperations/status, servicebindings/status, servicecredentialpolicies/status, serviceplacements, serviceplacements/status, servicebackups, servicebackups/status, replicationgroups/status, topologychanges, topologychanges/status]
  verbs: [get, list, watch]
# Service offerings (kube-dc-services service-offerings design, Tenant RBAC):
# every Project role reads the plans offered to the Project and, reserved for
# Stage 2, their prices. Read only: offerings are written by the platform's
# kube-dc-offerings projector, never by a tenant, and nothing here grants
# serviceofferings/status or any write verb (chart contract test).
- apiGroups: [services.kube-dc.com]
  resources: [serviceofferings, serviceofferingprices]
  verbs: [get, list, watch]
# Database Engine Resources (CNPG + MariaDB operator)
# `clusters` and `mariadbs` reads let the UI surface engine-side recovery
# progress (status.bootstrap, status.conditions) during a restore.
- apiGroups: [postgresql.cnpg.io]
  resources: [backups, scheduledbackups]
  verbs: [create, get, list, watch, delete]
- apiGroups: [postgresql.cnpg.io]
  resources: [clusters]
  verbs: [get, list, watch]
- apiGroups: [k8s.mariadb.com]
  resources: [physicalbackups, backups, databases, users, grants]
  verbs: [create, get, list, watch, delete]
- apiGroups: [k8s.mariadb.com]
  resources: [mariadbs]
  verbs: [get, list, watch]
# Velero (Backup & Restore)
- apiGroups: [velero.io]
  resources: [backups, restores, schedules, backupstoragelocations]
  verbs: [create, get, list, watch, delete, update, patch]
- apiGroups: [velero.io]
  resources: [backups/status, restores/status]
  verbs: [get, list, watch]
# Kube-DC Security Manager — developer gets full CRUD on
# secrets/certs/DB-creds. KMS is locked down to read-only at the
# CR plane (per M3 review): create/rotate/min-DV/schedule/cancel
# are project-manager+ via OpenBao policy + backend SSAR. encrypt
# and decrypt go through the backend's data-plane endpoints which
# only need `get kmskeys` (loadKMSKey for the keyName lookup).
# Hard destroy (?destroy=true on secrets) is gated at the backend;
# K8s API just sees soft-delete semantics on the CR.
- apiGroups: [security.kube-dc.com]
  resources: [managedsecrets, managedcertificates, databasecredentialpolicies]
  verbs: [create, get, list, watch, update, patch, delete]
- apiGroups: [security.kube-dc.com]
  resources: [kmskeys]
  verbs: [get, list, watch]
- apiGroups: [security.kube-dc.com]
  resources: [managedsecrets/status, managedcertificates/status, kmskeys/status, databasecredentialpolicies/status]
  verbs: [get, list, watch]
{{- if (.Values.platformOperations | default dict).enabled }}
# Typed KMS operations (platform.kube-dc.com; docs/internal/platform-api-typed-operations.md),
