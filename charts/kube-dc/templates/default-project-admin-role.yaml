# =============================================================================
# Project Role Templates
# These roles are copied to each project namespace during project creation.
# =============================================================================

---
# Admin Role - Full access to all project resources
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: default-project-admin-role
rules:
# Core resources
- apiGroups: [""]
  resources: [persistentvolumeclaims, services, secrets, serviceaccounts, configmaps]
  # Explicit verbs: a wildcard would also grant impersonate (ServiceAccounts) and
  # escalate/bind (Roles, RoleBindings), which let a project identity act as the
  # managed engines' accounts or mint roles it does not hold.
  verbs: [get, list, watch, create, update, patch, delete, deletecollection]
# serviceaccounts/token is a SEPARATE RBAC resource from serviceaccounts: the grant
# above does not confer it. Without this rule a project admin has no way to obtain a
# non-interactive credential at all -- `kubectl create token` is Forbidden, and the
# legacy kubernetes.io/service-account-token Secret is refused by the
# managed-references webhook (the token controller fills such a Secret with a
# NON-EXPIRING credential for whichever account holds that name when it gets there,
# a race no lookup can close). That left CI/CD with no supported path.
#
# Safe because the gate already exists: ManagedServiceAccountTokenValidator admits a
# TokenRequest only for an account WITHOUT services.kube-dc.com/managed-by, so a
# project admin can mint for their own ci-deploy account but not for a managed
# engine's (CNPG runs each instance under a ServiceAccount named after its Cluster,
# in the project namespace). That webhook's own comment anticipates "a project admin
# who holds create on serviceaccounts/token" -- it was written for this grant.
#
# Admin only. Developer, manager and user roles must NOT hold this: minting a
# credential is an administrative act.
- apiGroups: [""]
  resources: [serviceaccounts/token]
  verbs: [create]
- apiGroups: [""]
  resources: [resourcequotas]
  # ResourceQuotas are owned by the HNC and kube-dc quota controllers. Tenant
  # mutation would let a project admin spoof quota attribution in API/UI data.
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [limitranges]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [endpoints]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [pods]
  verbs: [create, get, list, watch, delete]
- apiGroups: [""]
  resources: [pods/log]
  verbs: [get, list]
- apiGroups: [""]
  resources: [events]
  verbs: [get, list, watch]
# Metrics (kubectl top pods)
- apiGroups: [metrics.k8s.io]
  resources: [pods]
  verbs: [get, list]
# Apps
- apiGroups: [apps]
  resources: [deployments]
  verbs: ["*"]
{{- if .Values.gpu.tenantDirectApply }}
# Shared GPU (DRA) self-service. The DRA shape admission policies force the exact
# fixed product and the per-DeviceClass ResourceQuota bounds count, so this grant
# cannot exceed the project's GPU entitlement.
- apiGroups: [resource.k8s.io]
  resources: [resourceclaimtemplates]
  verbs: [create, get, list, watch, update, patch, delete]
- apiGroups: [resource.k8s.io]
  resources: [resourceclaims]
  verbs: [get, list, watch]
{{- end }}
- apiGroups: [apps]
  resources: [daemonsets, replicasets, statefulsets]
  verbs: [create, get, list, watch, delete]
# RBAC
- apiGroups: [rbac.authorization.k8s.io]
  resources: [roles, rolebindings]
  # Explicit verbs: a wildcard would also grant impersonate (ServiceAccounts) and
  # escalate/bind (Roles, RoleBindings), which let a project identity act as the
  # managed engines' accounts or mint roles it does not hold.
  verbs: [get, list, watch, create, update, patch, delete, deletecollection]
# Networking
- apiGroups: [k8s.cni.cncf.io]
  resources: [network-attachment-definitions]
  verbs: [get, list]
- apiGroups: [networking.k8s.io]
  resources: [ingresses]
  verbs: [create, get, list, watch, delete]
# KubeVirt VMs
- apiGroups: [kubevirt.io]
  resources: [virtualmachines, virtualmachineinstances]
  verbs: ["*"]
- apiGroups: [subresources.kubevirt.io]
  resources: [virtualmachineinstances/guestosinfo, virtualmachineinstances/console, virtualmachineinstances/vnc]
  verbs: [get]
- apiGroups: [subresources.kubevirt.io]
  resources: [virtualmachines/start, virtualmachines/stop, virtualmachines/restart, virtualmachines/addvolume, virtualmachines/removevolume, virtualmachines/migrate, virtualmachines/memorydump, virtualmachines/pause]
  verbs: [update]
- apiGroups: [subresources.kubevirt.io]
  resources: [virtualmachineinstances/pause, virtualmachineinstances/unpause, virtualmachineinstances/addvolume, virtualmachineinstances/removevolume, virtualmachineinstances/freeze, virtualmachineinstances/unfreeze, virtualmachineinstances/softreboot, virtualmachineinstances/sev/setupsession, virtualmachineinstances/sev/injectlaunchsecret]
  verbs: [update]
- apiGroups: [subresources.kubevirt.io]
  resources: [virtualmachines/expand-spec]
  verbs: [update]
# CDI (Containerized Data Importer)
- apiGroups: [cdi.kubevirt.io]
  resources: ["*"]
  verbs: ["*"]
# VolumeSnapshots — read golden images for the instant-clone (vm-startup Phase C+D)
- apiGroups: [snapshot.storage.k8s.io]
  resources: [volumesnapshots]
  verbs: [get, list, watch]
# Autoscaling
- apiGroups: [autoscaling]
  resources: [horizontalpodautoscalers]
  verbs: ["*"]
# Cluster API (KDC Clusters)
- apiGroups: [cluster.x-k8s.io]
  resources: [clusters, machinedeployments]
  verbs: ["*"]
- apiGroups: [controlplane.cluster.x-k8s.io]
  resources: [kthreescontrolplanes]
  verbs: ["*"]
- apiGroups: [infrastructure.cluster.x-k8s.io]
  resources: [kubevirtmachinetemplates, kubevirtclusters]
  verbs: ["*"]
- apiGroups: [bootstrap.cluster.x-k8s.io]
  resources: [kthreesconfigtemplates]
  verbs: ["*"]
- apiGroups: [addons.cluster.x-k8s.io]
  resources: [clusterresourcesets]
  verbs: ["*"]
# Batch
- apiGroups: [batch]
  resources: [jobs]
  verbs: [create, get, list, watch, delete]
# CronJobs read — the Danger Zone "Take snapshot now" reads the daily
# <cluster>-etcd-backup CronJob's jobTemplate so it can create a one-off
# manual Job from the same spec. Read-only is enough.
- apiGroups: [batch]
  resources: [cronjobs]
  verbs: [get, list, watch]
# Kube-DC resources
- apiGroups: [kube-dc.com]
  resources: [eips, fips]
  verbs: [create, get, list, watch, delete]
{{- if .Values.routedNetwork.enabled }}
- apiGroups: [kube-dc.com]
  resources: [projectrouteattachments]
  verbs: [create, get, list, watch, delete]
{{- end }}
- apiGroups: [k8s.kube-dc.com]
  resources: [kdcclusters, kdcclusterdatastores]
  verbs: [create, get, list, watch, delete, patch, update]
# Cert-manager
- apiGroups: [cert-manager.io]
  resources: [issuers, certificates]
  verbs: [create, get, list, watch, delete]
- apiGroups: [acme.cert-manager.io]
  resources: [challenges]
  verbs: [get, list, watch, delete]
# Policy
- apiGroups: [policy]
  resources: [poddisruptionbudgets]
  verbs: [create, get, list, watch, delete]
# Discovery
- apiGroups: [discovery.k8s.io]
  resources: [endpointslices]
  verbs: [get, list]
# Gateway API
- apiGroups: [gateway.networking.k8s.io]
  resources: [httproutes, grpcroutes, tlsroutes]
  verbs: [create, get, list, watch, delete, update, patch]
- apiGroups: [gateway.envoyproxy.io]
  resources: [backends]
  verbs: [get, list, watch]
# Object Storage (Rook-Ceph S3 buckets)
- apiGroups: [objectbucket.io]
  resources: [objectbucketclaims]
  verbs: [create, get, list, watch, delete]
# Database Service (db-manager)
- apiGroups: [db.kube-dc.com]
  resources: [kdcdatabases]
  verbs: [create, get, list, watch, delete, patch, update]
# Managed services (kube-dc-services): the tenant-facing objects, same rights
# as KdcDatabase. Placements are the hub's; readable so status makes sense.
- apiGroups: [services.kube-dc.com]
  resources: [managedservices, serviceoperations, servicebindings, servicecredentialpolicies]
  verbs: [create, get, list, watch, delete, patch, update]
- apiGroups: [services.kube-dc.com]
  resources: [managedservices/status, serviceoperations/status, servicebindings/status, servicecredentialpolicies/status, serviceplacements, serviceplacements/status, servicebackups, servicebackups/status]
  verbs: [get, list, watch]
# Database Engine Resources (CNPG + MariaDB operator)
# `clusters` and `mariadbs` reads let the UI surface engine-side recovery
# progress (status.bootstrap, status.conditions) during a restore.
- apiGroups: [postgresql.cnpg.io]
  resources: [backups, scheduledbackups]
  verbs: [create, get, list, watch, delete]
- apiGroups: [postgresql.cnpg.io]
  resources: [clusters]
  verbs: [get, list, watch]
- apiGroups: [k8s.mariadb.com]
  resources: [physicalbackups, backups, databases, users, grants]
  verbs: [create, get, list, watch, delete]
- apiGroups: [k8s.mariadb.com]
  resources: [mariadbs]
  verbs: [get, list, watch]
# Velero (Backup & Restore)
- apiGroups: [velero.io]
  resources: [backups, restores, schedules, backupstoragelocations]
  verbs: [create, get, list, watch, delete, update, patch]
- apiGroups: [velero.io]
  resources: [backups/status, restores/status]
  verbs: [get, list, watch]
# Kube-DC Security Manager (M1+) — admin gets full CRUD on every
# security CRD in the project namespace. UI/CLI surface lives in
# the backend; the backend re-uses the user's JWT against the K8s
# API so these RBAC rules govern what tenants can do without the
# OpenBao policy layer (defence in depth).
- apiGroups: [security.kube-dc.com]
  resources: [managedsecrets, managedcertificates, kmskeys, databasecredentialpolicies]
  verbs: ["*"]
- apiGroups: [security.kube-dc.com]
  resources: [managedsecrets/status, managedcertificates/status, kmskeys/status, databasecredentialpolicies/status]
  verbs: [get, list, watch]

