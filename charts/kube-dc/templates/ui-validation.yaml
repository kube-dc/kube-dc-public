{{- if and .Values.ui.enabled (not .Values.backend.consoleApi.enabled) -}}
{{- fail "ui.enabled requires backend.consoleApi.enabled and a compatible backend image" -}}
{{- end -}}
{{- if .Values.backend.consoleApi.enabled -}}
{{- if and (or .Values.backend.autoscaling.enabled (ne (int .Values.backend.replicaCount) 1)) (not (.Values.backend.sealedTickets | default dict).keySecretName) -}}
{{- fail "Console API v1 with more than one replica requires backend.sealedTickets.keySecretName (tickets every replica can open)" -}}
{{- end -}}
{{- end -}}
