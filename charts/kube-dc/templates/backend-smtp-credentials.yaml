{{- /* The backend's SMTP password, out of the Deployment spec: env values are
readable by anyone who can read the Deployment. Not rendered when the
installation names its own Secret (backend.smtp.existingSecret). Unrelated to
the UI-owned smtp-settings runtime Secret, which the chart never manages. */}}
{{- if and .Values.backend.smtp.enabled (not .Values.backend.smtp.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kube-dc.backend.fullname" . }}-smtp-credentials
  labels:
    {{- include "kube-dc.backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.backend.smtp.password | quote }}
{{- end }}
