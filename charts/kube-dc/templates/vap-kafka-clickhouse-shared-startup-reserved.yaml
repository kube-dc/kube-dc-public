{{- /*
The pure refusals of kafka-shared-startup-v1 and clickhouse-shared-startup-v1,
as ValidatingAdmissionPolicies. Step 3 of
docs/prd/admission-webhooks-must-not-block-the-platform.md; as built in
docs/prd/admission-webhooks-step3-kafka-clickhouse.md.

From hand-off phase 2 the authority entry routes only objects carrying the
platform's labels for the family. What the handler (internal/webhook/core/
ch_kafka_startup_webhook.go) refuses WITHOUT a lookup, on objects that carry no
such label, is held here, in the API server. For an object that is not one of
the family's platform objects (startup-contract=shared-service-startup-v1,
managed-by=kube-dc-services, family=<family> and a non-empty instance-uid, as
chKafkaStartup.marked):

  - squatting: a name (or generateName) containing the reserved prefix
    (mss-v1-kf- / mss-v1-ch-), except Kube-OVN's slr- shadow Services;
  - typed borrowing: a label value or ownerReference naming reserved material;
    a pod-spec input (Pods, Deployments, ReplicaSets, StatefulSets, Jobs and
    CronJobs: service account, image pull Secrets, every volume source's
    Secret, ConfigMap or claim reference -- secret, configMap,
    persistentVolumeClaim, projected, csi, flexVolume, iscsi, cephfs, rbd,
    scaleIO, storageos, azureFile, cinder, and glusterfs Endpoints -- resource claims, env and envFrom
    references) naming it; a workload's selector or template labels, a
    StatefulSet's serviceName; a Service selector value; a ServiceAccount's
    secrets or imagePullSecrets; a claim's dataSource, dataSourceRef or
    volumeName; an RBAC rule's resourceNames, a binding's subjects or
    roleRef; a service-account token Secret's account; a cert-manager
    object's secretName, ca.secretName, issuerRef.name, ACME private key,
    keystore password Secret or private-key-secret-name annotation.

Arbitrary strings elsewhere in tenant objects (env values, ConfigMap and Secret
data, other annotations, arguments) are no longer refused (owner decision 2 of
step 3: free-text scans stop being an authorization boundary). Unlabelled
objects of the operators' API groups keep the handler's recursive walk, on the
Ignore references entry.

Also, for every requester:
  - only Kube-OVN (system:serviceaccount:kube-system:ovn) writes slr- shadow
    Services naming the family's reserved prefix (sharedStartupShadow);
  - ClickHouse: only the renderer (the service runner, system:masters or
    platform:admin) writes Secrets named mss-v1-ch-*-recovery (the first check
    of chKafkaStartup.handle). DELETE is no longer judged (rule 2); tenants
    still cannot delete platform-marked Secrets
    (protect-managed-services-in-projects).

Bookkeeping updates (authority payload, labels and annotations unchanged) are
not judged, as on the authority entry. failurePolicy: Ignore with a Deny
binding: a policy that cannot be evaluated does not block a write; an evaluated
violation is refused. Rendered from handoffPhase 1, so it is cached before
phase 2.
*/ -}}
{{- $root := . -}}
{{- $p := .Values.projectPolicies.protectManagedServices }}
{{- range $family := list "kafka" "clickhouse" }}
{{- $phase := include "kube-dc.chkStartup.phase" (list $root $family) }}
{{- if and $root.Values.manager.webhook.enabled $p.enabled (index $p.sharedStartup $family) (ge (int $phase) 1) }}
{{- $prefix := ternary "mss-v1-kf-" "mss-v1-ch-" (eq $family "kafka") }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $family }}-shared-startup-reserved
spec:
  failurePolicy: Ignore
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "secrets", "configmaps", "services", "serviceaccounts", "persistentvolumeclaims"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "replicasets", "statefulsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
      - apiGroups: ["cert-manager.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["issuers", "certificates", "certificaterequests"]
      - apiGroups: ["postgresql.cnpg.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["clusters", "backups", "scheduledbackups", "poolers", "databases", "publications", "subscriptions"]
      - apiGroups: ["valkey.buf.red"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["failovers", "sentinels", "users"]
      - apiGroups: ["mysql.oracle.com"]
        apiVersions: ["v2"]
        operations: ["CREATE", "UPDATE"]
        resources: ["innodbclusters", "mysqlbackups", "mysqlclustersetfailovers"]
      - apiGroups: ["k8s.mariadb.com"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["mariadbs", "users", "grants", "databases", "backups", "physicalbackups", "pointintimerecoveries", "restores", "sqljobs", "maxscales", "connections"]
      - apiGroups: ["kafka.strimzi.io"]
        apiVersions: ["v1", "v1beta2"]
        operations: ["CREATE", "UPDATE"]
        resources: ["kafkas", "kafkanodepools", "kafkausers", "kafkatopics", "strimzipodsets", "kafkaconnects", "kafkamirrormakers", "kafkamirrormaker2s", "kafkabridges", "kafkarebalances", "kafkaconnectors"]
      - apiGroups: ["core.strimzi.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["strimzipodsets"]
      - apiGroups: ["clickhouse.altinity.com", "clickhouse-keeper.altinity.com"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["clickhouseinstallations", "clickhouseinstallationtemplates", "clickhousekeeperinstallations", "clickhousekeeperinstallationtemplates"]
  matchConditions:
    - name: exclude-bookkeeping-updates
      expression: >-
        !(request.operation == 'UPDATE' && object.all(k, k == 'metadata' || k == 'status' || (k in oldObject && object[k] == oldObject[k])) && oldObject.all(k, k == 'metadata' || k == 'status' || k in object) && (has(object.metadata.labels) ? object.metadata.labels : {}) == (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}) && (has(object.metadata.annotations) ? object.metadata.annotations : {}) == (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}))
  variables:
    - name: labels
      expression: "has(object.metadata.labels) ? object.metadata.labels : {}"
    - name: owned
      expression: >-
        variables.labels[?'services.kube-dc.com/startup-contract'].orValue('') == 'shared-service-startup-v1' &&
        variables.labels[?'services.kube-dc.com/managed-by'].orValue('') == 'kube-dc-services' &&
        variables.labels[?'services.kube-dc.com/family'].orValue('') == '{{ $family }}' &&
        variables.labels[?'services.kube-dc.com/instance-uid'].orValue('') != ''
    - name: name
      expression: "has(object.metadata.name) ? object.metadata.name : (has(object.metadata.generateName) ? object.metadata.generateName : '')"
    - name: shadow
      expression: "request.resource.group == '' && request.resource.resource == 'services' && variables.name.startsWith('slr-')"
    - name: podSpec
      expression: >-
        request.resource.group == '' && request.resource.resource == 'pods' ? object.?spec.orValue({}) :
        request.resource.group == 'batch' && request.resource.resource == 'cronjobs' ? object.?spec.?jobTemplate.?spec.?template.?spec.orValue({}) :
        request.resource.group == 'apps' || request.resource.group == 'batch' ? object.?spec.?template.?spec.orValue({}) : {}
    - name: podBorrows
      expression: |-
        string(variables.podSpec.?serviceAccountName.orValue('')).contains('{{ $prefix }}') || string(variables.podSpec.?serviceAccount.orValue('')).contains('{{ $prefix }}') || variables.podSpec.?imagePullSecrets.orValue([]).exists(s, string(s.?name.orValue('')).contains('{{ $prefix }}')) || variables.podSpec.?volumes.orValue([]).exists(v,
          string(v.?secret.?secretName.orValue('')).contains('{{ $prefix }}') ||
          string(v.?configMap.?name.orValue('')).contains('{{ $prefix }}') ||
          string(v.?persistentVolumeClaim.?claimName.orValue('')).contains('{{ $prefix }}') ||
          string(v.?csi.?nodePublishSecretRef.?name.orValue('')).contains('{{ $prefix }}') ||
          string(v.?flexVolume.?secretRef.?name.orValue('')).contains('{{ $prefix }}') ||
          string(v.?iscsi.?secretRef.?name.orValue('')).contains('{{ $prefix }}') ||
          string(v.?cephfs.?secretRef.?name.orValue('')).contains('{{ $prefix }}') ||
          string(v.?rbd.?secretRef.?name.orValue('')).contains('{{ $prefix }}') ||
          string(v.?scaleIO.?secretRef.?name.orValue('')).contains('{{ $prefix }}') ||
          string(v.?storageos.?secretRef.?name.orValue('')).contains('{{ $prefix }}') ||
          string(v.?azureFile.?secretName.orValue('')).contains('{{ $prefix }}') ||
          string(v.?cinder.?secretRef.?name.orValue('')).contains('{{ $prefix }}') ||
          string(v.?glusterfs.?endpoints.orValue('')).contains('{{ $prefix }}') ||
          v.?projected.?sources.orValue([]).exists(s,
            string(s.?secret.?name.orValue('')).contains('{{ $prefix }}') ||
            string(s.?configMap.?name.orValue('')).contains('{{ $prefix }}'))) ||
        variables.podSpec.?resourceClaims.orValue([]).exists(r,
          string(r.?resourceClaimName.orValue('')).contains('{{ $prefix }}') ||
          string(r.?resourceClaimTemplateName.orValue('')).contains('{{ $prefix }}')) ||
        (variables.podSpec.?containers.orValue([]) + variables.podSpec.?initContainers.orValue([]) + variables.podSpec.?ephemeralContainers.orValue([])).exists(c,
          c.?env.orValue([]).exists(e,
            string(e.?valueFrom.?secretKeyRef.?name.orValue('')).contains('{{ $prefix }}') ||
            string(e.?valueFrom.?configMapKeyRef.?name.orValue('')).contains('{{ $prefix }}')) ||
          c.?envFrom.orValue([]).exists(e,
            string(e.?secretRef.?name.orValue('')).contains('{{ $prefix }}') ||
            string(e.?configMapRef.?name.orValue('')).contains('{{ $prefix }}')))
    - name: selector
      expression: "request.resource.group == '' && request.resource.resource == 'services' ? object.?spec.?selector.orValue({}) : {}"
    - name: workloadSelector
      expression: >-
        request.resource.group == 'batch' && request.resource.resource == 'cronjobs' ? object.?spec.?jobTemplate.?spec.?selector.orValue({}) :
        request.resource.group == 'apps' || request.resource.group == 'batch' ? object.?spec.?selector.orValue({}) : {}
    - name: templateLabels
      expression: >-
        request.resource.group == 'batch' && request.resource.resource == 'cronjobs' ? object.?spec.?jobTemplate.?spec.?template.?metadata.?labels.orValue({}) :
        request.resource.group == 'apps' || request.resource.group == 'batch' ? object.?spec.?template.?metadata.?labels.orValue({}) : {}
    - name: workloadBorrows
      expression: >-
        variables.workloadSelector.?matchLabels.orValue({}).exists(k, string(variables.workloadSelector.matchLabels[k]).contains('{{ $prefix }}')) ||
        variables.workloadSelector.?matchExpressions.orValue([]).exists(e, e.?values.orValue([]).exists(x, string(x).contains('{{ $prefix }}'))) ||
        variables.templateLabels.exists(k, string(variables.templateLabels[k]).contains('{{ $prefix }}')) ||
        request.resource.group == 'apps' && request.resource.resource == 'statefulsets' && string(object.?spec.?serviceName.orValue('')).contains('{{ $prefix }}')
    - name: coreBorrows
      expression: |-
        request.resource.group == '' && request.resource.resource == 'serviceaccounts' && (
          object.?secrets.orValue([]).exists(s, string(s.?name.orValue('')).contains('{{ $prefix }}')) ||
          object.?imagePullSecrets.orValue([]).exists(s, string(s.?name.orValue('')).contains('{{ $prefix }}'))) ||
        request.resource.group == '' && request.resource.resource == 'persistentvolumeclaims' && (
          string(object.?spec.?dataSource.?name.orValue('')).contains('{{ $prefix }}') ||
          string(object.?spec.?dataSourceRef.?name.orValue('')).contains('{{ $prefix }}') ||
          string(object.?spec.?volumeName.orValue('')).contains('{{ $prefix }}')) ||
        request.resource.group == '' && request.resource.resource == 'secrets' &&
          string(object.metadata.?annotations[?'kubernetes.io/service-account.name'].orValue('')).contains('{{ $prefix }}')
    - name: rbacBorrows
      expression: |-
        request.resource.group == 'rbac.authorization.k8s.io' && (
          object.?rules.orValue([]).exists(r, r.?resourceNames.orValue([]).exists(n, string(n).contains('{{ $prefix }}'))) ||
          object.?subjects.orValue([]).exists(s, string(s.?name.orValue('')).contains('{{ $prefix }}')) ||
          string(object.?roleRef.?name.orValue('')).contains('{{ $prefix }}'))
    - name: certBorrows
      expression: |-
        request.resource.group == 'cert-manager.io' && (
          string(object.?spec.?secretName.orValue('')).contains('{{ $prefix }}') ||
          string(object.?spec.?ca.?secretName.orValue('')).contains('{{ $prefix }}') ||
          string(object.?spec.?issuerRef.?name.orValue('')).contains('{{ $prefix }}') ||
          string(object.?spec.?acme.?privateKeySecretRef.?name.orValue('')).contains('{{ $prefix }}') ||
          string(object.?spec.?keystores.?jks.?passwordSecretRef.?name.orValue('')).contains('{{ $prefix }}') ||
          string(object.?spec.?keystores.?pkcs12.?passwordSecretRef.?name.orValue('')).contains('{{ $prefix }}') ||
          string(object.metadata.?annotations[?'cert-manager.io/private-key-secret-name'].orValue('')).contains('{{ $prefix }}'))
    - name: borrows
      expression: >-
        variables.labels.exists(k, string(variables.labels[k]).contains('{{ $prefix }}')) ||
        object.metadata.?ownerReferences.orValue([]).exists(r, string(r.?name.orValue('')).contains('{{ $prefix }}')) ||
        variables.podBorrows ||
        variables.selector.exists(k, string(variables.selector[k]).contains('{{ $prefix }}')) ||
        variables.workloadBorrows || variables.coreBorrows || variables.rbacBorrows || variables.certBorrows
  validations:
    - expression: "variables.owned || variables.shadow || !variables.name.contains('{{ $prefix }}')"
      message: "{{ $family }} startup authority: reserved {{ $family }} startup name; foreign objects cannot take it"
      reason: Forbidden
    - expression: "variables.owned || !variables.borrows"
      message: "{{ $family }} startup authority: foreign consumer of reserved {{ $family }} startup identity or material"
      reason: Forbidden
    - expression: "!variables.shadow || !variables.name.contains('{{ $prefix }}') || request.userInfo.username == 'system:serviceaccount:kube-system:ovn'"
      message: "shared startup shadow: only Kube-OVN may manage the shadow"
      reason: Forbidden
{{- if eq $family "clickhouse" }}
    - expression: >-
        request.resource.group != '' || request.resource.resource != 'secrets' ||
        !(variables.name.startsWith('mss-v1-ch-') && variables.name.endsWith('-recovery')) ||
        request.userInfo.username == 'system:serviceaccount:kube-dc-service-runner:kube-dc-service-runner' ||
        has(request.userInfo.groups) && request.userInfo.groups.exists(g, g == 'system:masters' || g == 'platform:admin')
      message: "only the renderer writes or retires ClickHouse recovery custody"
      reason: Forbidden
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $family }}-shared-startup-reserved
spec:
  policyName: {{ $family }}-shared-startup-reserved
  validationActions: {{ toJson $p.validationActions }}
{{- end }}
{{- end }}
