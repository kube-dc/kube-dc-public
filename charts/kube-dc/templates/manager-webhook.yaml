        path: /validate-routing-fabric
    rules:
      - apiGroups: ["kube-dc.com"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["routingfabrics"]
  - name: vroutedfabricsegment.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 5
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
