{{- if not (has (toString .Values.manager.webhook.broadGatesHandoffPhase) (list "0" "1" "2")) -}}
{{- fail "manager.webhook.broadGatesHandoffPhase must be 0, 1 or 2 (docs/prd/admission-webhooks-must-not-block-the-platform.md, step 2b)" -}}
{{- end -}}
{{- /* manager.webhook.narrowGatesHandoffPhase: items 3-9 of docs/prd/admission-webhooks-remaining-design.md (_narrow-gates.tpl). */ -}}
{{- $narrowPhase := include "kube-dc.narrowGates.phase" . -}}
{{- if and .Values.backend.exposureSourcePolicy.floatingIP (not .Values.manager.fipSourcePolicy.enabled) -}}
{{- fail "Floating IP API availability requires manager.fipSourcePolicy.enabled" -}}
{{- end -}}
{{- if and .Values.manager.fipSourcePolicy.enabled (not .Values.manager.webhook.enabled) -}}
{{- fail "manager.fipSourcePolicy.enabled requires manager.webhook.enabled" -}}
{{- end -}}
{{- if not (kindIs "map" .Values.manager.fipSourcePolicy.namespaceUIDs) -}}
{{- fail "manager.fipSourcePolicy.namespaceUIDs must be an object" -}}
{{- end -}}
{{- range $namespace, $uid := .Values.manager.fipSourcePolicy.namespaceUIDs -}}
{{- if or (gt (len $namespace) 63) (not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$" $namespace)) (not (kindIs "string" $uid)) -}}
{{- fail "manager.fipSourcePolicy.namespaceUIDs requires exact namespace names and UUIDs" -}}
{{- end -}}
{{- if not (regexMatch "^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$" $uid) -}}
{{- fail "manager.fipSourcePolicy.namespaceUIDs requires exact namespace names and UUIDs" -}}
{{- end -}}
{{- end -}}
{{- $childMarkingPhase := include "kube-dc.childMarking.phase" . -}}
{{- $refPhase := int (include "kube-dc.referencesHandoff.phase" .) -}}
{{- $childMarkingSplit := has $childMarkingPhase (list "2" "3" "4" "5") -}}
{{- $operatorsProbed := eq $childMarkingPhase "3" -}}
{{- $operatorsStaged := eq $childMarkingPhase "4" -}}
{{- $operatorsSplit := eq $childMarkingPhase "5" -}}
{{- if .Values.manager.webhook.enabled -}}
# Admission webhooks for security.kube-dc.com/v1alpha1 (M0-T03 / B-004).
# Comprises:
#   - a self-signed cert-manager Issuer + Certificate (TLS for the
#     webhook listener),
#   - a Service fronting the manager pod's :9443 webhook port,
#   - MutatingWebhookConfiguration + ValidatingWebhookConfiguration
#     covering all four security CRDs.
#
# CA bundles are injected by cert-manager via the
# `cert-manager.io/inject-ca-from` annotation, so we don't have to bake
# the CA into the chart.
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "kube-dc.manager.fullname" . }}-webhook-selfsigned
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-dc.manager.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "kube-dc.manager.fullname" . }}-webhook-serving-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-dc.manager.labels" . | nindent 4 }}
spec:
  secretName: {{ include "kube-dc.manager.fullname" . }}-webhook-serving-cert
  duration: 8760h   # 1 year
  renewBefore: 720h # 30 days
  dnsNames:
    - {{ include "kube-dc.manager.fullname" . }}-webhook.{{ .Release.Namespace }}.svc
    - {{ include "kube-dc.manager.fullname" . }}-webhook.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: {{ include "kube-dc.manager.fullname" . }}-webhook-selfsigned
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-dc.manager.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-dc.manager.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: https
      port: 443
      protocol: TCP
      targetPort: webhook-server
  selector:
    {{- include "kube-dc.manager.selectorLabels" . | nindent 4 }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "kube-dc.manager.fullname" . }}-mutating
  labels:
    {{- include "kube-dc.manager.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "kube-dc.manager.fullname" . }}-webhook-serving-cert
webhooks:
  # Records Organization spec.suspension transitions in the
  # platform.kube-dc.com/lifecycle-v1 annotation, in the same write
  # (docs/prd/platform-events.md §3.2). Fail on purpose: the record is what
  # keeps callers from forging it (the annotation policy exempts this key), and
  # the match conditions limit it to writes that change the hold or the record,
  # so a stopped manager only delays a suspend or resume, never another
  # Organization write. Organizations are not core objects.
  - name: morganizationlifecycle.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 5
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /mutate-organization-lifecycle
    rules:
      - apiGroups: ["kube-dc.com"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["organizations"]
    matchConditions:
      - name: hold-or-lifecycle-record-changes
        expression: |-
          request.operation == 'CREATE'
            ? has(object.spec.suspension) ||
              (has(object.metadata.annotations) && 'platform.kube-dc.com/lifecycle-v1' in object.metadata.annotations)
            : has(object.spec.suspension) != has(oldObject.spec.suspension) ||
              (has(object.spec.suspension) && object.spec.suspension != oldObject.spec.suspension) ||
              ((has(object.metadata.annotations) && 'platform.kube-dc.com/lifecycle-v1' in object.metadata.annotations)
                ? object.metadata.annotations['platform.kube-dc.com/lifecycle-v1'] : '') !=
              ((has(oldObject.metadata.annotations) && 'platform.kube-dc.com/lifecycle-v1' in oldObject.metadata.annotations)
                ? oldObject.metadata.annotations['platform.kube-dc.com/lifecycle-v1'] : '')
  - name: mmanagedsecret.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /mutate-security-kube-dc-com-v1alpha1-managedsecret
    rules:
      - apiGroups: ["security.kube-dc.com"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["managedsecrets"]
  - name: mmanagedcertificate.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /mutate-security-kube-dc-com-v1alpha1-managedcertificate
    rules:
      - apiGroups: ["security.kube-dc.com"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["managedcertificates"]
  - name: mkmskey.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /mutate-security-kube-dc-com-v1alpha1-kmskey
    rules:
      - apiGroups: ["security.kube-dc.com"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["kmskeys"]
  - name: mdbcredentialpolicy.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /mutate-security-kube-dc-com-v1alpha1-databasecredentialpolicy
    rules:
      - apiGroups: ["security.kube-dc.com"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["databasecredentialpolicies"]
{{- if .Values.projectPolicies.protectManagedServices.enabled }}
  # What an engine operator derives from a managed engine -- CNPG's server,
  # CA and replication Secrets carry an ownerReference to the Cluster and
  # none of its labels -- is marked AT CREATION, so the protection policy
  # covers it from its first moment. Keyed on the requester being a platform
  # identity and the named owner really carrying the marker: an
  # ownerReference alone is a tenant-writable field. The reverse too: a
  # platform controller creating an object with the reserved labels from a
  # tenant's template (StatefulSet volumeClaimTemplates) has them stripped
  # unless the owner is marked. A snapshot of a marked claim is marked.
  # Fails closed; the matchConditions keep tenant identities out of its
  # path entirely, so a manager outage never blocks a tenant's own writes.
  - name: mark-managed-children.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    reinvocationPolicy: Never
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
{{- if $operatorsSplit }}
    # Phase 5 (docs/prd/admission-webhooks-step4-operators-as-built.md): only
    # an operator's arrivals that carry the marker -- its platform outputs,
    # marked by construction -- wait here (rule 1). Its unmarked arrivals go
    # to mark-managed-children-operators-unmarked (Ignore).
    objectSelector:
      matchExpressions:
        - {key: services.kube-dc.com/managed-by, operator: Exists}
{{- end }}
    matchConditions:
{{- if $operatorsProbed }}
      {{- include "kube-dc.childMarking.conditionsWithProbe" . | nindent 6 }}
{{- else }}
      {{- include "kube-dc.childMarking.conditions" . | nindent 6 }}
{{- end }}
{{- if $childMarkingSplit }}
      # Hand-off phase 2 (step 4): the controller manager's creations are
      # routed by the three entries below instead -- fail-closed only for
      # objects that arrive carrying a platform marker.
      - name: not-kube-controllers
        expression: |-
          !({{ include "kube-dc.childMarking.kubeControllers" . | nindent 12 | trim }})
{{- end }}
{{- if $operatorsStaged }}
      # Phase 4: the staged identities' unmarked arrivals go to
      # mark-managed-children-operators-unmarked instead (the exact negation
      # of its identity condition and selector).
      - name: not-staged-operators-unmarked
        expression: |-
          !(request.userInfo.username in {{ include "kube-dc.childMarking.stagedOperators" . }} &&
            !(has(object.metadata.labels) &&
              ('services.kube-dc.com/managed-by' in object.metadata.labels || 'kube-dc.com/managed-db' in object.metadata.labels)))
{{- end }}
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
{{- if $operatorsProbed }}
        # Phase 3: the path names the phase for the route probe; the manager
        # of this release serves it like /mutate-managed-children.
        path: /mutate-managed-children/phase-3
{{- else }}
        path: /mutate-managed-children
{{- end }}
    rules:
      {{- include "kube-dc.childMarking.rules" . | nindent 6 }}
{{- if ne $childMarkingPhase "0" }}
  # Hand-off phases 1 and 2 (step 4 of docs/prd/admission-webhooks-must-not-
  # block-the-platform.md). The controller manager creates the children of
  # every workload in a project -- tenants' included -- from the owner's
  # templates, so a platform child arrives carrying the marker its owner's
  # template carries. These two entries judge exactly those arrivals, by the
  # same handler, fail-closed and selected on the marker (rule 1): a
  # laundered marker is stripped, a confirmed one completed from the owner.
  # Phase 1 adds them in front of an unchanged entry above (each arrival is
  # judged twice, idempotently); phase 2 takes the controller manager off it.
  - name: mark-managed-children-controllers.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    reinvocationPolicy: Never
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    objectSelector:
      matchExpressions:
        - {key: services.kube-dc.com/managed-by, operator: Exists}
    matchConditions:
      {{- include "kube-dc.childMarking.conditions" . | nindent 6 }}
      - name: kube-controllers-only
        expression: |-
          {{ include "kube-dc.childMarking.kubeControllersInline" . | nindent 10 | trim }}
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /mutate-managed-children
    rules:
      {{- include "kube-dc.childMarking.rules" . | nindent 6 }}
  - name: mark-managed-db-children-controllers.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    reinvocationPolicy: Never
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    objectSelector:
      matchExpressions:
        - {key: kube-dc.com/managed-db, operator: Exists}
    matchConditions:
      {{- include "kube-dc.childMarking.conditions" . | nindent 6 }}
      - name: kube-controllers-only
        expression: |-
          {{ include "kube-dc.childMarking.kubeControllersInline" . | nindent 10 | trim }}
      # Judged by the entry above already.
      - name: not-services-marked
        expression: >-
          !(has(object.metadata.labels) && 'services.kube-dc.com/managed-by' in object.metadata.labels)
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /mutate-managed-children
    rules:
      {{- include "kube-dc.childMarking.rules" . | nindent 6 }}
  # From phase 1 the manager also puts a verified marked workload's markers
  # into its pod, Job and ephemeral claim templates when it is created (so
  # its children arrive marked and never depend on inheritance); a workload
  # whose controller is another workload (a Deployment's ReplicaSet) mirrors
  # its parent and is never marked on its own. This entry keeps the markers
  # when an UPDATE rewrites a template and drops one the stored template
  # carried -- an engine operator reconciling a rendering that knows nothing
  # of the marker. It only restores: an existing gap is never filled here
  # (that changes the template hash and rolls the pods; gaps are migrated
  # deliberately). Selected on the marker; only updates that change a
  # template (a replicas-only update never reaches it); failurePolicy
  # Ignore -- best-effort, so a manager outage holds nothing: a marker
  # dropped meanwhile is a gap that managed-workload-template-markers warns
  # about and the hand-off audit reports. Jobs and Pods are not routed:
  # their templates are immutable.
  - name: mark-managed-workload-templates.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 5
    reinvocationPolicy: Never
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    objectSelector:
      matchExpressions:
        - {key: services.kube-dc.com/managed-by, operator: Exists}
    matchConditions:
      - name: template-changed
        expression: |-
          request.resource.resource == 'cronjobs'
            ? object.spec.jobTemplate != oldObject.spec.jobTemplate
            : (has(object.spec.template) != has(oldObject.spec.template) ||
               (has(object.spec.template) && object.spec.template != oldObject.spec.template))
      - name: drops-a-stored-template-marker
        expression: |-
          has(object.metadata.labels) && has(oldObject.metadata.labels) && ['services.kube-dc.com/managed-by', 'kube-dc.com/managed-db'].exists(k,
            k in object.metadata.labels && k in oldObject.metadata.labels && (
              (request.resource.resource == 'cronjobs'
                ? (k in oldObject.spec.?jobTemplate.?metadata.?labels.orValue({}) && !(k in object.spec.?jobTemplate.?metadata.?labels.orValue({}))) ||
                  (k in oldObject.spec.?jobTemplate.?spec.?template.?metadata.?labels.orValue({}) && !(k in object.spec.?jobTemplate.?spec.?template.?metadata.?labels.orValue({})))
                : (k in oldObject.spec.?template.?metadata.?labels.orValue({}) && !(k in object.spec.?template.?metadata.?labels.orValue({})))) ||
              (request.resource.resource == 'cronjobs'
                ? object.spec.?jobTemplate.?spec.?template.?spec.?volumes.orValue([])
                : object.spec.?template.?spec.?volumes.orValue([])).exists(v,
                  has(v.ephemeral) && !(k in v.ephemeral.?volumeClaimTemplate.?metadata.?labels.orValue({})) &&
                  (request.resource.resource == 'cronjobs'
                    ? oldObject.spec.?jobTemplate.?spec.?template.?spec.?volumes.orValue([])
                    : oldObject.spec.?template.?spec.?volumes.orValue([])).exists(o,
                      o.name == v.name && has(o.ephemeral) && k in o.ephemeral.?volumeClaimTemplate.?metadata.?labels.orValue({})))))
      - name: not-mirroring-a-controller
        expression: |-
          !object.metadata.?ownerReferences.orValue([]).exists(r,
            r.?controller.orValue(false) && (
              (r.apiVersion == 'apps/v1' && r.kind in ['Deployment', 'ReplicaSet', 'StatefulSet', 'DaemonSet']) ||
              (r.apiVersion == 'batch/v1' && r.kind in ['Job', 'CronJob']) ||
              (r.apiVersion == 'v1' && r.kind == 'ReplicationController')))
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /mutate-managed-workload-templates
    rules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["cronjobs"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["replicationcontrollers"]
{{- end }}
{{- if $childMarkingSplit }}
  # Phase 2: an UNMARKED arrival from the controller manager -- every child
  # of every tenant workload -- never waits on the manager. With the manager
  # reachable, it is marked as before when its live owner is marked (a
  # platform workload whose template lacks the marker); while the manager is
  # unreachable, or its lookups fail, it is admitted unmarked. The audit
  # (cmd/admission-handoff-audit, "childMarking") finds such children
  # afterwards, and the workloads whose templates make them possible. Needs
  # the manager of this release: an older one has no fail-open path, so
  # every such arrival would pass unmarked.
  - name: mark-managed-children-controllers-unmarked.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 5
    reinvocationPolicy: Never
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    objectSelector:
      matchExpressions:
        - {key: services.kube-dc.com/managed-by, operator: DoesNotExist}
        - {key: kube-dc.com/managed-db, operator: DoesNotExist}
    matchConditions:
      {{- include "kube-dc.childMarking.conditions" . | nindent 6 }}
      - name: kube-controllers-only
        expression: |-
          {{ include "kube-dc.childMarking.kubeControllersInline" . | nindent 10 | trim }}
      # Nothing to inherit and nothing to strip: an ownerless object without
      # a platform label (a namespace's default account, its root CA
      # ConfigMap, a Retain-policy StatefulSet claim) is left alone.
      - name: owned-or-platform-labelled
        expression: |-
          (has(object.metadata.ownerReferences) && size(object.metadata.ownerReferences) > 0) || (has(object.metadata.labels) && object.metadata.labels.exists(k,
            k.startsWith('services.kube-dc.com/') || k == 'kube-dc.com/managed-db'))
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /mutate-managed-children-fail-open
    rules:
      {{- include "kube-dc.childMarking.rules" . | nindent 6 }}
{{- end }}
{{- if $operatorsSplit }}
  # Phase 5: an operator's arrival that carries kube-dc.com/managed-db alone
  # (the services marker is judged by mark-managed-children above).
  - name: mark-managed-db-children-operators.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    reinvocationPolicy: Never
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    objectSelector:
      matchExpressions:
        - {key: kube-dc.com/managed-db, operator: Exists}
    matchConditions:
      {{- include "kube-dc.childMarking.conditions" . | nindent 6 }}
      - name: not-kube-controllers
        expression: |-
          !({{ include "kube-dc.childMarking.kubeControllers" . | nindent 12 | trim }})
      - name: not-services-marked
        expression: >-
          !(has(object.metadata.labels) && 'services.kube-dc.com/managed-by' in object.metadata.labels)
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /mutate-managed-children
    rules:
      {{- include "kube-dc.childMarking.rules" . | nindent 6 }}
{{- end }}
{{- if or $operatorsStaged $operatorsSplit }}
  # Phases 4 and 5 (docs/prd/admission-webhooks-step4-operators-as-built.md):
  # an operator's UNMARKED arrival -- the children of tenants' certificates,
  # buckets and engines -- never waits on the manager. With the manager
  # reachable it is judged as before (owner inheritance, laundered labels
  # stripped, provenance stamped); while it is unreachable, or its lookups
  # fail, it is admitted unpatched, and the policies
  # managed-children-arrive-marked-* refuse what needed the marker. Phase 4:
  # the staged identities (manager.webhook.childMarkingStagedOperators) only;
  # phase 5: every operator. The path names the phase for the route probe.
  - name: mark-managed-children-operators-unmarked.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 5
    reinvocationPolicy: Never
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    objectSelector:
      matchExpressions:
        - {key: services.kube-dc.com/managed-by, operator: DoesNotExist}
        - {key: kube-dc.com/managed-db, operator: DoesNotExist}
    matchConditions:
      {{- include "kube-dc.childMarking.conditionsWithProbe" . | nindent 6 }}
{{- if $operatorsStaged }}
      - name: staged-operators-or-probe
        expression: >-
          request.userInfo.username in {{ include "kube-dc.childMarking.stagedOperators" . }} ||
          {{ include "kube-dc.childMarking.probeCEL" . }}
{{- else }}
      - name: not-kube-controllers
        expression: |-
          !({{ include "kube-dc.childMarking.kubeControllers" . | nindent 12 | trim }})
{{- end }}
      # Nothing to inherit, strip or stamp: an ownerless object without a
      # platform label from an identity that stamps no provenance is left
      # alone (the mutator admits it unchanged). A VolumeSnapshot is judged
      # by its source claim, so it is always routed.
      - name: owned-labelled-provenance-or-snapshot
        expression: |-
          (has(object.metadata.ownerReferences) && size(object.metadata.ownerReferences) > 0) || (has(object.metadata.labels) && object.metadata.labels.exists(k,
            k.startsWith('services.kube-dc.com/') || k == 'kube-dc.com/managed-db')) ||
          request.userInfo.username.startsWith('system:serviceaccount:cert-manager:') || request.userInfo.username.startsWith('system:serviceaccount:rook-ceph:') || request.resource.group == 'snapshot.storage.k8s.io' || {{ include "kube-dc.childMarking.probeCEL" . }}
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /mutate-managed-children-operators-fail-open/phase-{{ $childMarkingPhase }}
    rules:
      {{- include "kube-dc.childMarking.rules" . | nindent 6 }}
{{- end }}
  # A tenant PodDisruptionBudget is NARROWED to exclude platform-managed pods.
  # Refusing selectors that name the platform's keys cannot work: a managed
  # CNPG pod also carries app.kubernetes.io/name=postgresql, role=primary and
  # cnpg.io/instanceRole=primary, so an ordinary-looking selector with
  # minAvailable: 100% blocks the node drains maintenance needs.
  #
  # Its OWN stanza, with the INVERSE match condition of the child mutator
  # above: that one matches platform identities only, which is what keeps a
  # manager outage off the tenant's write path, so a tenant request never
  # reaches it. Widening it would put every tenant Secret, Pod and PVC write
  # behind a fail-closed webhook; this one matches tenant identities and
  # PodDisruptionBudgets only, so an outage blocks nothing else.
  #
  # UPDATE is included because a budget can be widened, or its minAvailable
  # raised, long after it was created.
  - name: mark-tenant-budgets.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    reinvocationPolicy: Never
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    matchConditions:
      - name: tenant-identities-only
        expression: |-
          !(has(request.userInfo) && has(request.userInfo.username) && (request.userInfo.username == 'system:kube-controller-manager' ||
           [{{ range $i, $ns := (include "kube-dc.managedServices.exemptNamespaces" $ | fromJsonArray) }}{{ if $i }}, {{ end }}'system:serviceaccount:{{ $ns }}:'{{ end }}].exists(prefix,
            request.userInfo.username.startsWith(prefix))))
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /mutate-tenant-budget
    rules:
      - apiGroups: ["policy"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["poddisruptionbudgets"]
{{- end }}
{{- if .Values.manager.infraAttachment.enabled }}
  # Tenant Networking v2 — infra-attachment pod mutating webhook
  # (docs/prd/tenant-networking-v2.md). Injects the dual-NIC pattern on pods in
  # opted-in project namespaces only.
  #
  # Fail closed only inside explicitly opted-in namespaces. A pod that misses
  # this mutation is single-homed and can reopen the system-VPC egress path or
  # make a controller endpoint unreachable; rejecting CREATE makes the
  # preparation failure visible and retryable without affecting other tenants.
  - name: pod-infra-attachment.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    reinvocationPolicy: Never
    matchPolicy: Equivalent
    namespaceSelector:
      matchLabels:
        network.kube-dc.com/infra-attachment: enabled
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /mutate--v1-pod-infra-attachment
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
{{- end }}
{{- if .Values.projectNetwork.enabled }}
  # Tenant-VLAN attachment mutator: constrains an attaching pod to the nodes
  # that actually carry its segment, and stamps port_security on the attached
  # port. kube-ovn reads port_security from a workload annotation, not from the
  # Subnet, so without this the VLAN NIC can spoof any address on the customer's
  # wire.
  #
  # reinvocationPolicy: IfNeeded because the infra-attachment mutator above may
  # ADD the networks annotation after this one has run; without re-invocation a
  # dual-homed pod's VLAN NIC would go unstamped.
  - name: mnetworkattach.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    reinvocationPolicy: IfNeeded
    matchPolicy: Equivalent
    timeoutSeconds: 5
    matchConditions:
      - name: declares-a-network-attachment
        expression: |-
          has(object.metadata) && has(object.metadata.annotations) && (
            'k8s.v1.cni.cncf.io/networks' in object.metadata.annotations ||
            'v1.multus-cni.io/default-network' in object.metadata.annotations ||
            object.metadata.annotations.exists(k, k.endsWith('kubernetes.io/logical_switch') && k != 'ovn.kubernetes.io/logical_switch') ||
            object.metadata.annotations.exists(k, k.endsWith('kubernetes.io/logical_router') && k != 'ovn.kubernetes.io/logical_router') ||
            object.metadata.annotations.exists(k, k.endsWith('kubernetes.io/vpc') && k != 'ovn.kubernetes.io/vpc')
          )
{{- if eq $narrowPhase "2" }}
      # narrowGatesHandoffPhase 2 (docs/prd/admission-webhooks-remaining-design.md,
      # mnetworkattach): the infra mutator's default-only shape and the
      # project-default VM launcher shape name no NAD but <ns>/default, which
      # vnetworkattachnad keeps off a reserved wire, so this mutator has
      # nothing to stamp on them. Every other explicit attachment (tenant
      # VLANs, any other Multus or provider-scoped selection) still waits.
      - name: outside-the-exempt-shapes
        expression: >-
          !{{ include "kube-dc.narrowGates.exemptShapeCEL" (dict "o" "object" "root" $) }}
{{- end }}
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /mutate-network-attach
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "kube-dc.manager.fullname" . }}-validating
  labels:
    {{- include "kube-dc.manager.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "kube-dc.manager.fullname" . }}-webhook-serving-cert
webhooks:
{{- if ne $narrowPhase "2" }}
  # Cloud-shell Job gate. The console shell earns the management-api-client role
  # -- a /32 route to the management apiserver plus one SecurityGroup egress
  # rule -- from the LABEL below, because the backend creates that Job per
  # session directly in the tenant namespace and there is no platform-owned root
  # to walk to. Every other route to that role walks a UID-verified owner chain.
  #
  # Any tenant who can create a Job can set the label (the default developer and
  # admin project Roles both grant jobs: create), and a Job the tenant writes may
  # name ANY ServiceAccount in the namespace and get its token mounted. So the
  # label cannot be the authorization: a labelled Job may carry no
  # ServiceAccount token (no account but "default", automounting off). The
  # creator is not checked: the console creates the Job with the user's own
  # token (internal/webhook/core/cloudshell_job_webhook.go).
  #
  # The label condition below (matchConditions, not an objectSelector) is what
  # makes failurePolicy: Fail safe here. The webhook is
  # consulted ONLY for Jobs already carrying this label, so a manager outage
  # cannot block ordinary tenant Jobs -- the blast radius is "the web terminal
  # does not start", never "the tenant cannot run workloads". That is the
  # opposite trade-off to the EIP webhook below, and deliberately so: this one
  # IS a security boundary.
  - name: cloud-shell-job.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    # The trigger must cover EVERY place the label can appear, or the handler's
    # second arm is unreachable: an objectSelector sees only the Job's own
    # labels, so a Job labelled solely in its pod template never reached this
    # gate. Today that grants nothing -- the classifier that hands out the
    # management-API role reads the JOB's labels (internal/infraattachment/
    # pod_role.go) -- but a trigger narrower than its handler is exactly how a
    # later refactor turns a defensive check into a hole. matchConditions are
    # evaluated by the API server, so the narrow blast radius that makes
    # failurePolicy: Fail safe here is preserved: unlabelled Jobs never call
    # the webhook.
    matchConditions:
      - name: carries-the-cloud-shell-label
        expression: |-
          (has(object.metadata.labels) &&
           'app.kubernetes.io/component' in object.metadata.labels &&
           object.metadata.labels['app.kubernetes.io/component'] == 'kube-dc-cloud-shell') ||
          (has(object.spec) && has(object.spec.template) && has(object.spec.template.metadata) &&
           has(object.spec.template.metadata.labels) &&
           'app.kubernetes.io/component' in object.spec.template.metadata.labels &&
           object.spec.template.metadata.labels['app.kubernetes.io/component'] == 'kube-dc-cloud-shell')
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-cloud-shell-job
    rules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
{{- end }}
  # shalb/kube-dc#147 — the external-network-type annotation only ever fed EIP
  # CREATION, and EIp.spec.externalNetworkType is immutable, so editing it after
  # an address was allocated was accepted and then silently ignored forever. The
  # dangerous direction is public -> cloud: the user believes they just made a
  # Service private while it keeps serving publicly. Reject the write instead.
  #
  # failurePolicy: Ignore, deliberately, and it is NOT the same question as the
  # handler's fail-closed branch. The handler fails CLOSED when it cannot read
  # the EIPs (the manager is up and answering, it just cannot be sure). This
  # setting governs the manager being UNREACHABLE, and this webhook intercepts a
  # CORE resource. With Fail, a manager outage would block every Service create
  # and update in every project namespace — and this platform has already had a
  # manager eviction cause exactly that kind of webhook outage. What is being
  # guarded is a misleading no-op, not a security boundary or data integrity, so
  # it is not worth trading tenant availability for.
  #
  # Scoped to project namespaces (kube-dc.com/project) so kube-system and other
  # infrastructure Services are never in the path, and to UPDATE only — a CREATE
  # always sets the value legitimately, and the EIP is derived from it.
{{- if .Values.projectPolicies.protectManagedServices.enabled }}
{{- /* manager.webhook.broadGatesHandoffPhase (docs/prd/admission-webhooks-must-not-block-the-platform.md,
step 2b): below 2 the token and subresource gates keep their fail-closed shape;
at 2 they fail open (after the phase-1 audit is clean on this cluster). */}}
{{- if lt (int .Values.manager.webhook.broadGatesHandoffPhase) 2 }}
  # Platform-managed ServiceAccount token gate (kube-dc-services in-project
  # placement): the managed-objects policy exempts the engine's per-instance
  # ServiceAccount, and only the manager can look an account up to refuse a
  # tenant's TokenRequest for it. Fails CLOSED: a token for a marked account
  # goes only to a pod that is provably the platform's, and an unreadable
  # account cannot be told apart from a marked one; pod creation in project
  # namespaces already depends on this manager. It covers a boundary, not a
  # primary control.
  - name: managed-serviceaccount-token.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate--v1-serviceaccount-token
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["serviceaccounts/token"]
  # Label-less subresources of platform-managed objects: an Eviction and a
  # Scale carry no labels, so the managed-objects policy never sees them. The
  # manager reads the parent and refuses tenant identities. Fails closed like
  # the other gates: the manager runs two replicas behind a PodDisruptionBudget,
  # and a drain or scale that cannot be judged waits rather than passes.
  - name: managed-subresource.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-managed-subresource
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods/eviction"]
      # Binding a pod to a node is when it starts consuming its claims: a
      # pod that is not the platform's referencing a managed claim is
      # stopped here whatever the timing of its admission.
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods/binding"]
      # Adding an ephemeral container (kubectl debug) is an UPDATE of the
      # pod through its subresource.
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["statefulsets/scale", "deployments/scale", "replicasets/scale"]
{{- else }}
  # Platform-managed ServiceAccount token gate (kube-dc-services in-project
  # placement): the managed-objects policy exempts the engine's per-instance
  # ServiceAccount, and only the manager can look an account up to refuse a
  # tenant's TokenRequest for it, or to prove that the pod a kubelet asks a
  # token for is the platform's.
  #
  # failurePolicy: Ignore (step 2b of
  # docs/prd/admission-webhooks-must-not-block-the-platform.md, owner
  # decision 2026-10-15). This entry sees the kubelet's projected-token
  # refresh for EVERY pod in every project; fail-closed, a manager outage
  # longer than a token's remaining life stopped every running pod's API
  # access, whatever its account. The checks that matter keep holding while
  # the manager is unreachable:
  #   - a tenant's TokenRequest for a marked account, and a kubelet's that is
  #     not bound to a pod: the managed-serviceaccount-tokens
  #     ValidatingAdmissionPolicy, which reads the marked accounts as params
  #     inside the API server;
  #   - a pod that is not the platform's running as a marked account:
  #     refused at the pod's creation and at the marked account's creation
  #     by the fail-closed managed-references gate (pod(),
  #     squattedAccountName()).
  # What degrades: the kubelet's token for a marked account bound to a pod
  # that is not the platform's, a pod that slipped past both of those, and
  # read errors (the handler refuses them when it is reachable).
  #
  # The handler admits a platform identity other than a node for every
  # account without judging it, so the API server does not ask.
  - name: managed-serviceaccount-token.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 10
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    matchConditions:
      - name: tenants-and-nodes
        expression: >-
          !{{ include "kube-dc.managedReferences.platformIdentityCEL" $ }} || {{ include "kube-dc.managedReferences.nodeIdentityCEL" $ }}
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate--v1-serviceaccount-token
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["serviceaccounts/token"]
  # Label-less subresources of platform-managed objects: an Eviction and a
  # Scale carry no labels, so the managed-objects policy never sees them. The
  # manager reads the parent and refuses tenant identities. pods/binding is
  # judged on the pod being bound (binding()).
  #
  # failurePolicy: Ignore (step 2b of
  # docs/prd/admission-webhooks-must-not-block-the-platform.md). The
  # scheduler binds every new project pod through pods/binding, and a Binding
  # carries none of the pod's fields, so no condition can keep ordinary
  # bindings away from this entry; fail-closed, a manager outage stopped all
  # scheduling in every project, rescheduling after a node failure included.
  # What binding() refuses is also refused, fail-closed, where the platform
  # object is created: a pod that is not the platform's mounting a marked
  # claim, running as a marked account or carrying a managed MariaDB's
  # selector is refused at its own creation (pod()), and a marked claim,
  # account or MariaDB is not created while such a pod already names it
  # (squattedClaimName(), squattedAccountName(), squattedMariadbSelector());
  # the platform's pod is refused an unmarked claim under a reserved name at
  # its creation (trustedPodClaims()). While the manager is unreachable a
  # tenant may evict a managed pod (its own PodDisruptionBudget still applies)
  # or scale a managed workload (its operator reconciles the replica count
  # back).
  #
  # The handler admits evictions by platform identities, and scales by
  # cluster admins and the platform namespaces other than kube-system
  # (scaleIdentity()), without a lookup, so the API server does not ask.
  # pods/ephemeralcontainers is no longer matched: the handler never judged
  # it (it admitted every such request), and a marked pod's ephemeral
  # containers are refused to tenants by protect-managed-services-in-projects.
  - name: managed-subresource.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 10
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    matchConditions:
      - name: evictions-it-could-refuse
        expression: >-
          !(request.resource.group == '' && request.resource.resource == 'pods' && request.subResource == 'eviction') ||
          !{{ include "kube-dc.managedReferences.platformIdentityCEL" $ }}
      - name: scales-it-could-refuse
        expression: >-
          !(request.subResource == 'scale') || !{{ include "kube-dc.managedReferences.cloneIdentityCEL" $ }}
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-managed-subresource
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods/eviction"]
      # Binding a pod to a node is when it starts consuming its claims: a
      # pod that is not the platform's referencing a managed claim is
      # stopped here whatever the timing of its admission.
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods/binding"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["statefulsets/scale", "deployments/scale", "replicasets/scale"]
{{- end }}
{{- if ge (int .Values.manager.webhook.broadGatesHandoffPhase) 1 }}
  # Creation-side checks (step 2b, phase 1 and later). pods/binding and the
  # kubelet's token requests are judged at consumption time; from phase 2 they
  # fail open, so what they refuse is also refused where the PLATFORM's object
  # is created: a marked ServiceAccount is not created under a name a pod that
  # is not the platform's runs as, nor named "default"; a marked MariaDB is not
  # created while such a pod carries its selector; the platform's marked pod is
  # not created mounting an unmarked claim under a reserved name.
  #
  # Fails CLOSED and is object-selected on the platform marker (rule 1 of the
  # PRD): only objects the platform creates and labels reach it, so a manager
  # outage delays the platform's own engine setup, never a tenant's request.
  # Its own path: an old manager answers 404, which is why it renders only
  # from phase 1, after the manager of this release runs.
  - name: managed-platform-creations.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    objectSelector:
      matchExpressions:
        - {key: services.kube-dc.com/managed-by, operator: Exists}
    matchConditions:
      - name: pods-that-name-a-claim
        expression: |-
          !(request.resource.group == '' && request.resource.resource == 'pods') || (has(object.spec) && has(object.spec.volumes) && object.spec.volumes.exists(v,
            has(v.persistentVolumeClaim) && has(v.persistentVolumeClaim.claimName) && v.persistentVolumeClaim.claimName != ''))
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-managed-platform-creations
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
{{- if ge $refPhase 1 }}
        # Reference hand-off phase 1 and later: a marked claim is not created
        # under a name a pod that is not the platform's already names
        # (squattedClaimName, which managed-references' core rule stops
        # judging at phase 3).
        resources: ["serviceaccounts", "pods", "persistentvolumeclaims"]
{{- else }}
        resources: ["serviceaccounts", "pods"]
{{- end }}
      - apiGroups: ["k8s.mariadb.com"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE"]
        resources: ["mariadbs"]
{{- end }}
  # Network reach into a managed pod or Service through the API server:
  # port-forward and proxy land on arbitrary pod ports, past any network
  # policy. The same handler, in its own entry, because this one fails
  # CLOSED: an unreachable manager must not let a CONNECT through on the
  # namespace-wide permission. Kube-DC's project roles grant none of these
  # subresources; the gate is defence in depth for roles that do.
  - name: managed-connect.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
{{- if eq $narrowPhase "2" }}
    # narrowGatesHandoffPhase 2 (docs/prd/admission-webhooks-remaining-design.md,
    # managed-connect): the handler admits platform identities without a
    # lookup, so the API server skips them; services/proxy is refused to
    # every other identity by the policy managed-services-proxy (phase 1).
    # What stays fail-closed is a non-platform identity's port-forward or
    # proxy to a pod, which the shipped project roles do not grant.
    matchConditions:
      - name: not-a-platform-identity
        expression: >-
          !{{ include "kube-dc.managedReferences.platformIdentityCEL" $ }}
{{- end }}
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-managed-subresource
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CONNECT"]
{{- if eq $narrowPhase "2" }}
        resources: ["pods/portforward", "pods/proxy"]
{{- else }}
        resources: ["pods/portforward", "pods/proxy", "services/proxy"]
{{- end }}
  # A platform-managed CNPG Cluster's STATUS is written by its own instance
  # only. The managed-services policy excludes the subresource (a policy
  # cannot look anything up) and this stanza is its sole judge, proving the
  # instance's provenance by UID. It has its OWN path: an old manager pod
  # still serving the shared path during a rolling upgrade would wave a
  # subresource through, whereas a path it does not serve answers 404 --
  # under failurePolicy Fail a refusal, never an unjudged admission.
  - name: managed-cluster-status.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-cnpg-cluster-status
    rules:
      - apiGroups: ["postgresql.cnpg.io"]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["clusters/status"]
  - name: managed-pooler-status.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-cnpg-pooler-status
    rules:
      - apiGroups: ["postgresql.cnpg.io"]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["poolers/status"]
  # References to managed objects that the policies cannot see: a tenant pod
  # naming a managed engine's PersistentVolumeClaim or ServiceAccount, a claim
  # cloned from a managed one (dataSource), a VolumeSnapshot of one. The
  # manager looks the referenced object up; pods are judged on the POD (a
  # marked pod is trusted only when its controller owner is marked), claims
  # and snapshots also on the requester. Fails CLOSED: this is the boundary
  # for those paths.
  #
  # Owner decision 2026-10-15: no admission webhook may be able to block all
  # operations (docs/prd/admission-webhooks-must-not-block-the-platform.md,
  # step 2). The gate therefore sees only requests it could refuse:
  #   - its pure checks (legacy token Secrets, pod spec.nodeName, budget
  #     selectors, Certificate secretTemplate keys, cross-namespace
  #     mariaDbRef, unknown resources and versions in a family's groups) are
  #     ALSO ValidatingAdmissionPolicies (vap-managed-references.yaml), which
  #     run in the API server and cannot be unavailable;
  #   - the matchConditions below skip every request the handler would admit
  #     without a lookup: platform identities where the handler admits them,
  #     pods that name no claim, account, node or MariaDB selector, claims
  #     whose name no engine can reserve, unchanged references on UPDATE, and
  #     a PLATFORM identity's finalizer- or ownerReference-only update
  #     (garbage collection, PVC protection, Job tracking, namespace
  #     teardown). A tenant's metadata-only update is never skipped where the
  #     handler judges the object by what it references: replacing the
  #     ownerReferences of db-manager's unmarked ScheduledBackup with a tenant
  #     ConfigMap, then deleting that ConfigMap, would have the garbage
  #     collector delete the schedule (Astra review of step 2);
  #   - Pod DELETE is not matched: deleting a marked pod is refused to tenants
  #     by protect-managed-services-in-projects (its object selector reads
  #     the old object on DELETE).
  # The conditions must stay a SUPERSET of what the handler judges: a request
  # they skip is admitted unjudged. Every clause is guarded with has(), and
  # one that touches the object never reads it on DELETE: a condition that
  # errors refuses the request under failurePolicy Fail.
{{- $p := .Values.projectPolicies.protectManagedServices }}
{{- $families := include "kube-dc.managedReferences.families" $ | fromJson }}
{{- $platform := include "kube-dc.managedReferences.platformIdentityCEL" $ }}
{{- $clone := include "kube-dc.managedReferences.cloneIdentityCEL" $ }}
{{- $metadataOnly := include "kube-dc.managedReferences.metadataOnlyUpdateCEL" $ }}
{{- $mariadbLabels := include "kube-dc.managedReferences.mariadbSelectorLabelsCEL" $ }}
{{- $pure := include "kube-dc.referencesHandoff.pureReferenceChecks" $ }}
  - name: managed-references.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    matchConditions:
{{- if lt $refPhase 3 }}
      # pod(): a pod is refused only for a claim it names (mounted, or the
      # source of a generic ephemeral volume), spec.nodeName, the selector
      # labels of a managed MariaDB, or a ServiceAccount other than the
      # namespace default (never platform-marked: the token controller creates
      # it unmarked and the marker is never added to an existing object).
      - name: pods-that-name-a-claim-account-node-or-engine
        expression: |-
          !(request.resource.group == '' && request.resource.resource == 'pods' && request.operation == 'CREATE') || (has(object.spec) && has(object.spec.volumes) && object.spec.volumes.exists(v,
            (has(v.persistentVolumeClaim) && has(v.persistentVolumeClaim.claimName) && v.persistentVolumeClaim.claimName != '') ||
            (has(v.ephemeral) && has(v.ephemeral.volumeClaimTemplate) && has(v.ephemeral.volumeClaimTemplate.spec) &&
             (has(v.ephemeral.volumeClaimTemplate.spec.dataSource) || has(v.ephemeral.volumeClaimTemplate.spec.dataSourceRef))))) ||
          (has(object.spec) && has(object.spec.nodeName) && object.spec.nodeName != '') || (has(object.spec) && has(object.spec.serviceAccountName) && object.spec.serviceAccountName != '' && object.spec.serviceAccountName != 'default') || {{ $mariadbLabels }}
      # podUpdate(): a tenant may not update a pod whose controller owner is
      # marked -- before OR after the update (removing or replacing the owner
      # is an update of the platform's pod) -- nor set spec.nodeName; anyone's
      # update is judged on the MariaDB selector labels. A platform identity's finalizer/ownerReference-only
      # update (garbage collection, the Job controller) is not judged.
      - name: pod-updates-that-change-what-is-judged
        expression: |-
          !(request.resource.group == '' && request.resource.resource == 'pods' && request.operation == 'UPDATE') || (!({{ $platform }} && {{ $metadataOnly }}) &&
           ((!{{ $platform }} &&
             ((has(object.metadata.ownerReferences) && object.metadata.ownerReferences.exists(r, has(r.controller) && r.controller == true)) ||
              (has(oldObject.metadata.ownerReferences) && oldObject.metadata.ownerReferences.exists(r, has(r.controller) && r.controller == true)) ||
              ((!has(oldObject.spec) || !has(oldObject.spec.nodeName) || oldObject.spec.nodeName == '') && has(object.spec) && has(object.spec.nodeName) && object.spec.nodeName != ''))) ||
            {{ $mariadbLabels }}))
      # claim(): a marked claim (squatter scan), a data source, or a name an
      # engine reserves (<cluster>-<n>[-wal], storage-<db>-<n>,
      # <template>-<sts>-<n>: all end in a dash and digits, optionally -wal).
      - name: claims-that-copy-or-take-a-reserved-name
        expression: >-
          !(request.resource.group == '' && request.resource.resource == 'persistentvolumeclaims' && request.operation == 'CREATE') ||
          (has(object.metadata.labels) && 'services.kube-dc.com/managed-by' in object.metadata.labels) ||
          (has(object.spec) && (has(object.spec.dataSource) || has(object.spec.dataSourceRef))) ||
          !has(object.metadata.name) || object.metadata.name == '' ||
          object.metadata.name.matches('-[0-9]+(-wal)?$')
      # claimUpdate(): only a claim that is marked after the update is judged:
      # one becoming marked, or one gaining a StatefulSet ownerReference.
      - name: claim-updates-that-change-custody
        expression: |-
          !(request.resource.group == '' && request.resource.resource == 'persistentvolumeclaims' && request.operation == 'UPDATE') || (has(object.metadata.labels) && 'services.kube-dc.com/managed-by' in object.metadata.labels &&
           (!(has(oldObject.metadata.labels) && 'services.kube-dc.com/managed-by' in oldObject.metadata.labels) ||
            (has(object.metadata.ownerReferences) && object.metadata.ownerReferences.exists(r, has(r.kind) && r.kind == 'StatefulSet' &&
              !(has(r.uid) && has(oldObject.metadata.ownerReferences) && oldObject.metadata.ownerReferences.exists(o, has(o.uid) && o.uid == r.uid))))))
      # secret(): a tenant's kubernetes.io/service-account-token Secret.
      - name: token-secrets-from-tenants
        expression: >-
          !(request.resource.group == '' && request.resource.resource == 'secrets') || request.operation == 'DELETE' ||
          (!{{ $platform }} && has(object.type) && object.type == 'kubernetes.io/service-account-token')
      # serviceAccount(): a tenant's account under a claimed name.
      - name: service-accounts-from-tenants
        expression: >-
          !(request.resource.group == '' && request.resource.resource == 'serviceaccounts') || !{{ $platform }}
      # statefulSet(): a tenant's StatefulSet with volumeClaimTemplates.
      - name: tenant-statefulsets-with-claim-templates
        expression: >-
          !(request.resource.group == 'apps' && request.resource.resource == 'statefulsets') || request.operation == 'DELETE' ||
          (!{{ $platform }} && has(object.spec) && has(object.spec.volumeClaimTemplates) && size(object.spec.volumeClaimTemplates) > 0)
{{- end }}
      # snapshot(): taken from a claim, by an identity that does not manage
      # its own volumes.
      - name: snapshots-of-claims
        expression: >-
          !(request.resource.group == 'snapshot.storage.k8s.io' && request.resource.resource == 'volumesnapshots') || request.operation == 'DELETE' ||
          (!{{ $clone }} && has(object.spec) && has(object.spec.source) && has(object.spec.source.persistentVolumeClaimName) && object.spec.source.persistentVolumeClaimName != '')
      # cdi(): new or changed sources, unless the requester manages its own
      # volumes (CDI's own controller is always judged).
      - name: cdi-copies-with-new-sources
        expression: |-
          !(request.resource.group == 'cdi.kubevirt.io' || (request.resource.group == 'kubevirt.io' && request.resource.resource == 'virtualmachines')) || request.operation == 'DELETE' || ((request.operation == 'CREATE' ||
            {{ include "kube-dc.managedReferences.changedCEL" (dict "path" (list "spec" "source")) }} ||
            {{ include "kube-dc.managedReferences.changedCEL" (dict "path" (list "spec" "sourceRef")) }} ||
            {{ include "kube-dc.managedReferences.changedCEL" (dict "path" (list "spec" "dataVolumeTemplates")) }}) &&
           (!{{ $clone }} || (has(request.userInfo.username) && request.userInfo.username.startsWith('system:serviceaccount:cdi:'))))
      # certificate(): a tenant's new or retargeted Certificate.
      - name: tenant-certificates-with-new-targets
        expression: |-
          !(request.resource.group == 'cert-manager.io' && request.resource.resource == 'certificates') || request.operation == 'DELETE' || (!{{ $platform }} && (request.operation == 'CREATE' ||
            {{ include "kube-dc.managedReferences.changedCEL" (dict "path" (list "spec" "secretName")) }} ||
            {{ include "kube-dc.managedReferences.changedCEL" (dict "path" (list "spec" "secretTemplate")) }}))
      # bucketClaim(): a tenant's bucket claim (CREATE only).
      - name: tenant-bucket-claims
        expression: >-
          !(request.resource.group == 'objectbucket.io' && request.resource.resource == 'objectbucketclaims') || !{{ $platform }}
      # mariadb(): a tenant's new or retargeted mariadb-operator resource.
      - name: tenant-mariadb-resources-with-new-references
        expression: |-
          request.resource.group != 'k8s.mariadb.com' || request.operation == 'DELETE' || (!{{ $platform }} && (request.operation == 'CREATE' ||
            {{ include "kube-dc.managedReferences.changedCEL" (dict "path" (list "spec" "mariaDbRef")) }} ||
            {{ include "kube-dc.managedReferences.changedCEL" (dict "path" (list "spec" "bootstrapFrom")) }} ||
            {{ include "kube-dc.managedReferences.changedCEL" (dict "path" (list "spec" "backupRef")) }} ||
            {{ include "kube-dc.managedReferences.changedCEL" (dict "path" (list "spec" "volume")) }} ||
            {{ include "kube-dc.managedReferences.changedCEL" (dict "path" (list "spec" "physicalBackupRef")) }}))
      # cnpgCluster(): a tenant's Cluster with new or changed bootstrap
      # sources, external clusters or replica configuration.
      - name: tenant-cnpg-clusters-with-new-sources
        expression: |-
          !(request.resource.group == 'postgresql.cnpg.io' && request.resource.resource == 'clusters') || request.operation == 'DELETE' || (!{{ $platform }} && (request.operation == 'CREATE' ||
            {{ include "kube-dc.managedReferences.changedCEL" (dict "path" (list "spec" "bootstrap")) }} ||
            {{ include "kube-dc.managedReferences.changedCEL" (dict "path" (list "spec" "externalClusters")) }} ||
            {{ include "kube-dc.managedReferences.changedCEL" (dict "path" (list "spec" "replica")) }}))
      # engineOperation(): a tenant's CNPG operation, every write of it
      # (DELETE included where it is judged; ownerReference and finalizer
      # changes too -- they decide whether the garbage collector deletes an
      # unmarked schedule of a managed engine). A Subscription's publisher is
      # judged for every identity, except a platform identity's
      # metadata-only update.
      - name: cnpg-operations-from-tenants
        expression: >-
          !(request.resource.group == 'postgresql.cnpg.io' && request.resource.resource != 'clusters') ||
          !{{ $platform }} ||
          (request.resource.resource == 'subscriptions' && !{{ $metadataOnly }})
      # disruptionBudget(): a tenant's budget.
      - name: tenant-disruption-budgets
        expression: >-
          !(request.resource.group == 'policy' && request.resource.resource == 'poddisruptionbudgets') || !{{ $platform }}
{{- if $families.groups }}
      # Extra families: a tenant's write in a family's groups (metadata-only
      # updates included, as for CNPG operations), other than a declared
      # passthrough resource (always admitted).
      - name: tenant-writes-in-family-groups
        expression: |-
          !(request.resource.group in {{ include "kube-dc.managedReferences.celList" (keys $families.groups | sortAlpha) }}) || (!{{ $platform }} &&
           !((request.resource.group + '|' + request.resource.resource) in {{ include "kube-dc.managedReferences.celList" $families.passthrough }}))
{{- end }}
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-managed-references
    rules:
{{- if lt $refPhase 3 }}
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["persistentvolumeclaims"]
      # Pods on UPDATE as well: labels can change after creation, and the
      # engine selector rule is about labels. Not DELETE (see above).
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
{{- if not $pure }}
      # A legacy ServiceAccount-token Secret naming a marked account would be
      # filled by the token controller without any TokenRequest. Judged by
      # managed-references-token-secrets alone once
      # pureReferenceChecksJudgedByPolicy is on.
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
{{- end }}
      # A ServiceAccount under a name the platform has claimed for an engine
      # instance: CNPG does not adopt a pre-existing account, so a tenant one
      # would leave the instance unable to write its Cluster's status.
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["serviceaccounts"]
{{- end }}
      - apiGroups: ["snapshot.storage.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["volumesnapshots"]
      # Copies of managed storage through CDI's populators and DataVolumes,
      # and VirtualMachines whose dataVolumeTemplates clone one.
      - apiGroups: ["cdi.kubevirt.io"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["datavolumes", "volumeclonesources", "datasources"]
      - apiGroups: ["kubevirt.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["virtualmachines"]
      # Exempt controllers as deputies: a Certificate aimed at a marked
      # Secret, a bucket claim named after a marked Secret or ConfigMap.
      - apiGroups: ["cert-manager.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["certificates"]
      - apiGroups: ["objectbucket.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE"]
        resources: ["objectbucketclaims"]
      # mariadb-operator resources a tenant would aim at a managed MariaDB.
      - apiGroups: ["k8s.mariadb.com"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["mariadbs", "pointintimerecoveries", "backups", "physicalbackups", "restores", "sqljobs", "users", "grants", "databases", "connections", "maxscales"]
      # CNPG's own backup API: a Backup or ScheduledBackup naming a managed
      # Cluster is a second, unapproved operation path into the engine (CNPG
      # resolves it by spec.cluster.name and runs it, with no ServiceOperation
      # involved).
      - apiGroups: ["postgresql.cnpg.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        # clusters: a tenant Cluster that bootstraps from the managed engine's
        # backup, streams from it with pg_basebackup, or replicates it reads
        # the platform's engine without any operation at all.
        # publications/subscriptions: CNPG's declarative logical replication
        # runs CREATE PUBLICATION / CREATE SUBSCRIPTION on the cluster they
        # name, without passing through the Cluster object at all.
        resources: ["backups", "scheduledbackups", "clusters", "poolers", "publications", "subscriptions"]
      # DELETE of a backup object is judged by its TARGET, not by its own
      # label: db-manager's ScheduledBackup carries no marker, so the marker
      # policy does not protect it, and deleting it silently stops the backups
      # of a platform-managed database.
      - apiGroups: ["postgresql.cnpg.io"]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["backups", "scheduledbackups", "poolers"]
{{- if not $pure }}
      # A tenant PodDisruptionBudget whose selector covers platform-managed
      # pods would impose a second maintenance policy on them, up to blocking
      # a node drain entirely. Judged by managed-references-disruption-budgets
      # alone once pureReferenceChecksJudgedByPolicy is on.
      - apiGroups: ["policy"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["poddisruptionbudgets"]
{{- end }}
{{- include "kube-dc.serviceFamilies.validate" $ }}
{{- if $pure }}
      # Families added in .Values.serviceFamilies.extra: each registered
      # operation in its registered version, the only requests whose verdict
      # needs a lookup (the engine it names). Everything else in the family's
      # groups -- passthrough resources (admitted), an unregistered resource
      # (an operation the operator renamed: refused to tenants, codex round
      # 94) or an unregistered version (codex round 95) -- is judged by
      # managed-references-family-resources, a policy, in every version.
{{- range $families.ops }}
      - apiGroups: [{{ .group | quote }}]
        apiVersions: [{{ .version | quote }}]
        operations: [{{ if .delete }}"CREATE", "UPDATE", "DELETE"{{ else }}"CREATE", "UPDATE"{{ end }}]
        resources: [{{ .resource | quote }}]
{{- end }}
{{- else }}
      # Families added in .Values.serviceFamilies.extra: the WHOLE group/version
      # of every operation and passthrough resource is routed to the gate,
      # which judges registered operations by their target, admits declared
      # passthrough resources, and refuses anything else to tenant identities.
      # Listing operations by name would leave an operation CRD later replaced
      # under another plural unguarded (codex round 94); routing the whole
      # group/version makes the renamed resource unknown, not unguarded. The
      # built-in families' resources are listed above by hand. `*` does not
      # match subresources. With pureReferenceChecksJudgedByPolicy the
      # managed-references-family-resources policy takes the unknown and
      # other-version refusals over, and only the operations are routed here.
{{- /* Every VERSION too: an operator upgrade that starts serving v2 of an operation must not bypass the gate (codex round 95); the gate refuses a tenant a version the registry does not name. */}}
{{- range $g, $del := $families.groups }}
      - apiGroups: [{{ $g | quote }}]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["*"]
{{- if $del }}
      - apiGroups: [{{ $g | quote }}]
        apiVersions: ["*"]
        operations: ["DELETE"]
        resources: ["*"]
{{- end }}
{{- end }}
{{- end }}
{{- if lt $refPhase 3 }}
      # A tenant StatefulSet whose templates would name a marked claim (the
      # controller adopts and, under its retention policy, owns it).
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["statefulsets"]
{{- end }}
{{- if ge $refPhase 1 }}
{{- include "kube-dc.referencesHandoff.entries" (dict "root" $ "phase" $refPhase "platform" $platform "metadataOnly" $metadataOnly "mariadbLabels" $mariadbLabels) }}
{{- end }}
{{- end }}
{{- include "kube-dc.serviceFamilies.validateInstanceWrites" $ }}
{{- $statusWrites := include "kube-dc.serviceFamilies.instanceStatusWrites" $ | fromJsonArray }}
{{- $coreWrites := include "kube-dc.serviceFamilies.instanceCoreWrites" $ | fromJsonArray }}
{{- $podConditions := include "kube-dc.serviceFamilies.instancePodConditionWrites" $ }}
{{- if or $statusWrites $coreWrites $podConditions }}
  # A registered family whose operator runs INSIDE the project namespace under
  # an account it creates per instance (Strimzi's entity operator): the
  # writes that account must make -- the status of the family's operation
  # objects, and the core Secrets/ConfigMaps it derives from them -- are
  # judged here with UID-verified provenance, on a path of their own like
  # the CNPG status judge (an old manager pod answers 404 = refused). The
  # managed-services policies hand exactly these writes over in the NEXT
  # chart (projectPolicies.protectManagedServices.instanceWritesJudgedByWebhook),
  # once every cluster serves this stanza.
{{- if $statusWrites }}
  - name: managed-instance-status.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-family-instance-writes
    rules:
{{- range $statusWrites }}
      - apiGroups: [{{ .group | quote }}]
        apiVersions: ["*"]
        operations: ["UPDATE"]
        resources: [{{ printf "%s/status" .resource | quote }}]
{{- end }}
{{- end }}
{{- if $coreWrites }}
  - name: managed-instance-objects.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
{{- if eq $narrowPhase "2" }}
    # narrowGatesHandoffPhase 2 (docs/prd/admission-webhooks-remaining-design.md,
    # managed-instance-objects): only marked Secrets (old or new object, so
    # stripping the marker is still judged). Since phase 1 the managed-services
    # policies delegate only marked writes to this entry and judge an instance
    # account's unmarked writes as any project identity's. DELETE stays,
    # marker-selected: only the engine's own account reaches it.
    objectSelector:
      matchExpressions:
        - {key: services.kube-dc.com/managed-by, operator: Exists}
{{- end }}
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-family-instance-writes
    matchConditions:
      - name: instance-account
        expression: {{ include "kube-dc.serviceFamilies.instanceIdentityCEL" $ | quote }}
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: {{ toJson $coreWrites }}
{{- end }}
{{- if $podConditions }}
  # An operator sidecar reporting its own readiness gate (the Oracle MySQL
  # Operator sets mysql.oracle.com/configured on its member pod). Only the
  # instance account's writes to MARKED pods come here: the kubelet and every
  # tenant pod keep their status path free of the manager. The judge admits
  # the declared conditions on the pod the token is bound to and nothing else.
  - name: managed-instance-pod-conditions.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
    objectSelector:
      matchExpressions:
        - {key: services.kube-dc.com/managed-by, operator: Exists}
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-family-instance-writes
    matchConditions:
      - name: instance-account
        expression: {{ include "kube-dc.serviceFamilies.instanceIdentityCEL" $ | quote }}
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/status"]
{{- end }}
{{- end }}
{{- if .Values.projectPolicies.protectManagedServices.enabled }}
  # Phase 1: install independently of policy delegation. Old managers return
  # 404 (Fail), so rolling upgrades cannot admit an unjudged projection.
  - name: service-publication-writes.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - {key: kube-dc.com/project, operator: Exists}
{{- if eq $narrowPhase "2" }}
    # narrowGatesHandoffPhase 2 (docs/prd/admission-webhooks-remaining-design.md,
    # service-publication-writes): only marked objects reach the publication
    # proof, so tenants' own ExternalSecrets sync while the manager is
    # unreachable. The pure refusals -- an External Secrets DELETE of a
    # protected Secret, a protected but unmarked write -- are the policy
    # service-publication-eso-secrets (phase 1).
    objectSelector:
      matchExpressions:
        - {key: services.kube-dc.com/managed-by, operator: Exists}
{{- end }}
    matchConditions:
      - name: exact-eso-account
        expression: {{ printf "request.userInfo.username == '%s'" (include "kube-dc.publicationESO.serviceAccount" .) | quote }}
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-service-publication-writes
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
{{- if eq $narrowPhase "2" }}
        operations: ["CREATE", "UPDATE"]
{{- else }}
        operations: ["CREATE", "UPDATE", "DELETE"]
{{- end }}
        resources: ["secrets"]
        scope: Namespaced
      - apiGroups: ["external-secrets.io"]
        apiVersions: ["*"]
        operations: ["UPDATE"]
        resources: ["externalsecrets/status"]
        scope: Namespaced
{{- end }}
  - name: vfipsourcepolicy.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-fip-source-policy
    rules:
      - apiGroups: ["kube-dc.com"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["fips"]
        scope: Namespaced
  - name: vservicenetworktype.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 5
    namespaceSelector:
      matchExpressions:
        - key: kube-dc.com/project
          operator: Exists
    clientConfig:
      service:
        name: {{ include "kube-dc.manager.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate--v1-service-network-type
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["services"]
  - name: vmanagedsecret.kube-dc.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    clientConfig:
      service:
