apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-dc.backend.fullname" . }}
  labels:
    {{- include "kube-dc.backend.labels" . | nindent 4 }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kube-dc.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Rolls the backend Pod whenever the master-config Secret content
        # changes. The Secret is rendered from chart values (SMTP, OpenBao,
        # ALLOW_PUBLIC_PROJECTS, …). Without this checksum, env vars sourced
        # via secretKeyRef stay stale on running Pods after a Helm upgrade
        # that only changed the Secret. See
        # kube-dc/docs/prd/public-projects-gate.md (F2 review fix).
        checksum/master-config: {{ include (print $.Template.BasePath "/manager-secret.yaml") . | sha256sum }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "kube-dc.backend.selectorLabels" . | nindent 8 }}
        {{- include "kube-dc.podVersionLabel" . | nindent 8 }}
        {{- with .Values.backend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.backend.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kube-dc.backend.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3333 #{{ .Values.backend.service.port }}
              protocol: TCP
          env:
            - name: GPU_SHARED_CREATION_ENABLED
              value: {{ .Values.gpu.sharedCreation.enabled | quote }}
            - name: GPU_VM_CREATION_ENABLED
              value: {{ .Values.gpu.vmCreation.enabled | quote }}
            - name: GPU_PROFILE_LABEL
              value: {{ .Values.gpu.profileLabel | quote }}
            - name: GPU_HAMI_SCHEDULER_NAME
              value: {{ .Values.gpu.hamiSchedulerName | quote }}
            - name: PROM_URL
              value: "{{ .Values.backend.prometheusUrl | default "http://prom-operator-prometheus.monitoring:9090" }}"
            - name: PROJECT_SHELL_API_URL
              value: "{{ .Values.kubeApiExternalUrl }}"
            # Under management-API `service` mode the cloud shell must dial the
            # kubernetes ServiceIP, not the external hostname. Its SecurityGroup
            # permits exactly one egress rule — tcp <ServiceIP>/32:443 — and the
            # node LAN the external hostname resolves to is default-deny. Dialling
            # the hostname yields "session expired", because the credential exec
            # cannot reach the apiserver at all.
            # Empty on every other mode, where the shell keeps the external
            # hostname and reaches it through the tenant VPC as before.
            {{- if and (eq .Values.managementAPI.mode "service") .Values.managementAPI.serviceIP }}
            - name: PROJECT_SHELL_API_SERVICE_URL
              value: "{{ .Values.managementAPI.serviceIP }}:443"
            {{- end }}
            # S3 endpoint for tenant Object Storage views, KdcDatabase
            # backup wiring, and quota lookups. Per-cluster value —
            # earlier versions of the JS controllers fell back to a
            # hardcoded `https://s3.kube-dc.cloud` when the env var
            # wasn't set, which made every non-cloud cluster's UI
            # render the wrong S3 hostname. The fall-back is still
            # there in code (`process.env.S3_ENDPOINT || 'https://s3.kube-dc.cloud'`)
            # but with this chart change, the env is always set when
            # `s3Endpoint` is provided in values, so the fallback path
            # never runs in production. Leave the value empty in
            # values.yaml if you want the fallback (single-cluster
            # cloud-only deployment).
            {{- if .Values.s3Endpoint }}
            - name: S3_ENDPOINT
              value: "{{ .Values.s3Endpoint }}"
            {{- end }}
            # Public Grafana hostname for the "Open Grafana" SSO
            # redirect. Same per-cluster pattern as s3Endpoint —
            # backend has no hardcoded fallback so the launch endpoint
            # returns 503 when this is unset, rather than silently
            # sending users to a domain they don't own.
            {{- if .Values.grafanaUrl }}
            - name: GRAFANA_URL
              value: "{{ .Values.grafanaUrl }}"
            {{- end }}
            - name: KEYCLOAK_URL
              valueFrom:
                secretKeyRef:
                  name: master-config
                  key: url
            - name: CONSOLE_URL
              valueFrom:
                secretKeyRef:
                  name: master-config
                  key: console_url
            - name: KEYCLOAK_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: master-config
                  key: user
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: master-config
                  key: password
            {{- if .Values.backend.smtp.enabled }}
            - name: SMTP_HOST
              value: "{{ .Values.backend.smtp.host }}"
            - name: SMTP_PORT
              value: "{{ .Values.backend.smtp.port }}"
            - name: SMTP_SECURE
              value: "{{ .Values.backend.smtp.secure }}"
            - name: SMTP_USER
              value: "{{ .Values.backend.smtp.user }}"
            - name: SMTP_PASS
              value: "{{ .Values.backend.smtp.password }}"
            - name: SMTP_FROM
              value: "{{ .Values.backend.smtp.from }}"
            - name: SMTP_FROM_NAME
              value: "{{ .Values.backend.smtp.fromName }}"
            {{- end }}
            {{- if ne .Values.billing.provider "none" }}
            - name: BILLING_PROVIDER
              value: "{{ .Values.billing.provider }}"
            {{- end }}
            {{- if eq .Values.billing.provider "stripe" }}
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.billing.stripe.secretName }}
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.billing.stripe.secretName }}
                  key: STRIPE_WEBHOOK_SECRET
            - name: STRIPE_PRICE_DEV_POOL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.billing.stripe.secretName }}
                  key: STRIPE_PRICE_DEV_POOL
            - name: STRIPE_PRICE_PRO_POOL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.billing.stripe.secretName }}
                  key: STRIPE_PRICE_PRO_POOL
            - name: STRIPE_PRICE_SCALE_POOL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.billing.stripe.secretName }}
                  key: STRIPE_PRICE_SCALE_POOL
            - name: STRIPE_PRICE_TURBO_X1
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.billing.stripe.secretName }}
                  key: STRIPE_PRICE_TURBO_X1
            - name: STRIPE_PRICE_TURBO_X2
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.billing.stripe.secretName }}
                  key: STRIPE_PRICE_TURBO_X2
            {{- end }}
            {{- if or (eq .Values.billing.provider "whmcs") (eq .Values.billing.provider "dual") }}
            - name: WHMCS_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: whmcs-credentials
                  key: webhook-secret
            {{- end }}
            # Public-projects gate (see kube-dc/docs/prd/public-projects-gate.md).
            # The backend uses this to gate the egressNetworkType=public
            # option in the project-create form. The manager-side
            # ValidatingWebhook also reads `allow_public_projects` directly
            # from the master-config Secret it loads via ConfigGlobal —
            # this env is purely the UI's view of the same source of truth.
            #
            # NOT gated on .Values.manager.openBao.enabled — every cluster
            # needs the UI feature flag whether or not OpenBao is in use.
            # `optional: true` covers the bootstrap window before the
            # chart re-renders the master-config Secret to include the
            # new key.
            - name: ALLOW_PUBLIC_PROJECTS
              valueFrom:
                secretKeyRef:
                  name: master-config
                  key: allow_public_projects
                  optional: true
            # Tenant-VLAN attachment. The UI must be ABSENT, not disabled, on a
            # cluster that has not enabled it, so the frontend needs the same
            # value the manager reads. Taken straight from the chart value
            # rather than master-config: this is the switch that decides whether
            # the manager publishes NADs at all, so the two cannot drift.
            - name: PROJECT_NETWORK_ENABLED
              value: {{ .Values.projectNetwork.enabled | quote }}
            # Per-project VPC CIDR suggestion (see values.yaml backend.projectCidr).
            # `reserved` must name every underlay inside `pool` that is not a
            # project network, otherwise the allocator can suggest a block that
            # overlaps node/management/VLAN ranges.
            {{- with .Values.backend.projectCidr }}
            - name: PROJECT_CIDR_POOL
              value: {{ .pool | quote }}
            - name: PROJECT_CIDR_PREFIX
              value: {{ .prefix | quote }}
            - name: PROJECT_CIDR_RESERVED
              value: {{ join "," .reserved | quote }}
            {{- end }}
            {{- if and .Values.manager.openBao .Values.manager.openBao.enabled }}
            # M1-T04: backend exchanges users' Keycloak JWTs against
            # the per-Org auth/oidc-keycloak OpenBao mount. Same URL
            # the manager reads from master-config; surfaced as env so
            # the Node.js Vault client doesn't need the secret mount.
            - name: OPENBAO_URL
              valueFrom:
                secretKeyRef:
                  name: master-config
                  key: openbao_url
            # M1-T05: structured audit events for every /api/secrets/*
            # call ship to this Loki push endpoint under the configured
            # tenant (X-Scope-OrgID), per dev-scope §5. Default points
            # at the in-cluster loki-gateway; leave empty (or unset
            # backend.audit.lokiPushUrl) to disable audit emission
            # without breaking the rest of the secrets API.
            - name: LOKI_PUSH_URL
              value: "{{ .Values.backend.audit.lokiPushUrl | default "http://loki-gateway.monitoring.svc:80" }}"
            # M1-T05b: audit query endpoints (/api/audit/*) read from
            # this URL. Defaults to the push URL when not separately
            # set so push and query stay in lock-step when an operator
            # customises one of them.
            - name: LOKI_QUERY_URL
              value: "{{ .Values.backend.audit.lokiQueryUrl | default .Values.backend.audit.lokiPushUrl | default "http://loki-gateway.monitoring.svc:80" }}"
            - name: LOKI_AUDIT_TENANT
              value: "{{ .Values.backend.audit.tenant | default "system" }}"
            {{- end }}
            {{- if .Values.backend.keycloakAdminClient.secretName }}
            # Admin Console pages that read Keycloak (Platform Admins, Auth &
            # SSO) use a client_credentials grant, NOT the admin user/password
            # above. Without these the pages report "Keycloak admin client not
            # configured" and Auth & SSO shows 0 realms on a populated cluster.
            # `kube-dc bootstrap keycloak init` creates the client
            # (kube-dc-admin-backend, confidential + service account).
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.keycloakAdminClient.secretName | quote }}
                  key: {{ .Values.backend.keycloakAdminClient.clientIdKey | quote }}
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.keycloakAdminClient.secretName | quote }}
                  key: {{ .Values.backend.keycloakAdminClient.clientSecretKey | quote }}
            {{- end }}
            # Outbound TLS verification. OFF by default and deliberately so:
            # it can only succeed once the trust bundle covers every host this
            # backend calls — the API server (cluster CA, added by
            # docker-entrypoint.sh) and the platform's own HTTPS endpoints
            # (backend.trustedCA below, when they use a private CA). A cluster
            # that reaches the API server by an address its certificate does not
            # cover would fail every call the moment this flipped, so it is
            # proven per installation and then enabled.
            #
            # Independent of this, the tenant-VLAN authorization path always
            # verifies — see ui/backend/util/k8sVerifiedRequest.js.
            - name: BACKEND_TLS_VERIFY
              value: {{ .Values.backend.tlsVerify | default false | quote }}
            {{- if .Values.backend.trustedCA.configMapName }}
            # Node does NOT read SSL_CERT_DIR (the manager's mechanism). It reads
            # NODE_EXTRA_CA_CERTS — a single FILE, appended to the bundled roots,
            # so public CAs keep working. Required when the platform's own HTTPS
            # endpoints use a private CA, otherwise every server-side call the
            # backend makes fails with "certificate verify failed".
            - name: NODE_EXTRA_CA_CERTS
              value: {{ printf "%s/%s" (trimSuffix "/" .Values.backend.trustedCA.mountPath) .Values.backend.trustedCA.fileName | quote }}
            {{- end }}
          {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.backend.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.backend.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- if or .Values.backend.volumeMounts .Values.backend.trustedCA.configMapName }}
          volumeMounts:
            {{- if .Values.backend.trustedCA.configMapName }}
            - name: trusted-ca
              mountPath: {{ .Values.backend.trustedCA.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- with .Values.backend.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.backend.volumes .Values.backend.trustedCA.configMapName }}
      volumes:
        {{- if .Values.backend.trustedCA.configMapName }}
        - name: trusted-ca
          configMap:
            name: {{ .Values.backend.trustedCA.configMapName | quote }}
        {{- end }}
        {{- with .Values.backend.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
