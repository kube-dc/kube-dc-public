---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
    helm.sh/resource-policy: keep
  name: projectnetworks.kube-dc.com
spec:
  group: kube-dc.com
  names:
    kind: ProjectNetwork
    listKind: ProjectNetworkList
    plural: projectnetworks
    shortNames:
    - projnet
    singular: projectnetwork
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.org
      name: Org
      type: string
    - jsonPath: .spec.project
      name: Project
      type: string
    - jsonPath: .spec.segmentRef
      name: Segment
      type: string
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          ProjectNetwork is the Schema for the projectnetworks API. It grants one
          project an attachment to one datacenter VLAN.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ProjectNetworkSpec binds one project to one physical segment.

              The tenant grant (org/project) and the segment reference are immutable for
              the object's lifetime. "Immutable while no port is attached" would be racy:
              an update and the first attachment can both observe zero ports and both
              proceed. Re-pointing a segment is a delete plus a create, which goes through
              the drain-first teardown.
            properties:
              cidrBlock:
                description: |-
                  CidrBlock is the customer's subnet on the segment. Required for the
                  kube-ovn-underlay driver, where we allocate addresses; ignored by the
                  external-DHCP drivers, where the customer's own DHCP addresses the guest.
                type: string
                x-kubernetes-validations:
                - message: cidrBlock is immutable
                  rule: self == oldSelf
              excludeIps:
                description: |-
                  ExcludeIps are addresses on the segment that we must never hand out —
                  typically the whole range occupied by the customer's existing hardware.
                  Ranges use the kube-ovn "a..b" form.
                items:
                  type: string
                type: array
                x-kubernetes-validations:
                - message: excludeIps is immutable
                  rule: self == oldSelf
              gateway:
                description: |-
                  Gateway is the gateway address on the segment. It is REQUIRED for the
                  kube-ovn-underlay driver even when the segment has no physical router:
                  kube-ovn silently creates no logical switch for a subnet with an empty
                  gateway, so the attachment would appear healthy in every CR while pods
                  stayed stuck in ContainerCreating with "not found logical switch".

                  The supported L2 slice requires a real customer router address. Segments with
                  no physical gateway belong to the future routed phase and are rejected.

                  This is NOT the attached port's default route — the tenant VPC NIC always
                  keeps the default route, whatever this says.
                type: string
                x-kubernetes-validations:
                - message: gateway is immutable
                  rule: self == oldSelf
              gatewayCheck:
                description: |-
                  GatewayCheck lets kube-ovn probe the gateway before declaring the subnet
                  usable. It defaults to FALSE, which is the safe default on a customer's
                  segment: their router owes us no ICMP reply, and an unanswered probe would
                  wedge the attachment. Enable it only when the gateway is known to answer.
                type: boolean
                x-kubernetes-validations:
                - message: gatewayCheck is immutable
                  rule: self == oldSelf
              logicalGateway:
                description: |-
                  LogicalGateway is reserved for the routed phase and must remain false. The
                  production gate currently models only a physical L2 segment with a real
                  customer gateway; enabling this introduces transitive reachability the
                  segment authorization index does not traverse.
                enum:
                - false
                type: boolean
                x-kubernetes-validations:
                - message: logicalGateway is immutable
                  rule: self == oldSelf
              mode:
                description: Mode selects L2 adjacency. Routed L3 is not part of this
                  API version.
                enum:
                - l2
                type: string
                x-kubernetes-validations:
                - message: mode is immutable
                  rule: self == oldSelf
              org:
                description: Org is the Organization that owns the project receiving
                  this segment.
                type: string
                x-kubernetes-validations:
                - message: org is immutable
                  rule: self == oldSelf
              project:
                description: |-
                  Project is the Project receiving this segment. The target namespace is
                  "<org>-<project>".
                type: string
                x-kubernetes-validations:
                - message: project is immutable
                  rule: self == oldSelf
              securityGroup:
                description: |-
                  SecurityGroup optionally binds an existing security group to attached ports.
                  Empty applies port-security anti-spoofing only; no policy is invented.
                type: string
                x-kubernetes-validations:
                - message: securityGroup is immutable
                  rule: self == oldSelf
              segmentRef:
                description: |-
                  SegmentRef names the FabricSegment (the physical broadcast domain) this
                  binding claims. Exclusivity is enforced on the segment, not on the driver
                  path, because several driver paths can alias the same wire.
                type: string
                x-kubernetes-validations:
                - message: segmentRef is immutable
                  rule: self == oldSelf
            required:
            - mode
            - org
            - project
            - segmentRef
            type: object
          status:
            description: ProjectNetworkStatus reports what the controller realised.
            properties:
              adoptedVlan:
                description: |-
                  AdoptedVlan is true when the Vlan already existed and was adopted rather
                  than created. Teardown deletes only Vlans this controller created.
                type: boolean
              attachedPorts:
                description: |-
                  AttachedPorts is the number of workloads currently attached, as observed
                  during teardown quiescence.
                format: int32
                type: integer
              conditions:
                description: Conditions represents the latest available observations
                  of the binding's current state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              nadName:
                description: |-
                  NadName is the NetworkAttachmentDefinition published into the project
                  namespace. Its mere existence makes the segment attachable, so it is
                  created last and removed first.
                type: string
              namespace:
                description: Namespace is the resolved project namespace ("<org>-<project>").
                type: string
              namespaceUid:
                description: |-
                  NamespaceUid pins the identity of that namespace at claim time.

                  Namespace NAME equality is not tenant identity: a namespace can be deleted
                  and recreated for a different project, and two different org/project pairs
                  can hyphenate to the same string. Admission compares the LIVE namespace UID
                  against this, so a recreated namespace does not inherit the previous
                  tenant's wire.
                type: string
              phase:
                default: Pending
                description: Phase is the coarse lifecycle state.
                type: string
              projectUid:
                description: ProjectUid pins the owning Project object, for the same
                  reason.
                type: string
              quiesceObservations:
                description: |-
                  QuiesceObservations counts consecutive teardown passes that saw zero
                  attach intent. It lives in status, not in an annotation: the teardown path
                  persists with Status().Update, which does not write metadata, so an
                  annotation-based counter would silently never advance and the NAD would
                  never be removed.
                format: int32
                type: integer
              reservationRef:
                description: |-
                  ReservationRef names the VlanReservation that proves this binding owns the
                  segment. A binding that does not hold the reservation never publishes a
                  NAD and never becomes Ready.
                type: string
              securityGroup:
                description: SecurityGroup is the security group stamped onto every
                  attached port.
                type: string
              subnetName:
                description: |-
                  SubnetName is the kube-ovn Subnet created for this binding, if the driver
                  uses one.
                type: string
              vlanName:
                description: |-
                  VlanName is the kube-ovn Vlan carrying the tag. AdoptedVlan records whether
                  it pre-existed, because a shared fabric Vlan must survive our teardown.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
