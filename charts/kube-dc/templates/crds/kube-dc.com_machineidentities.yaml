---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    helm.sh/resource-policy: keep
  name: machineidentities.kube-dc.com
spec:
  group: kube-dc.com
  names:
    kind: MachineIdentity
    listKind: MachineIdentityList
    plural: machineidentities
    shortNames:
    - mid
    singular: machineidentity
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.clientId
      name: Client
      type: string
    - jsonPath: .spec.groups
      name: Groups
      type: string
    - jsonPath: .status.authentication
      name: Auth
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          MachineIdentity is a non-human identity of an organization. It lives in the
          organization namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              MachineIdentitySpec declares a non-human identity of an organization: a
              confidential Keycloak client in the organization's realm whose service
              account signs in with the client-credentials grant. Its tokens reach the
              Kubernetes API as the organization user
              `<org>:<name>@machine.kube-dc.invalid`, a member of Groups, so the same RBAC
              that governs people governs it (Terraform, MCP, CI;
              docs/internal/machine-identities.md).
            properties:
              description:
                description: Description is shown in the console and CLI.
                maxLength: 256
                type: string
              disabled:
                description: |-
                  Disabled refuses new tokens without deleting the identity; issued tokens
                  stay valid until they expire.
                type: boolean
              github:
                description: |-
                  GitHub makes the identity keyless for one GitHub Actions workload: the
                  workflow signs in with its own OIDC token instead of a client secret
                  (Keycloak federated client authentication; docs/cloud/machine-identities.md).
                  The client secret then stops working and the credentials Secret holds
                  no secret. Removing GitHub issues a new client secret.
                properties:
                  subject:
                    description: |-
                      Subject is the exact `sub` claim of the workflow's OIDC token, which
                      says which repository and which environment, branch or event asks:
                      `repo:<owner>/<repo>:environment:<name>`, `...:ref:refs/heads/<branch>`
                      or `...:pull_request`. Repositories created, renamed or transferred
                      since 2026-07-15 (or opted in) carry immutable ids:
                      `repo:<owner>@<owner-id>/<repo>@<repo-id>:environment:<name>`.
                      One subject per identity: use one identity per environment.
                    maxLength: 512
                    minLength: 8
                    pattern: ^repo:[^\s]+:[^\s]+$
                    type: string
                required:
                - subject
                type: object
              groups:
                description: |-
                  Groups the identity belongs to: "org-admin", "user", or the name of an
                  OrganizationGroup of this organization. Unknown names are reported in
                  status and not joined.
                items:
                  type: string
                maxItems: 32
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              secretGeneration:
                description: |-
                  SecretGeneration rotates the client secret when increased. The previous
                  secret stops working at once, so consumers must be given the new one.
                format: int64
                minimum: 0
                type: integer
              tokenLifetimeSeconds:
                description: |-
                  TokenLifetimeSeconds is the lifetime of an issued access token. Clients
                  fetch a new one before it expires; the realm default applies when unset.
                format: int32
                maximum: 3600
                minimum: 60
                type: integer
            required:
            - groups
            type: object
          status:
            description: MachineIdentityStatus is the observed state of a MachineIdentity.
            properties:
              audience:
                description: |-
                  Audience is the audience a GitHub workflow requests for its OIDC token
                  (the realm's issuer URL); set with spec.github.
                type: string
              authentication:
                description: |-
                  Authentication is how the identity signs in: ClientSecret, or
                  GitHubOIDC (spec.github).
                type: string
              clientId:
                description: ClientID is the Keycloak client to request tokens for.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              groups:
                description: Groups are the groups the service account is a member
                  of.
                items:
                  type: string
                type: array
              observedSecretGeneration:
                description: ObservedSecretGeneration is the spec.secretGeneration
                  the Secret holds.
                format: int64
                type: integer
              ready:
                description: |-
                  Ready is true when the client exists, the service account carries the
                  Kubernetes username, every group in spec is joined and the credentials
                  Secret holds the current secret.
                type: boolean
              refusedGroups:
                description: RefusedGroups are spec groups that are not groups of
                  this organization.
                items:
                  type: string
                type: array
              secretName:
                description: |-
                  SecretName is the Secret in this namespace holding client-id,
                  client-secret and token-url (no client-secret with spec.github).
                  Readable by the organization's admins.
                type: string
              secretRotatedAt:
                description: SecretRotatedAt is when the client secret was last issued.
                format: date-time
                type: string
              tokenUrl:
                description: TokenURL is the realm's token endpoint (client-credentials
                  grant).
                type: string
              username:
                description: Username is the Kubernetes user the identity's tokens
                  authenticate as.
                type: string
            required:
            - ready
            type: object
        type: object
        x-kubernetes-validations:
        - message: name must be at most 40 characters
          rule: size(self.metadata.name) <= 40
    served: true
    storage: true
    subresources:
      status: {}
