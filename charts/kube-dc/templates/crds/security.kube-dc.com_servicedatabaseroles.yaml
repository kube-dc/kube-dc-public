              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              bindingGeneration:
                format: int64
                minimum: 1
                type: integer
              bindingRef:
                description: ServiceAuthorityReference always names one object incarnation.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    maxLength: 63
                    minLength: 1
                    type: string
                  uid:
                    maxLength: 64
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                - uid
                type: object
              connectionRef:
                description: ServiceAuthorityReference always names one object incarnation.
