---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
    helm.sh/resource-policy: keep
  name: vlanreservations.kube-dc.com
spec:
  group: kube-dc.com
  names:
    kind: VlanReservation
    listKind: VlanReservationList
    plural: vlanreservations
    shortNames:
    - vlanres
    singular: vlanreservation
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.segmentRef
      name: Segment
      type: string
    - jsonPath: .spec.owner.name
      name: Owner
      type: string
    - jsonPath: .status.epoch
      name: Epoch
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          VlanReservation is the Schema for the vlanreservations API. It is the
          storage-atomic proof that exactly one project holds a physical segment.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              VlanReservationSpec records which ProjectNetwork owns a physical segment.

              The reservation exists so that exclusivity is decided by the API server's
              name uniqueness rather than by an admission webhook. Admission webhooks are
              non-transactional: a GET-then-CREATE inside one is a TOCTOU, the claim can be
              orphaned by a dry-run or a failed later validation, and the object being
              admitted has no UID yet to own the claim. Instead the CONTROLLER creates this
              object, named after the segment, and only the winner of that CREATE goes on
              to publish a NAD.
            properties:
              owner:
                description: Owner is the ProjectNetwork holding the segment.
                properties:
                  name:
                    description: Name of the owning ProjectNetwork.
                    type: string
                  namespace:
                    description: |-
                      Namespace is the project namespace the segment is bound into. Recorded for
                      operator legibility; the authoritative grant lives on the ProjectNetwork.
                    type: string
                  uid:
                    description: |-
                      Uid of the owning ProjectNetwork. On an AlreadyExists collision the
                      controller compares this: an equal UID means it is re-reconciling its own
                      claim and must RESUME (the create is idempotent), a different UID means it
                      genuinely lost the race. Without the UID a controller restart would read
                      its own prior claim as a conflict and wedge the binding forever.
                    type: string
                required:
                - name
                - uid
                type: object
              segmentRef:
                description: |-
                  SegmentRef is the FabricSegment this reservation covers. It equals the
                  reservation's own name — the reservation is 1:1 with the broadcast domain.
                type: string
            required:
            - owner
            - segmentRef
            type: object
          status:
            description: |-
              VlanReservationStatus is operator-facing claim state. Ownership safety comes
              from the reservation object existing under the segment name and from the exact
              owner UID in spec; status is not used as a concurrency token.
            properties:
              conditions:
                description: Conditions represents the latest available observations
                  of the reservation's current state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              epoch:
                default: 0
                description: |-
                  Epoch is an informational claim-incarnation counter. It increments when an
                  orphaned reservation is taken over, but reconcilers do not compare it when
                  authorizing or publishing a network.
                format: int64
                type: integer
              released:
                description: |-
                  Released is a backward-compatible inactive marker. The current controller
                  keeps it false and deletes the reservation only after teardown has confirmed
                  the NAD and all attachment intent are gone.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
