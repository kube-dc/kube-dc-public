---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
    controller-gen.kubebuilder.io/version: v0.16.4
  name: addressarenas.kube-dc.com
spec:
  group: kube-dc.com
  names:
    kind: AddressArena
    listKind: AddressArenaList
    plural: addressarenas
    shortNames:
    - arena
    singular: addressarena
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.subnetName
      name: Subnet
      type: string
    - jsonPath: .spec.project
      name: Project
      type: string
    - jsonPath: .status.claimCount
      name: Claims
      type: string
    - jsonPath: .status.reservedAddresses
      name: Reserved
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: 'AddressArenaSpec: identity of the subnet plus the claim
              map.'
            properties:
              addressSpace:
                default: ProjectSubnet
                description: |-
                  AddressSpace of this arena (see AddressReservationSpec.AddressSpace). For
                  VPCVIPPool arenas the CLAIMS ARE THE LEDGER (no subnet, no annotation):
                  cidrBlock is the pool CIDR, subnetName the pool name (vip-<project-ns>).
                enum:
                - ProjectSubnet
                - VPCVIPPool
                type: string
              cidrBlock:
                description: |-
                  CIDRBlock / Gateway / VPC are the subnet geometry the claims' offsets
                  are relative to, recorded at creation and immutable: a subnet that
                  changes them under the same UID invalidates the arena for repairs.
                maxLength: 63
                minLength: 1
                type: string
              claims:
                description: |-
                  Claims are the reserved intervals, as offsets from the subnet's network
                  address (inclusive). Offsets, not addresses, so the API server can check
                  non-overlap. Keyed by name (a list-map): a name cannot appear twice.
                items:
                  description: ArenaClaim is one reserved interval.
                  properties:
                    claimedAt:
                      format: date-time
                      type: string
                    endOffset:
                      format: int64
                      minimum: 1
                      type: integer
                    name:
                      description: |-
                        Name of the AddressReservation that owns the interval, optionally with a
                        lifecycle suffix: "<reservation>", "<reservation>/quarantined-N",
                        "<reservation>/tombstone-N" or "<reservation>/active-N".
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(/(quarantined|tombstone|active)-[0-9]+)?$
                      type: string
                    purpose:
                      enum:
                      - Arena
                      - ClusterBlock
                      - Legacy
                      type: string
                    startOffset:
                      format: int64
                      minimum: 1
                      type: integer
                  required:
                  - endOffset
                  - name
                  - purpose
                  - startOffset
                  type: object
                  x-kubernetes-validations:
                  - message: startOffset must not exceed endOffset
                    rule: self.startOffset <= self.endOffset
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              gateway:
                maxLength: 63
                type: string
              project:
                description: |-
                  Project is the logical project identity "<org-namespace>/<name>" — stable
                  across delete/restore, unlike a UID.
                maxLength: 253
                minLength: 1
                type: string
              subnetName:
                maxLength: 253
                minLength: 1
                type: string
              subnetUID:
                description: SubnetUID is empty for VPCVIPPool arenas (there is no
                  subnet).
                maxLength: 63
                minLength: 1
                type: string
              vpc:
                maxLength: 253
                type: string
            required:
            - cidrBlock
            - project
            - subnetName
            type: object
            x-kubernetes-validations:
            - message: arena identity, geometry and address space are immutable
              rule: 'self.subnetName == oldSelf.subnetName && has(self.subnetUID)
                == has(oldSelf.subnetUID) && (!has(self.subnetUID) || self.subnetUID
                == oldSelf.subnetUID) && self.project == oldSelf.project && self.cidrBlock
                == oldSelf.cidrBlock && has(self.gateway) == has(oldSelf.gateway)
                && (!has(self.gateway) || self.gateway == oldSelf.gateway) && has(self.vpc)
                == has(oldSelf.vpc) && (!has(self.vpc) || self.vpc == oldSelf.vpc)
                && (has(self.addressSpace) ? self.addressSpace : ''ProjectSubnet'')
                == (has(oldSelf.addressSpace) ? oldSelf.addressSpace : ''ProjectSubnet'')'
            - message: claims must not overlap
              rule: '!has(self.claims) || self.claims.all(a, self.claims.all(b, a.name
                == b.name || a.endOffset < b.startOffset || b.endOffset < a.startOffset))'
          status:
            properties:
              claimCount:
                format: int32
                type: integer
              conditions:
                description: |-
                  Conditions: Consistent (every claim and every ledger range is covered by
                  excludeIps), GeometryChanged.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastAuditAt:
                format: date-time
                type: string
              observedCIDR:
                description: |-
                  ObservedCIDR is the subnet cidrBlock the claims' offsets are relative to;
                  a change invalidates every claim until an operator migrates them.
                type: string
              observedSubnetUID:
                type: string
              reservedAddresses:
                format: int32
                type: integer
              reservedCIDRs:
                description: |-
                  ReservedCIDRs is the canonical CIDR decomposition of EVERY claim (active,
                  unowned, quarantined and tombstoned — all of them stay fenced), for
                  admission policies that must refuse static addresses inside the fence.
                  Adjacent claims are coalesced before decomposition. Bound: ≤ 64 claims
                  (spec.claims MaxItems) × ≤ 30 CIDRs per interval of a /16 = 1920.
                items:
                  maxLength: 43
                  type: string
                maxItems: 2048
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
