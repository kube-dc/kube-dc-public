# Internal cluster-local platform endpoints.
#
# Each enabled endpoint renders:
#   - a MetalLB IPAddressPool + L2Advertisement reserving the VIP and
#     announcing it via ARP on the configured interface, and
#   - a selectorless Service of type=LoadBalancer with
#     spec.loadBalancerClass set so MetalLB (filtered by --lb-class)
#     allocates the IP and announces it.
#
# The Service is annotated for kube-dc-manager's platform-endpoint
# controller, which on first reconcile creates an EndpointSlice
# (<svc-name>-mgr, ownerRef to the Service) and maintains its
# addresses from live health probes.
#
# Phase D.1 — only kubeAPI is shipped today. Adding a second endpoint
# means duplicating the kubeAPI shape.
#
# See: docs/prd/internal-platform-endpoints-implementation.md (E2 design)
#      docs/internal/internal-platform-endpoints-runbook.md (operator)
# ── Front-door guardrails (ingress design v2 §5a.2) ────────────────────────
# Abuse control on the platform's own public hostnames. Ships DISABLED: the
# right ceiling depends on cluster size and whether your operators arrive
# from a shared NAT, and a limit set too low locks people out of the console.
#
# Enable only AFTER the front door preserves the client IP (host-bind data
# plane, or a VIP with externalTrafficPolicy: Local). Under
# externalTrafficPolicy: Cluster every client is SNATed to a node address and
# would share ONE bucket — the first burst throttles everybody.
#
# Limits are LOCAL (per Envoy process = per ingress node); the effective
# ceiling is requests x ingressNodes. Global exactness would require the
# Envoy ratelimit service + Redis — two components we deliberately avoid.
ingressGuardrails:
  rateLimit:
    enabled: false
    # /32 = "one bucket per distinct client address".
    clientCIDR: 0.0.0.0/0
    requests: 100
    unit: Minute
    # HTTPRoute NAMES in this release's namespace (targetRefs has no namespace
    # field — see the template). Default protects the console/frontend only.
    #
    # kube-dc-backend is deliberately EXCLUDED: it already carries a
    # default-on BackendTrafficPolicy for SourceIP consistent-hash stickiness
    # (backend-traffic-policy.yaml), and Envoy Gateway attaches only the
    # OLDEST policy per target — the other is marked Conflicted. Adding the
    # backend here would silently either lose the rate limit or, worse, lose
    # the stickiness the org-admin elevation flow depends on. To rate-limit
    # the backend, merge the limit INTO that policy instead.
    targetRoutes:
      - kube-dc-frontend

platformEndpoints:
  kubeAPI:
    enabled: false              # opt-in per cluster
    name: kube-api-platform     # Service name; manager slice = <name>-mgr
    namespace: kube-system
    vip: ""                     # REQUIRED if enabled. MUST be in the
                                # ext-cloud Subnet's excludeIps AND in
                                # BOTH INGRESS_GLOBAL_ALLOWLIST and
                                # EGRESS_GLOBAL_ALLOWLIST on every
                                # tenant LR.
    pool: kube-api-platform     # MetalLB IPAddressPool name
    advertisementMode: l2       # "l2" (default) — ARP/GARP L2Advertisement
                                # on `interface`; needs a shared L2 segment.
                                # "bgp" — BGPAdvertisement: the VIP is
                                # announced as a /32 route to the cluster's
                                # BGPPeers (peers are cluster infra, shipped
                                # by the fleet layer addons/metallb-config-bgp
                                # — this chart never creates BGP sessions).
                                # Use "bgp" on routed/L3-only fabrics
                                # (METALLB_MODE=bgp in cluster-config.env).
    interface: br-ext-cloud     # L2Advertisement interface (l2 mode only;
                                # unused in bgp mode)
    bgpPeers: []                # bgp mode only: restrict announcement to
                                # these BGPPeer names. Empty = all peers.
    advNodeSelectors: []        # Constrain which nodes announce the VIP
                                # (both modes; falls back to
                                # l2AdvNodeSelectors for compatibility).
    l2AdvNodeSelectors: []      # DEPRECATED alias of advNodeSelectors —
                                # constrain MetalLB speaker election to
                                # nodes matching these label selectors.
                                # Empty list = any speaker is eligible
                                # (correct for 1:1-NAT-class
                                # clusters where every node is CP+gw).
                                # For multi-CP/heterogeneous-worker
                                # clusters where some nodes don't have
                                # br-ext-cloud, set to:
                                #   - matchLabels:
                                #       node-role.kubernetes.io/control-plane: "true"
                                # so MetalLB only picks anchored CP nodes.
    loadBalancerClass: metallb  # MUST match the MetalLB controller's
                                # --lb-class flag. 1:1-NAT clusters run
                                # the upstream default "metallb"; an
                                # operator running a different MetalLB
                                # build can override.
    port: 6443
    sessionAffinity: ""         # default: no affinity (apiserver
                                # doesn't need it; affinity + a dead
                                # backend is worse than no affinity)
    backend:
      mode: node-control-plane
      nodeSelector:
        # `key=` empty value is parsed as a label-exists requirement
        # (kubectl convention), so this matches both kubeadm
        # (key="") and RKE2 (key="true") topologies.
        node-role.kubernetes.io/control-plane: ""
      addressType: InternalIP
      health:
        scheme: https
        path: /readyz
        port: 6443
        intervalSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 2
        successThreshold: 1
        # Probe runs without ServiceAccount auth — the apiserver cert
        # SAN does not typically cover the Node InternalIP. The probe
        # is liveness, not authentication.
        insecureSkipVerify: true
        # Default 399 (standard k8s probe convention: 2xx + 3xx).
        # Raise to 499 for auth-gated endpoints like RKE2 /readyz
        # which returns 401 to unauthenticated probes (apiserver
        # process IS alive at that point).
        statusMax: 499
  # Generic Envoy gateway front-door (extends the kubeAPI pattern to
  # cover every public-hostname'd service tenant pods need to reach:
  # Keycloak login, kube-dc-backend, kube-dc-console, billing, …).
  # Same MetalLB + selectorless-Service + manager-EndpointSlice
  # pattern as kubeAPI; the probe target is Envoy gateway's :443
  # listener instead of kube-apiserver's :6443.
  #
  # When tenant pods resolve login.<DOMAIN> / backend.<DOMAIN> via
  # vpc-dns Corefile, the hostnames rewrite to this VIP. Traffic
  # arrives at the MetalLB-elected speaker's br-ext-cloud → kube-
  # proxy DNATs to one of the Envoy gateway hostNetwork node IPs →
  # Envoy matches the Host header against its HTTPRoutes and forwards
  # to the right backend (keycloak Service, kube-dc-backend Service,
  # etc).
  #
  # Why this is needed: a production 1:1-NAT cluster, 2026-06-02 — kube-dc CLI in
  # the project console pod failed to refresh its OIDC token because
  # tenant pods could not reach login.<cluster-domain> (resolves to
  # the cluster's public IP which hairpin-fails on 1:1-NAT setups).
  # The kubeAPI platform endpoint had already fixed the same gap for
  # kube-api; this generalizes the fix to every Envoy-routed
  # platform hostname.
  envoyGateway:
    enabled: false                   # opt-in per cluster
    name: envoy-gateway-platform     # Service name; manager slice = <name>-mgr
    namespace: envoy-gateway-system
    vip: ""                          # REQUIRED if enabled. MUST be in
                                     # ext-cloud Subnet excludeIps AND
                                     # in BOTH INGRESS_GLOBAL_ALLOWLIST
                                     # and EGRESS_GLOBAL_ALLOWLIST.
    pool: envoy-gateway-platform     # MetalLB IPAddressPool name
    advertisementMode: l2            # "l2" (default) ARP/GARP on `interface`
                                     # | "bgp" /32 routes to the cluster's
                                     # BGPPeers (see kubeAPI.advertisementMode)
    interface: br-ext-cloud          # l2 mode only; unused in bgp mode
    bgpPeers: []                     # bgp mode only: restrict to named peers
    advNodeSelectors: []             # Constrain announcing nodes (both
                                     # modes; falls back to
                                     # l2AdvNodeSelectors).
    l2AdvNodeSelectors: []           # DEPRECATED alias — constrain MetalLB
                                     # speaker election
                                     # (see kubeAPI.l2AdvNodeSelectors).
                                     # Set to control-plane=true on
                                     # heterogeneous-worker clusters.
    loadBalancerClass: metallb
    # Envoy gateway terminates TLS; 443 is the front-door port.
    port: 443
    sessionAffinity: ""
    backend:
      # Envoy gateway data-plane runs as hostNetwork on CP nodes
      # (single-replica today; multi-replica when PRD §6.A Phase A
      # ships). node-control-plane selector hits the right nodes;
      # the probe filters to whichever ones currently have Envoy.
      #
      # ⚠ THIS SELECTOR IS COUPLED TO WHERE ENVOY RUNS, and nothing enforces
      # the coupling. It selects control-plane nodes because that is where the
      # host-bind data plane happens to sit on every cluster that enables this
      # endpoint today — and all of them run ingress ON their control-plane
      # nodes, which is what makes the selector correct there.
      #
      # Move Envoy to dedicated ingress workers — which is what
      # `--ingress-node` on non-CP nodes means, and what the host-bind component
      # makes easy — and this EndpointSlice keeps selecting control-plane nodes
      # that no longer run Envoy. It then has zero ready endpoints, and the
      # symptom is that tenant pods lose their in-VPC route to the platform
      # while every component reports healthy.
      #
      # So when ingress placement changes, THIS must change with it: set
      # nodeSelector to the same set Envoy is scheduled on (e.g.
      # kube-dc.com/ingress: "true"). `kube-dc bootstrap accept` reports the
      # platform endpoint's readiness, which is the check that catches a
      # mismatch after the fact; there is no admission-time guard.
      mode: node-control-plane
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      addressType: InternalIP
      health:
        # TLS handshake against :443 is enough to prove Envoy is up.
        # Envoy may return 302/404/421 for the probe; statusMax=499
        # covers all of those as "process alive".
        #
        # host: REQUIRED — Envoy's HTTPS listener pipeline rejects
        # handshakes whose SNI doesn't match a configured Gateway
        # listener (the probe gets "connection reset by peer" with a
        # bare-IP SNI). Set to one of the cluster's gateway hostnames;
        # `kube-api.<DOMAIN>` works on every kube-dc cluster because
        # the kube-api Gateway is always installed. The probe sends
        # this as both TLS SNI and HTTP Host header.
        scheme: https
        path: /
        port: 443
        host: ""                     # REQUIRED (e.g. "kube-api.${DOMAIN}")
        intervalSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 2
        successThreshold: 1
        insecureSkipVerify: true
        statusMax: 499


# KubeVirt tenant-node kubelet reachability.
#
# KubeVirt masquerade gives the guest 10.0.2.2 and advertises the outer
# virt-launcher Pod IP as the Kubernetes Node InternalIP. Remote parent-VPC
# callers reach that outer address through KubeVirt's prerouting DNAT, but a
# Konnectivity agent inside the same guest cannot: locally originated traffic
# never traverses that prerouting rule. kubectl logs/exec/port-forward then fail
# with `dial tcp <Node InternalIP>:10250: connect: connection refused` while the
# Node remains Ready.
#
# The Sveltos addon mirrors status.hostIP (the advertised outer Node IP) as a
# /32 on the guest loopback. This makes the existing Konnectivity dial local
# without changing kubelet, CCM, Cilium, Kamaji, or the VMI network binding.
# It is selected by BOTH positive labels and must never target CloudSigma:
# CloudSigma's Node IP already belongs to a physical NIC.
kubevirtNodeIPAlias:
  enabled: true
  image:
    repository: docker.io/library/busybox
    # Multi-arch BusyBox 1.36.1 manifest, pinned so this privileged network
    # helper cannot change underneath a platform release.
    digest: sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    pullPolicy: IfNotPresent
  # Cilium is normally tier 1. The alias uses hostNetwork and could start
  # without CNI, but ordering it after Cilium keeps addon status predictable.
  tier: 5
  resources:
    requests:
      cpu: 5m
      memory: 8Mi
    limits:
      cpu: 50m
      memory: 32Mi


# kubelet-csr-approver — Sveltos-distributed addon that auto-approves
# kubelet-serving CSRs (signer kubernetes.io/kubelet-serving) inside every
# managed-K8s tenant cluster. Required for kubelet `serverTLSBootstrap=true`
# (which k8-manager turns on by default via KamajiControlPlane.spec.kubelet.
# configurationJSONPatches) to actually result in serving certs being issued.
#
# This is a tenant-cluster addon — it does NOT run on the management cluster.
# The platform chart only ships the Sveltos ClusterProfile; Sveltos then
# pulls the postfinance/kubelet-csr-approver Helm chart into each matching
# tenant.
#
# Default-on; opt-out per tenant Cluster with label
# `kubelet-csr-approver=disabled`.
#
# Hard requirement: Sveltos must be installed on the cluster (the platform
# layer in kube-dc-fleet/platform/sveltos installs it, so this is satisfied
# on every Flux-managed kube-dc cluster). On a cluster without Sveltos
# CRDs, set kubeletCsrApprover.enabled=false (or install Sveltos first).
#
# Documented in: docs/prd/boc-tenant-kubelet-kubeproxy-observability.md
kubeletCsrApprover:
  enabled: true
  # postfinance/kubelet-csr-approver chart on the upstream gh-pages repo
  repositoryURL: "https://postfinance.github.io/kubelet-csr-approver"
  repositoryName: "postfinance"
  chartName: "postfinance/kubelet-csr-approver"
  chartVersion: "1.2.4"
  releaseName: "kubelet-csr-approver"
  releaseNamespace: "kube-system"
  # Deploy late in the addon ordering so CNI / CoreDNS / kube-api-proxy
  # are already up by the time the approver needs to call the tenant
  # apiserver (typical Sveltos tiers: cilium=1, coredns=10,
  # kube-api-proxy=20, metallb=25 — the approver fits after these).
  tier: 50

  # Acceptance policy for the approver. A permissive csr-approver is worse
  # than no approver — these keep the node-identity binding strict.
  #
  # bypassDnsResolution=true is REQUIRED for kube-dc managed clusters and is
  # the validated default. VERIFIED 2026-06-24 on a CloudSigma production tenant cluster:
  # CloudSigma names nodes by UUID (system:node:<uuid>) which has NO in-tenant
  # DNS record, so with bypassDnsResolution=false the approver cannot resolve
  # the node name to validate the CSR's IP SAN and DENIES every legitimate
  # kubelet-serving CSR ("SAN IP 100.64.x.x is not contained in the set of
  # resolved IP addresses"). With true, the approver skips that DNS-based IP
  # check; security still rests on: CN must be system:node:<name> + group
  # system:nodes (CSR signed by THAT node's own credentials), providerRegex on
  # the name, and the max cert lifetime. This is the standard config for
  # kubeadm/cloud clusters whose node names aren't DNS-resolvable. Proven
  # end-to-end: new node CSR Approved,Issued -> metrics-server scrapes the
  # kubelet over TLS (no --kubelet-insecure-tls).
  policy:
    # Allowed kubelet node-name shape (the part after system:node: in the CSR
    # CN). RFC-1123-ish; wide enough for CloudSigma UUID node names.
    providerRegex: "^[a-z0-9][a-z0-9-]{0,62}$"
    # Skip the DNS-resolve-and-match-IP-SAN check. REQUIRED on kube-dc managed
    # clusters (UUID node names don't resolve) — see header. Identity +
    # providerRegex + lifetime checks still enforced.
    bypassDnsResolution: true
    # Leave non-system:node:* CSRs untouched (don't Deny) — avoids interfering
    # with other workflows watching the same signer.
    ignoreNonSystemNodeCsr: true
    # Node hostnames are UUIDs that don't resolve; don't require resolution.
    bypassHostnameCheck: false
    # Cap cert lifetime at ~366 days (kubelet rotates well before this).
    maxExpirationSeconds: 31622400

# OS-image pre-pull DaemonSet (vm-startup-acceleration M1-T05).
# Warms every node's containerd cache with the catalog's digest-pinned
# containerdisk images (families[].registryURL in cdi-os-catalog). Default OFF
# until the Phase B in-cluster registry makes pulls LAN-local; enabling it is
# what upgrades the spegel cold-burst guarantee to "once per cluster".
osImagePrepull:
  enabled: false
  # Catalog poll interval. Each poll pulls any digest-pinned ref not currently
  # present in this node's containerd store (checked live via crictl inspecti,
  # so a GC-evicted image is re-warmed), skipping those already present. A fresh
  # digest from the mirror is warmed within pollMinutes; bounds the per-node
  # "new image cold->warm" latency.
  pollMinutes: 15
  # Util image with jq (same image the cdi-upload-gc cron uses).
  image: docker.io/shalb/kubectl-jq:v1.35.4
  # RKE2 paths; override for other distros.
  containerdSocket: /run/k3s/containerd/containerd.sock
  hostBinDir: /var/lib/rancher/rke2/bin

# Tenant-VLAN attachment (docs/prd/tenant-vlan-attachment-implementation.md).
#
# A ProjectNetwork binds one project to one physical datacenter VLAN so the
# tenant's VMs and pods can reach their own colocated hardware. Off by default,
# and the default matters: a NetworkAttachmentDefinition is attachable the
# instant it exists. With this false the controller creates no fabric and
# publishes no NAD. Only the admin-facing ProjectNetwork CREATE guard remains;
# the workload, fabric and NAD admission paths are not deployed.
#
# Turning this on requires the gate, the RBAC lockdown and the fabric readiness
# to be in place — enabling it is what makes a wire reachable.
projectNetwork:
  enabled: false
  # Exact service-account identity used by the pinned Kube-OVN chart. The
  # controller must add the generated Subnet finalizer and normalize its safe
  # fields; a namespace prefix or admin-group exemption is forbidden.
  kubeOvnControllerUsername: system:serviceaccount:kube-system:ovn

# Admission policies applied to tenant PROJECT namespaces.
projectPolicies:
  # Reserve the pod labels + ServiceAccount names that the infra-attachment
  # webhook treats as proof of platform identity. Without this a project admin
  # (who holds `*` on `*` inside their own namespace) can stamp those labels on
  # their own workload and obtain a route to the management apiserver.
  #
  # Deny by default (operator decision 2026-08-07, after the audit-mode pass on
  # cloud/stage showed no legitimate workload setting these). An existing
  # cluster that wants a look first can set ["Audit"] to log without blocking.
  reservePlatformIdentities:
    enabled: true
    validationActions: ["Deny"]
