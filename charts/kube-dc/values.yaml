kubeApiExternalUrl: "" # Required, example: "kube-api.stage.kube-dc.com:6443"

# How infra-side platform controllers in dual-homed project namespaces reach
# this management cluster API. Empty mode preserves the legacy per-component
# infraAPIEndpoint values for upgrade compatibility; fleet installs set a mode
# explicitly. service is opt-in and requires manager.infraAttachment plus the
# exact kubernetes ServiceIP (not the whole Service CIDR).
managementAPI:
  mode: "" # "", external, or service ("" = legacy kubeApiExternalUrl).
           # platformVIP is RETIRED (2026-08-07) — render fails if set.
  externalEndpoint: "" # host:port; falls back to kubeApiExternalUrl
  # platformVIP: RETIRED 2026-08-07. Meant "dial the Fork-E kube-api MetalLB
  # VIP:6443"; no cluster used it and service mode supersedes it (ClusterIP
  # over the dual-home infra NIC). The key is intentionally GONE so a stale
  # value cannot sit here looking meaningful — mode=platformVIP now fails
  # render with a migration message.
  serviceIP: "" # exact IPv4 kubernetes.default ServiceIP; service mode only
  serviceCIDR: "" # IPv4 Service CIDR containing serviceIP; service mode only

# Accelerator product catalog consumed by kube-dc controllers, APIs, billing,
# and UIs. This does not install drivers, device plugins, HAMi, or VFIO. Keep it
# disabled until the fleet GPU stack has been qualified and reports matching
# allocatable resources.
gpu:
  enabled: false
  # Exact authenticated controller identity allowed to create catalogued
  # KubeVirt launcher Pods carrying whole-GPU native resources.
  kubevirtControllerUsername: system:serviceaccount:kubevirt:kubevirt-controller
  # Independent R1 product gate. Read-only discovery remains available when
  # false; preview/create routes return 404 and the tenant UI hides creation.
  sharedCreation:
    enabled: false
  # Independent R2 product gate. Capability/details discovery stays readable,
  # while GPU VM preflight/create fail closed and the wizard disables profiles.
  vmCreation:
    enabled: false
  # Tenant self-service for Shared GPU via kubectl. When true, project admin/
  # developer roles gain RBAC to create the fixed-product DRA ResourceClaimTemplate
  # + Deployment directly, and the backend-only "protect" admission policies for
  # those two kinds are not rendered. The DRA *shape* policies still force the
  # exact fixed product and the per-DeviceClass ResourceQuota still bounds count,
  # so a tenant can never claim more than their entitlement. Leave false to keep
  # creation backend-only (the gated preview/create API path).
  tenantDirectApply: false
  catalogVersion: 1
  # Shared HAMi Pods must carry this stable profile ID label. Fleet scopes the
  # HAMi fail-closed mutating webhook to the same key so ordinary Pods are not
  # coupled to GPU control-plane availability.
  profileLabel: kube-dc.com/gpu-profile
  hamiSchedulerName: hami-scheduler
  # HAMi-native knobs that are deliberately outside the kube-dc profile
  # contract. Keep this list aligned with the pinned HAMi device config: memory
  # percentage could override the catalog MiB bound and priority is not a
  # tenant product dimension.
  hamiDeniedResourceNames:
    - nvidia.com/gpumem-percentage
    - nvidia.com/priority
  profiles: []
  # - id: nvidia-v100-hami
  #   displayName: NVIDIA Tesla V100 (shared)
  #   vendor: nvidia
  #   workload: pod
  #   allocation: hami
  #   resourceName: nvidia.com/gpu
  #   memoryMiB: 32768
  #   isolation: software
  #   enabled: true
  #   billingEligible: false
  #   liveMigratable: false
  #   dra:
  #     driver: hami-core-gpu.project-hami.io
  #     deviceClassName: hami-core-gpu.project-hami.io
  #     attributes:
  #       productName: Tesla V100-PCIE-32GB
  #     memoryCapacity: memory
  #     coreCapacity: cores
  #     maxSharesPerDevice: 10
  #   request:
  #     countResource: nvidia.com/gpu
  #     memoryResource: nvidia.com/gpumem
  #     coreResource: nvidia.com/gpucores
  #     minMemoryMiB: 1024
  #     memoryStepMiB: 1024
  #     minCorePercent: 10
  #     coreStepPercent: 5
  #     allowCustom: true
  #     presets:
  #       - id: standard
  #         displayName: Standard
  #         memoryMiB: 8192
  #         corePercent: 25
  #         default: true
  # - id: nvidia-v100-passthrough
  #   displayName: NVIDIA Tesla V100 32 GB
  #   vendor: nvidia
  #   workload: vm
  #   allocation: passthrough
  #   resourceName: nvidia.com/GV100GL_TESLA_V100_PCIE_32GB
  #   memoryMiB: 32768
  #   isolation: device
  #   enabled: false
  #   billingEligible: false
  #   liveMigratable: false
  #   pciVendorSelector: 10DE:1DB6

# Per-cluster S3 endpoint. Threaded into:
#   - kube-dc-backend (S3_ENDPOINT env): UI object-storage views,
#     KdcDatabase endpoint hints, billing/quota responses.
#   - db-manager (S3_ENDPOINT env): default S3 endpoint for
#     KdcDatabase backups when `spec.backup.s3Endpoint` is not set
#     per-resource.
#
# REQUIRED for any cluster that wants S3-backed object storage (Rook
# Ceph, external Ceph, AWS S3, MinIO, …). No hardcoded fallback by
# design — kube-dc ships to many environments, and a default like
# `https://s3.kube-dc.cloud` would silently route customer S3 traffic
# (object storage, database backups) to a domain those clusters don't
# own.
s3Endpoint: ""  # example: "https://s3.stage.kube-dc.com"

# Per-cluster public Grafana URL. Threaded into kube-dc-backend
# (GRAFANA_URL env) for the "Open Grafana" SSO launch redirect. Same
# rationale as s3Endpoint — no fallback, must be set per-cluster.
grafanaUrl: ""  # example: "https://grafana.stage.kube-dc.com"

# Platform trust bundle (docs/prd/platform-trust-bundle.md).
#
# kube-dc has long had a trust CONTRACT — `kube-dc bootstrap init
# --trusted-ca-bundle` validates a certificate-only PEM bundle and creates a
# ConfigMap — but no DISTRIBUTION: the bundle reached only the pods this chart
# explicitly mounts it into. Every other consumer had to be wired by hand, and
# missing one produced a distinct, confusing failure (a VM whose image import
# fails with x509 against the cluster's OWN mirror, for instance).
#
# The manager now copies the certificates from this ConfigMap into every
# ConfigMap labelled `kube-dc.com/inject-trusted-ca: "true"`, in any namespace,
# under the key `ca-bundle.crt`. Adding a consumer is a label.
#
# Defaults to manager.trustedCA.configMapName, so a private-CA install gets
# distribution without setting anything. Leaving BOTH empty disables injection
# entirely, which is correct on a public-CA cluster — note that setting only this
# one back to "" does not disable it while manager.trustedCA.configMapName is
# still set, because that is the fallback.
#
# WITH NO PLATFORM CA, NOTHING IS INJECTED — not even system roots. OpenShift
# does inject roots-only in that case, but there a ConfigMap carries the label
# only because a consumer asked for it; kube-dc puts one in EVERY project
# namespace so CDI has a predictable name to mount, so the same rule would cost
# ~180 KB per namespace on every public-CA cluster for no benefit. It also means
# a source that goes missing freezes the last good bundle rather than silently
# rewriting it down to roots-only and dropping the private CA.
platformTrustBundle:
  configMapName: ""

  # Inject a COMPLETE bundle (platform CA + the manager image's system roots)
  # rather than the platform CA alone. This is OpenShift's behaviour and the
  # default here.
  #
  # Completeness is not strictly required: CDI's certConfigMap, Node's
  # NODE_EXTRA_CA_CERTS and Go's SSL_CERT_DIR all ADD to system trust, so an
  # additional-only bundle works for all of them (measured). It is chosen anyway
  # because it removes a footgun: a consumer whose runtime REPLACES the trust
  # store (SSL_CERT_FILE, curl --cacert, most "CA file" settings) silently loses
  # every public root with an additional-only bundle, which presents as "the
  # internal endpoint works and the public one broke".
  #
  # The cost: ~180 KB / ~119 certs copied into every project namespace, each copy
  # only as fresh as the manager image. Set false on clusters with many projects
  # where that etcd cost matters more than the footgun.
  includeSystemRoots: true

manager:
  # One replica is sufficient for the default feature set. Enabling
  # projectNetwork requires at least two: its attachment admission path fails
  # closed, so a single manager would turn every rollout/drain into an outage
  # for VLAN-attached workloads. The chart enforces the relationship.
  replicaCount: 1
  # Default issuer for tenant expose-route certs: "Kind/name" (e.g.
  # "ClusterIssuer/letsencrypt-prod-http") or a bare namespaced-Issuer name.
  # Empty keeps the historical per-project Issuer "letsencrypt" default.
  defaultTLSIssuerRef: ""

  # Requests only, deliberately no limits. Without a request the manager runs
  # BestEffort and is the first pod the kubelet evicts under node memory
  # pressure -- cloud accumulated 43 Evicted manager pods in ten days that way,
  # each one a silent reconcile gap. The request is what fixes it: QoS class,
  # not the number, decides eviction order.
  #
  # No limit on purpose. Steady state is ~715Mi, but a large-scale event (the
  # 2026-07 EIP storm) drove the manager to 36GiB, and an OOMKill loop during
  # an incident like that is worse than the eviction this prevents.
  #
  # Memory only, no cpu request: memory eviction ranks pods on memory usage
  # against the memory request, so a cpu request buys nothing, while it does
  # consume schedulable cpu -- on a cpu-tight cluster it left a second manager
  # replica Pending with "Insufficient cpu" under its topology spread.
  resources:
    requests:
      memory: 1Gi

  # Extra CA roots for clusters whose platform hostnames are served by a
  # PRIVATE CA (internal domain with no public issuer). The manager calls the
  # platform's own https endpoints -- notably Keycloak's token endpoint -- so
  # without these roots every Organization reconcile fails with
  #   cant login to keycloak: x509: certificate signed by unknown authority
  #
  # Point configMapName at a ConfigMap whose keys are PEM files, e.g.
  #   kubectl -n kube-dc create configmap my-ca --from-file=ca.pem=/path/ca.pem
  # The chart mounts it read-only and sets SSL_CERT_DIR to mountPath, which
  # ADDS the roots to Go's system trust store (SSL_CERT_FILE would replace it).
  trustedCA:
    configMapName: ""
    mountPath: /etc/kube-dc/trusted-ca

  # Escape hatches for anything the chart does not model. Standard
  # corev1.Volume / corev1.VolumeMount lists.
  extraVolumes: []
  extraVolumeMounts: []

  logLevel: 1 # 5 - Debug
  keycloakDebug: false
  ovnDbIps: "" # Required, example: "tcp:192.168.0.1:6641"

  # Authenticated controller-runtime metrics. The endpoint uses delegated
  # Kubernetes authentication + authorization; a scraper must present its
  # ServiceAccount token and be allowed to GET the /metrics non-resource URL.
  # The standard Prometheus/Alloy roles already carry that grant on the
  # supported platform. rbac.serviceAccounts is available for installations
  # whose scraper identity does not.
  metrics:
    enabled: true
    service:
      port: 8443
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
      additionalLabels:
        release: prom-operator
    prometheusRule:
      enabled: true
      additionalLabels:
        release: prom-operator
    rbac:
      create: false
      serviceAccounts: []
        # - namespace: monitoring
        #   name: prometheus-k8s

  # Admission webhooks for security.kube-dc.com/v1alpha1 (M0-T03).
  # Adds Service + cert-manager Certificate + Mutating/Validating
  # configurations covering ManagedSecret, ManagedCertificate, KMSKey,
  # DatabaseCredentialPolicy. Requires cert-manager.io CRDs to be
  # installed (already a hard dependency of the platform).
  #
  # Disable only when bootstrapping a cluster that does not yet have
  # cert-manager installed; the security CRDs will still apply, but
  # defaulting + validation will be bypassed.
  webhook:
    enabled: true

  # Tenant Networking v2 — infra-attachment pod webhook
  # (docs/prd/tenant-networking-v2.md). Gives pods in opted-in project
  # namespaces (labelled network.kube-dc.com/infra-attachment=enabled) a second
  # cluster-unique NIC in the default VPC that becomes status.podIP, so kubelet
  # and system operators (CNPG, mariadb) reach them by plain routing while the
  # tenant datapath is unchanged and the NIC is SecurityGroup-locked.
  #
  # All values are cluster-specific. When enabled, the manager creates one
  # SecurityGroup per opted-in project; fleet only provisions the shared subnet.
  # securityGroup MUST contain {namespace}. routes MUST include the node subnet
  # or kubelet probe replies are asymmetric and pods never go Ready.
  infraAttachment:
    enabled: false
    subnet: ""          # e.g. infra-net
    gateway: ""         # e.g. 100.66.0.1
    securityGroup: ""   # required template, e.g. infra-lock-{namespace}
    routes: ""          # comma-separated: "<node-subnet>,<join>,<system-pod>" e.g. "192.168.1.0/24,172.30.0.0/22,10.100.0.0/16"

  # OpenBao integration (M1+, see docs/prd/openbao-integration*.md).
  # Threaded into master-config as enable_openbao / openbao_url /
  # openbao_ca_bundle — MasterConfigSpec reads these to gate the OpenBao
  # reconcilers (Org Namespace, Project KV mount, ESO SecretStore,
  # OrganizationGroup policies). When disabled or url is empty, every
  # reconciler returns ErrOpenBaoDisabled and IsBootstrapGap silences
  # it — safe to leave off on clusters that haven't installed OpenBao.
  openBao:
    enabled: false
    # In-cluster TLS endpoint of the OpenBao service. Public DNS
    # (https://bao.<domain>) works too, but in-cluster is preferred
    # because it avoids egress + matches the cert SANs OpenBao serves.
    url: ""
    # Optional extra CA bundle for openbao.url. Empty when the chart
    # uses cert-manager-issued certs already trusted by the manager.
    caBundle: ""

  # grafanaTenantMode selects how the Organization controller shapes
  # per-tenant Grafana Orgs and the matching grafana-jwt-org-mapping
  # ConfigMap entries.
  #
  #   "org" (DEFAULT — every cloud + non-CS install) — one Grafana Org
  #     per kube-dc Organization, federated tenantList covering the
  #     org-level namespace + all project namespaces. JWT auth maps
  #     each realm to its single Grafana Org.
  #
  #   "project" — single-Org clusters with multiple Projects (today only
  #     marketplace-partner management planes). Manager creates the org-level admin Org as before AND
  #     one Grafana Org per Project, named after the Project's
  #     namespace, with a single-tenant datasource scoped to that
  #     namespace. JWT auth maps each user's namespaces[0] claim to
  #     the matching per-Project Grafana Org so a user with one
  #     OrganizationGroup grant only sees their own Project's logs.
  #
  # Leave at "org" unless you're deploying onto a marketplace-partner-style
  # management plane.
  grafanaTenantMode: org

  # Egress network isolation: blocks cross-project traffic on external subnets.
  # When enabled, project VPCs get deny rules for external subnets and allow rules for own EIPs.
  # Management VPC (ovn-cluster) is never affected.
  egressNetworkIsolation: true
  # Global allowlist of IPs/CIDRs that ALL projects can reach even with isolation enabled.
  # Use for shared infrastructure (monitoring, logging, shared databases, etc.).
  egressGlobalAllowlist: []
    # - "100.65.0.200"
    # - "10.8.0.0/24"

  # Ingress network isolation: blocks inbound traffic from shared external VLANs to project VPCs.
  # When enabled, project VPCs get deny rules for external subnets and allow rules for whitelisted source IPs.
  # Management VPC (ovn-cluster) is never affected. Disabled by default (opt-in).
  ingressNetworkIsolation: false
  # Global allowlist of source IPs/CIDRs allowed to reach ALL project VPCs when ingress isolation is enabled.
  # Use for shared infrastructure (NAT GW VMs, monitoring, bastion hosts, etc.).
  ingressGlobalAllowlist: []
    # - "100.64.200.1"

  # Gate creation of Projects with spec.egressNetworkType=public.
  # FALSE by default — fresh installs reject public-egress projects.
  # Flip to true only on clusters that have a public external network
  # (e.g. an `ext-public` Kube-OVN subnet) AND the operator wants
  # tenants to be able to expose projects directly to the public
  # internet. The Project ValidatingWebhook enforces this server-side
  # (rejects CREATE with egressNetworkType=public when false); the
  # kube-dc UI hides the "public" option in the project-create form.
  # Existing public-egress Projects are NOT affected — egressNetworkType
  # is immutable, so the safe default can't break in-flight clusters
  # that already created public projects (cloud).
  # See docs/prd/public-projects-gate.md.
  allowPublicProjects: false

  extraEnv: []
    # - name: EXAMPLE_VAR
    #   value: "example-value"
    # - name: SECRET_VAR
    #   valueFrom:
    #     secretKeyRef:
    #       name: mysecret
    #       key: secretkey

  keycloakSecret: {}
    # url: <KEYCLOAK_URL>
    # user: <KEYCLOAK_USER>
    # password: <KEYCLOAK_PASSWORD>
    # masterRealm: <KEYCLOAK_MASTER_REALM_NAME>
    # consoleUrl: <KUBE_DC_CONSOLE_URL>

  image:
    repository: shalb/kube-dc-manager
    pullPolicy: IfNotPresent
    # Empty string falls back to .Chart.AppVersion in the deployment
    # template — keeps the chart's default tag in lock-step with its
    # version. Per-cluster overrides come from the fleet's HelmRelease
    # (KUBE_DC_MANAGER_TAG in cluster-config.env), which lets ops pin
    # to a specific dev image without re-cutting the chart.
    tag: ""

  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

  serviceAccount:
    automount: true
    annotations: {}
    name: ""

  podAnnotations: {}
  podLabels: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
  nodeSelector:
    kube-dc-manager: "true"


frontend:
  replicaCount: 2
  # Extra environment variables for the container
  extraEnv: []
    # - name: EXAMPLE_VAR
    #   value: "example-value"
    # - name: SECRET_VAR
    #   valueFrom:
    #     secretKeyRef:
    #       name: mysecret
    #       key: secretkey
  
  # Extra JavaScript environment variables for the frontend application
  # These will be available as window.VARIABLE_NAME in the frontend code
  extraJsEnv: {}
    # apiVersion: "v1"
    # featureNewUI: "true"
    # authTimeout: "3600"
  image:
    repository: shalb/kube-dc-ui-frontend
    pullPolicy: IfNotPresent
    # Empty → fall back to .Chart.AppVersion (see manager.image.tag).
    tag: ""

  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

  serviceAccount:
    automount: true
    annotations: {}
    name: ""

  podAnnotations: {}
  podLabels: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  service:
    type: ClusterIP
    port: 8080

  gateway:
    hostname: "" # Required: Set to your frontend hostname, e.g., console.example.com
    parentRef:
      name: eg
      namespace: envoy-gateway-system
    # Per-route long-timeout override applied to the dedicated /api/cloud-shell
    # rule so ttyd-backed terminal WebSockets survive past Envoy's 15s default.
    longLivedTimeout: "1h"

  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  livenessProbe:
    httpGet:
      path: /
      port: 80
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /
      port: 80
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 3

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

  nodeSelector: {}

  tolerations: []

  affinity: {}

# ── adminFrontend (superadmin console) ──────────────────────────────────────────
# The admin SPA (shalb/kube-dc-admin-frontend). Served at admin.<domain> via the
# Gateway's `https-admin` listener (defined on the Gateway, not here). The image
# generates env.js at runtime from the env vars below, so no env.js ConfigMap mount
# is needed. Disable on clusters that don't run the console (e.g. marketplace-partner clusters).
adminFrontend:
  # Default OFF so the chart renders without admin-specific values (gateway.hostname
  # is required when enabled). Clusters that run the console set
  # adminFrontend.enabled=true + hostname in the fleet HelmRelease.
  enabled: false
  replicaCount: 2
  image:
    repository: shalb/kube-dc-admin-frontend
    # Empty → fall back to .Chart.AppVersion (same as manager/frontend). Fleet pins
    # KUBE_DC_ADMIN_FRONTEND_TAG → adminFrontend.image.tag for its own version line.
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  serviceAccount:
    create: true
    name: ""
    annotations: {}
    # Static SPA — no Kubernetes API access, so don't mount a token.
    automount: false
  # Runtime config → window._env_ (admin docker-entrypoint generates env.js):
  # BACKEND_URL defaults to https://<backend.gateway.hostname>; KEYCLOAK_URL to
  # manager.keycloakSecret.url. Override here only for a non-default endpoint.
  keycloakUrl: ""
  keycloakRealm: "master"
  keycloakClientId: "kube-dc-admin-console"
  extraEnv: []
  # Extra pod volumes / container volumeMounts, appended after the chart-managed
  # env-js mount. Fleet supplies the nginx config here (mounting kube-dc-admin-nginx
  # at /etc/nginx/nginx.conf) so env.js is served no-store instead of the image's
  # default immutable .js rule — mirrors frontend.volumes/volumeMounts.
  volumes: []
  volumeMounts: []
  service:
    type: ClusterIP
    port: 80
  gateway:
    enabled: true
    hostname: ""   # Required when enabled: admin.<domain>
    parentRef:
      name: eg
      namespace: envoy-gateway-system
      sectionName: https-admin
  podAnnotations: {}
  podSecurityContext: {}
  # Conservative hardening that does NOT break the root nginx:alpine image. Do NOT
  # drop capabilities: nginx's entrypoint chowns /var/cache/nginx and spawns workers
  # via setuid, needing CHOWN/SETUID/SETGID — dropping ALL caused CrashLoopBackOff
  # ("chown(...) Operation not permitted"). Full cap-drop / readOnlyRootFilesystem
  # needs an unprivileged nginx image listening on :8080 (image-side follow-up).
  securityContext:
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 200m, memory: 256Mi}
  livenessProbe:
    httpGet: {path: /, port: http}
    initialDelaySeconds: 10
    periodSeconds: 20
  readinessProbe:
    httpGet: {path: /, port: http}
    initialDelaySeconds: 5
    periodSeconds: 10
  autoscaling:
    enabled: false
  nodeSelector: {}
  tolerations: []
  affinity: {}

backend:
  # Verify TLS certificates on every outbound HTTPS call (API server, Keycloak,
  # OpenBao, Loki, object storage).
  #
  # Default false preserves the historical behaviour, in which NOTHING the
  # backend called was authenticated. Turning it on requires the trust bundle to
  # be complete for this installation: the cluster CA is added automatically at
  # container start, but platform hostnames served by a private CA also need
  # backend.trustedCA.configMapName set. Verify on a non-production cluster
  # first — a cluster whose API server is reached by an address its certificate
  # does not cover will fail every call.
  tlsVerify: false
  # Keycloak admin client for the Admin Console.
  #
  # The Admin Console's Keycloak-backed pages (Platform Admins, Auth & SSO)
  # authenticate with a client_credentials grant — NOT the admin
  # user/password the backend already receives. Leaving this empty makes
  # those pages report "Keycloak admin client not configured" and Auth & SSO
  # show 0 realms / 0 users on a cluster that has them.
  #
  # `kube-dc bootstrap keycloak init` creates the client
  # (kube-dc-admin-backend: confidential, service account enabled, holding
  # view-users/query-users/view-clients/view-realm/query-realms). Put its id
  # and secret in a Secret and name it here.
  keycloakAdminClient:
    secretName: ""
    clientIdKey: KEYCLOAK_ADMIN_CLIENT_ID
    clientSecretKey: KEYCLOAK_ADMIN_CLIENT_SECRET

  # Private-CA trust. Set configMapName to a ConfigMap holding the CA bundle
  # when the platform's own HTTPS endpoints (Keycloak, OpenBao, S3) use a
  # private CA — otherwise every server-side call the backend makes fails
  # with "certificate verify failed".
  #
  # fileName must match the ConfigMap key: Node's NODE_EXTRA_CA_CERTS takes a
  # single FILE, unlike the manager's SSL_CERT_DIR which takes a directory.
  trustedCA:
    configMapName: ""
    mountPath: /etc/kube-dc/trusted-ca
    fileName: ca.pem

  # Per-project VPC CIDR suggestion for the create-project form.
  #
  # Historically the form hardcoded one range for every project, so pods
  # across projects drew identical addresses. That is fine for the OVN data
  # plane (each project is its own VPC) but kube-ovn's custom-VPC health-check
  # TProxy maps probe targets to a pod netns by pod IP ALONE, so two probed
  # pods sharing an IP on one node steal each other's kubelet probes and get
  # liveness-killed. Upstream documents this and has not fixed it as of
  # v1.16.x. Suggesting a distinct block per project removes the class for
  # newly created projects.
  #
  # RESERVED IS LOAD-BEARING AND CLUSTER-SPECIFIC. The allocator will hand out
  # ANY block inside `pool` that no Project already claims — including your
  # node, management, storage, customer-VLAN or external-network underlays if
  # they live inside the pool and are not listed here. List every range the
  # cluster uses, or narrow `pool` to a range you know is dedicated to
  # projects. Defaults cover only the standard kube-dc in-cluster networks.
  projectCidr:
    # Supernet the suggestions are carved from.
    pool: "10.0.0.0/8"
    # Block size per project. 22 = 1024 addresses.
    prefix: 22
    # Never suggest anything overlapping these. ovn-default (system pod
    # network) and the Service CIDR by default — ADD YOUR UNDERLAYS.
    reserved:
      - "10.100.0.0/16"
      - "10.101.0.0/16"

  # Note: keycloakUrl, consoleUrl, appUrl are read from master-config secret

  # M1-T06-FU1: source-IP consistent-hash via Envoy Gateway
  # BackendTrafficPolicy. Pins each tenant to a single backend pod
  # so the in-memory org-admin elevation store (util/elevation.js)
  # stays consistent across follow-up calls. Disable on
  # single-replica deployments where the BTP is just noise.
  # See templates/backend-traffic-policy.yaml for the trade-offs.
  consistentHash:
    enabled: true

  # M1-T05: structured audit events for /api/secrets/* (and later
  # /api/certificates/*, /api/kms/*, /api/database-credentials/*)
  # ship to Loki with low-cardinality stream labels per dev-scope §5.
  # The push endpoint defaults to the in-cluster loki-gateway under
  # the `system` tenant; set lokiPushUrl to "" to disable emission
  # without breaking the rest of the API.
  audit:
    lokiPushUrl: "http://loki-gateway.monitoring.svc:80"
    # Optional override for the query path (M1-T05b
    # /api/audit/* endpoints). Defaults to lokiPushUrl so both sides
    # stay in lock-step; set this when the push and query paths use
    # different hostnames (e.g. distinct Loki write + read
    # deployments).
    lokiQueryUrl: ""
    tenant: "system"

  # SMTP configuration for email notifications (all required for email to work)
  smtp:
    enabled: false
    host: "" # e.g., "smtp.gmail.com"
    port: "587"
    secure: "false" # "true" for port 465
    user: "" # SMTP username
    password: "" # SMTP password (use secret reference in production)
    from: "" # e.g., "noreply@example.com"
    fromName: "Kube-DC"
  
  replicaCount: 2
  extraEnv: []
      # - name: PROM_URL
      #   value: "http://prometheus:9090"
  image:
    repository: shalb/kube-dc-ui-backend
    pullPolicy: IfNotPresent
    # Empty → fall back to .Chart.AppVersion (see manager.image.tag).
    tag: ""

  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

  serviceAccount:
    automount: true
    annotations: {}
    name: ""

  podAnnotations: {}
  podLabels: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  service:
    type: ClusterIP
    port: 8080

  gateway:
    hostname: "" # Required: Set to your backend hostname, e.g., backend.example.com
    parentRef:
      name: eg
      namespace: envoy-gateway-system
    # Request timeout for the backend HTTPRoute. Org self-registration creates a
    # Keycloak realm + CRs (~30s), so keep this well above Envoy's 15s default.
    requestTimeout: "120s"
    # Per-route long-timeout override applied to the dedicated /api/cloud-shell
    # rule so ttyd-backed terminal WebSockets survive long sessions.
    longLivedTimeout: "1h"

  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # The backend does outbound init (billing providers, OIDC/JWKS, CA bundle)
  # BEFORE binding :3333, and on slower clusters that takes 25-30s — longer
  # than liveness period*failureThreshold, so without startup grace the
  # kubelet kills the container just as it comes up and every helm upgrade
  # crashloops to its timeout (found live 2026-08-05; faster-booting clusters
  # survived by luck). The startupProbe owns the boot window (up to 3 minutes);
  # liveness/readiness take over only after the first success.
  startupProbe:
    httpGet:
      path: /
      port: 3333
    periodSeconds: 5
    failureThreshold: 36
  livenessProbe:
    httpGet:
      path: /
      port: 3333
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /
      port: 3333
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 3

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  # Additional volumes on the output Deployment definition.
  volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

  # Additional volumeMounts on the output Deployment definition.
  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

  nodeSelector: {}

  tolerations: []

  affinity: {}

# k8-manager - Kubernetes cluster management controller
k8Manager:
  enabled: true
  replicaCount: 1

  # Management-cluster worker autoscaling (docs/prd/mgmt-worker-autoscaling.md,
  # private repo). OFF by default; CloudSigma-backed management clusters only.
  # Enabling renders the mTLS chain, the adapter Service, the pinned
  # cluster-autoscaler Deployment (scale-up only) and admission/alerts — but
  # nothing provisions until a platform admin creates a MgmtWorkerPool CR.
  # Default StorageClass for NEW tenant-etcd datastores (empty = local-path;
  # see k8-manager datastore_etcd.go for the measured local-path vs dssd
  # tradeoff). Per-datastore spec.etcd.storage.storageClassName still wins.
  etcdDefaultStorageClass: ""

  mgmtAutoscaling:
    enabled: false
    # Immutable identity of THIS management cluster; tags every created VM so
    # pools on different clusters sharing one CloudSigma account cannot
    # collide. REQUIRED when enabled.
    clusterID: ""
    provider:
      # CloudSigma region, e.g. "zrh". REQUIRED when enabled.
      region: ""
      # Secret in the release namespace with keys `username` and `password`
      # for the CloudSigma API. REQUIRED when enabled.
      secretName: ""
      mhzPerCore: "2500"
    # Override auth-extra-groups for minted bootstrap tokens. The default in
    # the controller (system:bootstrappers:rke2:default-node-token) was
    # validated against a live RKE2 supervisor on 2026-08-05.
    tokenGroups: ""
    ca:
      image: registry.k8s.io/autoscaling/cluster-autoscaler
      # MUST match the k8s minor of THIS management cluster AND the protos
      # vendored in k8-manager (internal/externalgrpc — generated from this
      # exact tag; 1.35 changed the wire format). Overriding the tag is an
      # UPGRADE-GATE action, never a per-cluster tweak: re-verify the vendored
      # protos and the deprecated --scale-down-enabled flag first (review
      # finding).
      tag: v1.35.2
      # Optional sha256 digest pin, e.g. "sha256:...".
      digest: ""

  image:
    repository: shalb/kube-dc-k8-manager
    pullPolicy: IfNotPresent
    tag: "latest"

  # External endpoint for the infrastructure cluster API
  # Required for CCMs running in VPC-isolated namespaces that cannot reach kubernetes.default.svc
  # Format: "host:port" (e.g., "kube-api.stage.kube-dc.com:6443")
  infraAPIEndpoint: ""

  # M5-T04 managed-K8s etcd encryption-at-rest knobs.
  #
  # kmsPluginImage: the kube-dc-kms-plugin sidecar image the encryption
  # reconciler injects into Kamaji TCPs/KCPs when a KdcCluster opts into
  # spec.encryption.etcd.enabled=true. Empty disables the feature with
  # a clear error in the reconciler (KMS_PLUGIN_IMAGE env not set).
  # See docs/internal/managed-k8s-encryption-runbook.md for the live-
  # smoke procedure.
  kmsPluginImage: ""

  # openBaoUrl: where the kms-plugin sidecar dials OpenBao Transit.
  # When empty the reconciler refuses to provision encryption. Usually
  # left empty for cloud and inherited from MasterConfig at runtime via
  # the cluster's chart-managed master-config Secret; set explicitly
  # here only when you want the chart to pin a specific URL on the
  # k8-manager Deployment.
  openBaoUrl: ""

  # Kamaji datastore configuration
  kamajiDatastoreName: "default"
  kamajiDatastoreNamespace: "kamaji-system"

  # Enable metrics endpoint
  metricsEnabled: false

  # Extra arguments for the manager
  extraArgs: []

  # Extra environment variables
  extraEnv: []

  # k8-manager is a controller-runtime operator whose informer caches grow
  # with the number of managed clusters (KdcCluster/KdcClusterDatastore +
  # the CAPI/Kamaji/KubeVirt objects each spawns across tenant namespaces).
  # 128Mi was too small once a cluster hosts several tenants — the manager
  # OOMKilled (exit 137) → CrashLoopBackOff (observed on cloud at 7 clusters,
  # 2026-07-07). Platform default raised to 512Mi limit / 128Mi request for
  # headroom; a re-OOM at 512Mi would indicate a leak, not under-provisioning.
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 128Mi

  nodeSelector: {}

  tolerations: []

  affinity: {}

# Billing configuration
billing:
  # Billing provider: "none" (quota-only), "stripe", or "whmcs"
  # Default is "none" so a fresh install boots without pre-existing
  # billing secrets (stripe-billing / whmcs-credentials). Installs
  # that want billing flip this via HelmRelease values + provision
  # the matching Secrets.
  provider: "none"

  # Stripe-specific settings (only used when provider=stripe)
  stripe:
    # Name of the K8s Secret created by hack/bootstrap-stripe.sh
    # Contains STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, and STRIPE_PRICE_* keys
    secretName: "stripe-billing"

  # billing-plans ConfigMap — deployed when enabled
  # Required by both the Go controller (organization quotas) and the UI backend (plan display)
  plans:
    enabled: true
    # Seed-once migration wave for existing ConfigMaps. The chart can copy
    # explicitly unavailable add-ons and synchronize only their availability
    # flags; it preserves operator-edited price and grants. Bump the version
    # when adding another explicit migration wave.
    migration:
      version: "gpu-v100-shared-8g-v3-disabled"
      addMissingAddons:
        - gpu-v100-shared-8g
      syncAddonAvailability:
        - gpu-v100-shared-8g
      # Optional cluster-scoped availability for a versioned migration. Every
      # override must be listed above and remain disabled or selfService=false.
      # It is applied to both fresh seeds and existing seed-once ConfigMaps.
      availabilityOverrides: {}
      # Plan ids copied from the desired config into an existing seed-once
      # ConfigMap when they are ABSENT there. Never replaces a live plan, and
      # back-fills only a missing eipQuota entry (a plan absent from eipQuota
      # gets no public-IPv4 enforcement at all). Requires `version`.
      # Empty by default: seeding a priced SKU is a per-cluster decision.
      addMissingPlans: []
    # GPU alternatives to the plans below — one per tier, identical on every
    # non-GPU dimension so base <-> GPU is a toggle rather than a separate SKU
    # family. Kept OUT of `config` on purpose, and merged into it only when
    # `enabled`, `gpu.enabled` AND `billing.provider=whmcs` all hold.
    #
    # WHMCS-only by design: WHMCS provisions a service by plan id and carries no
    # Kube-DC add-on quantities, so a WHMCS customer cannot buy the GPU add-on at
    # all and the entitlement has to be baked into the tier. Stripe has no such
    # limit — it sells GPU through the add-on catalog, which works and is left
    # alone. Publishing these plans there would be a second, unbillable way to
    # buy the same entitlement. The backend enforces the LIVE provider
    # independently, so flipping a cluster to Stripe withdraws the plans from
    # purchase and assignment without needing a reseed.
    #
    # A plan carrying GPU grants is not inert on a cluster without a catalog:
    # LoadPlanConfig REJECTS the whole plans.yaml (see hasGPUGrants) when
    # gpu-profiles is missing, or when the granted profile is not
    # billingEligible. That takes down every plan, the suspended plan, system
    # overhead and eipQuota with it, so on a cold manager start with no cached
    # config every organization fails to reconcile. Plans also have no
    # `disabled` flag to hide behind the way add-ons do — and adding one would
    # be worse: a disabled plan loses its BasePlans entry, so any org already
    # on it silently falls back to the suspended-plan floor. Hence the gate is
    # at render time, and the template fails closed with the reason named.
    #
    # Grants must be exact multiples of the fixed DRA product unit
    # (8192 MiB / 25% per share) or validateDRAFixedGrant rejects them.
    # Prices are placeholders: they are per-cluster (a live cluster may run
    # 29/69/139 against the 19/49/99 defaults below), so set them through the
    # Flux-substituted values in platform/kube-dc/helmrelease.yaml.
    gpuVariants:
      enabled: false
      eipQuota:
        dev-pool-gpu: 1
        pro-pool-gpu: 1
        scale-pool-gpu: 3
      plans:
        dev-pool-gpu:
          displayName: "Dev Pool + GPU"
          description: "Best for: Sandbox / Dev with a shared GPU"
          price: 49
          currency: "EUR"
          recommended: false
          objectStorage: 20
          ipv4: 1
          features:
            - "4 vCPU"
            - "8 GB RAM"
            - "60 GB NVMe Storage"
            - "1 concurrent shared GPU workload"
            - "8 GB GPU memory • 25% GPU compute"
            - "20 GB Object Storage included"
            - "1 Dedicated IPv4"
            - "Managed Clusters"
            - "Unlimited 1Gbit/s Bandwidth"
          requests:
            cpu: "4"
            memory: "8Gi"
            storage: "60Gi"
          pods: 100
          servicesLB: 100
          burstRatio: 1.0
          gpu:
            nvidia-v100-hami:
              shares: 1
              memoryMiB: 8192
              corePercent: 25
          limitRange:
            defaultCPU: "500m"
            defaultMemory: "512Mi"
            defaultRequestCPU: "100m"
            defaultRequestMem: "128Mi"
            maxCPU: "4"
            maxMemory: "8Gi"
            minCPU: "1m"
            minMemory: "1Mi"
            maxPodCPU: "4"
            maxPodMemory: "8Gi"
            maxPVCStorage: "60Gi"
            minPVCStorage: "10Mi"
        pro-pool-gpu:
          displayName: "Pro Pool + GPU"
          description: "Best for: Production / Teams with shared GPUs"
          price: 109
          currency: "EUR"
          recommended: false
          objectStorage: 100
