            - "Managed Clusters"
            - "Unlimited 1Gbit/s Bandwidth"
          requests:
            cpu: "8"
            memory: "24Gi"
            storage: "160Gi"
          pods: 200
          servicesLB: 100
          burstRatio: 1.0
          gpu:
            nvidia-v100-hami:
              shares: 2
              memoryMiB: 16384
              corePercent: 50
          limitRange:
            defaultCPU: "500m"
            defaultMemory: "512Mi"
            defaultRequestCPU: "250m"
            defaultRequestMem: "256Mi"
            maxCPU: "8"
