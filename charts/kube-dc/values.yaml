      mirrorPath: "ubuntu/26.04/latest/resolute-server-cloudimg-amd64.img"
      # No containerdiskRepo/-Tag yet: quay.io/containerdisks/ubuntu
      # publishes 20.04/22.04/24.04/25.04 only (checked 2026-07-05).
      # Add `containerdiskRepo` + `containerdiskTag: "26.04"` once the
      # upstream containerdisk appears; until then this family stays
      # http-only in cdi-os-catalog.
      minMemory: "1G"
      minVCPU: "1"
      minStorage: "20G"
      firmwareType: "bios"
      machineType: "q35"
      features: "acpi"
      cloudInit: |
        #cloud-config
        package_update: true
        package_upgrade: true
        packages:
          - qemu-guest-agent
        runcmd:
          - systemctl enable --now qemu-guest-agent
    - osName: "Ubuntu 24.04 LTS"
