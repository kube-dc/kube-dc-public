# v0.5.92: manager v0.5.83 leaves custom-VPC routing-link Subnets
# namespace-neutral so Kube-OVN can validate and program them.
# v0.5.91: manager v0.5.82 preserves Kube-OVN-owned routing-link Subnet
# defaults and merge-patches only the fields managed by Routed Networks.
# v0.5.90: gateway v0.1.2 also prepares FRR's runtime PID/socket directory for
