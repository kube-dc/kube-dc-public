---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
  name: projectrouteattachments.kube-dc.com
spec:
  group: kube-dc.com
  names:
    kind: ProjectRouteAttachment
    listKind: ProjectRouteAttachmentList
    plural: projectrouteattachments
    singular: projectrouteattachment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.allocationRef
      name: Allocation
      type: string
    - jsonPath: .spec.direction
      name: Direction
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.gateway.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          ProjectRouteAttachment is an organization-authorized, Project-local request
          to connect the whole Project VPC to one Routed Network.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ProjectRouteAttachmentSpec grants this Project access to
              an organization allocation.
            properties:
              allocationRef:
                description: |-
                  AllocationRef names a RoutedNetworkAllocation assigned to this Project's
                  organization.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: allocationRef is immutable; detach and reattach to select
                    another Routed Network
                  rule: self == oldSelf
              direction:
                default: routed-egress
                description: |-
                  Direction is routed-egress in v1. bidirectional is reserved for a future
                  release with explicit ingress authorization.
                enum:
                - routed-egress
                - bidirectional
                type: string
                x-kubernetes-validations:
                - message: direction is immutable
                  rule: self == oldSelf
            required:
            - allocationRef
            type: object
          status:
            description: ProjectRouteAttachmentStatus reports effective, tenant-safe
              routing state.
            properties:
              advertised:
                description: Advertised lists Project VPC prefixes currently announced
                  by the gateway.
                items:
                  type: string
                type: array
              conditions:
                description: |-
                  Conditions represents PolicyValid, Redundant, BgpEstablished,
                  RoutesProgrammed, FailClosedArmed, and Ready observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              effectiveImports:
                description: |-
                  EffectiveImports lists external destinations currently installed in this
                  Project VPC. It never contains a default route.
                items:
                  type: string
                type: array
              gateway:
                description: Gateway reports desired and ready gateway replicas.
                properties:
                  haMode:
                    description: HAMode is bfd, exporter-health, or degraded-no-bfd.
                    type: string
                  readyReplicas:
                    description: ReadyReplicas is the number currently ready to forward.
                    format: int32
                    type: integer
                  replicas:
                    description: Replicas is the desired replica count.
                    format: int32
                    type: integer
                required:
                - readyReplicas
                - replicas
                type: object
              peers:
                description: |-
                  Peers reports per-replica BGP state. Tenant-facing APIs redact sensitive
                  platform topology where required.
                items:
                  description: ProjectRoutePeerStatus reports one gateway-to-peer
                    BGP session.
                  properties:
                    address:
                      description: Address is the external peer address. Tenant views
                        may redact this field.
                      type: string
                    replica:
                      description: Replica identifies the gateway pod reporting the
                        session.
                      type: string
                    sinceSeconds:
                      description: SinceSeconds is the number of seconds the current
                        state has held.
                      format: int64
                      type: integer
                    state:
                      description: State is the FRR BGP finite-state-machine state.
                      type: string
                  required:
                  - address
                  - replica
                  - state
                  type: object
                type: array
              phase:
                description: Phase is Pending, Programming, Ready, Degraded, Failed,
                  or Terminating.
                type: string
              routes:
                description: Routes reports accepted, rejected, and advertised prefix
                  counts.
                properties:
                  accepted:
                    description: Accepted is the number of learned routes admitted
                      by IMPORT_ALLOWED.
                    format: int32
                    type: integer
                  advertised:
                    description: Advertised is the number of controller-derived Project
                      prefixes exported.
                    format: int32
                    type: integer
                  rejected:
                    description: Rejected is the number of learned routes rejected
                      by policy.
                    format: int32
                    type: integer
                required:
                - accepted
                - advertised
                - rejected
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
