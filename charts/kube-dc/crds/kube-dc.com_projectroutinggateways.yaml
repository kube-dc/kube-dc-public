---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
  name: projectroutinggateways.kube-dc.com
spec:
  group: kube-dc.com
  names:
    kind: ProjectRoutingGateway
    listKind: ProjectRoutingGatewayList
    plural: projectroutinggateways
    singular: projectroutinggateway
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.attachmentRef
      name: Attachment
      type: string
    - jsonPath: .spec.projectVpc
      name: VPC
      type: string
    - jsonPath: .spec.replicas
      name: Replicas
      type: integer
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          ProjectRoutingGateway is the namespaced, controller-generated desired state
          for a platform-namespace routing gateway workload. It remains in the tenant
          namespace so its owner reference to ProjectRouteAttachment is valid; tenants
          receive read-only access and cannot mutate it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ProjectRoutingGatewaySpec is entirely controller-owned. Tenants are denied
              create, update, patch, and delete by the routed-network VAP.
            properties:
              allocationRef:
                description: AllocationRef names the organization allocation consumed
                  by the attachment.
                type: string
              allowedExportPrefixes:
                description: AllowedExportPrefixes is derived only from authoritative
                  Project VPC state.
                items:
                  type: string
                type: array
              allowedImportPrefixes:
                description: AllowedImportPrefixes is the effective controller-validated
                  import set.
                items:
                  type: string
                type: array
              attachmentRef:
                description: AttachmentRef names the owning ProjectRouteAttachment
                  in this namespace.
                type: string
              attachmentUid:
                description: AttachmentUid pins this generated object to one exact
                  attachment incarnation.
                type: string
              backend:
                description: Backend records the selected stable routing backend.
                type: string
              direction:
                description: Direction is copied from the attachment for nftables
                  generation.
                type: string
              fabricRef:
                description: FabricRef names the RoutingFabric selected through the
                  allocation.
                type: string
              frrConfigHash:
                description: FrrConfigHash changes whenever controller-generated FRR
                  configuration changes.
                type: string
              frrImage:
                description: FrrImage is the pinned FRR base image used by the gateway
                  workload.
                type: string
              gatewayImage:
                description: GatewayImage is the pinned Kube-DC route-bootstrap and
                  exporter image.
                type: string
              projectVpc:
                description: ProjectVpc is the kube-ovn Vpc receiving destination
                  routes.
                type: string
              replicas:
                description: Replicas is the desired gateway replica count.
                format: int32
                type: integer
              routingLink:
                description: RoutingLink records the hidden in-VPC subnet and gateway
                  next hops.
                properties:
                  cidrBlock:
                    description: CidrBlock is the IPv4 routing-link subnet allocated
                      by the controller.
                    type: string
                  gatewayIPs:
                    description: GatewayIPs contains one routing-link next-hop address
                      per replica.
                    items:
                      type: string
                    type: array
                  networkAttachmentDefinition:
                    description: |-
                      NetworkAttachmentDefinition is the optional Multus NAD used for the
                      routing-link NIC in the selected two-NIC layout.
                    type: string
                  routerIP:
                    description: RouterIP is the Project VPC logical-router address
                      on the routing link.
                    type: string
                  subnet:
                    description: Subnet is the kube-ovn Subnet name attached to the
                      Project VPC.
                    type: string
                required:
                - cidrBlock
                - gatewayIPs
                - routerIP
                - subnet
                type: object
              transitIPs:
                description: TransitIPs contains one provider-side BGP address per
                  replica.
                items:
                  type: string
                type: array
            required:
            - allocationRef
            - allowedExportPrefixes
            - allowedImportPrefixes
            - attachmentRef
            - attachmentUid
            - backend
            - direction
            - fabricRef
            - frrConfigHash
            - frrImage
            - gatewayImage
            - projectVpc
            - replicas
            - routingLink
            - transitIPs
            type: object
          status:
            description: ProjectRoutingGatewayStatus reports controller-internal rollout
              and BGP state.
            properties:
              conditions:
                description: Conditions represents rollout, BGP, policy, and route-programming
                  state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              peers:
                description: Peers reports per-replica BGP session health.
                items:
                  description: ProjectRoutePeerStatus reports one gateway-to-peer
                    BGP session.
                  properties:
                    address:
                      description: Address is the external peer address. Tenant views
                        may redact this field.
                      type: string
                    replica:
                      description: Replica identifies the gateway pod reporting the
                        session.
                      type: string
                    sinceSeconds:
                      description: SinceSeconds is the number of seconds the current
                        state has held.
                      format: int64
                      type: integer
                    state:
                      description: State is the FRR BGP finite-state-machine state.
                      type: string
                  required:
                  - address
                  - replica
                  - state
                  type: object
                type: array
              readyReplicas:
                description: ReadyReplicas is the number of gateway pods ready to
                  forward.
                format: int32
                type: integer
              routes:
                description: Routes reports effective route counts.
                properties:
                  accepted:
                    description: Accepted is the number of learned routes admitted
                      by IMPORT_ALLOWED.
                    format: int32
                    type: integer
                  advertised:
                    description: Advertised is the number of controller-derived Project
                      prefixes exported.
                    format: int32
                    type: integer
                  rejected:
                    description: Rejected is the number of learned routes rejected
                      by policy.
                    format: int32
                    type: integer
                required:
                - accepted
                - advertised
                - rejected
                type: object
            required:
            - readyReplicas
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
