apiVersion: security.kube-dc.com/v1alpha1
kind: DatabaseCredentialPolicy
metadata:
  name: "{policy-name}"
  namespace: "{backing-namespace}"
spec:
  # The KdcDatabase must exist in the same Project backing namespace.
  databaseRef:
    name: "{database-name}"

  # dynamic is reserved and returns Ready=False/DynamicModeDeferred.
  mode: static-rotated

  # The user must exist. kdc_rotator, postgres, and root are reserved.
  username: app

  rotation:
    interval: 30d
    # Both accepted values currently use one-password cutover. Applications
    # must reload the projected credential before reconnecting.
    strategy: rolling # rolling | immediate

  sync:
    # Omit sync to accept the static-rotated default (enabled).
    enabled: true
    # Defaults to metadata.name.
    targetSecretName: "{target-secret-name}"
