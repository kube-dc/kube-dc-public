apiVersion: db.kube-dc.com/v1alpha1
kind: KdcDatabase
metadata:
  name: "{database-name}"
  namespace: "{backing-namespace}"
spec:
  engine: postgresql
  version: "16"
  replicas: 2
  cpu: "1"
  memory: 2Gi
  storage: 20Gi
  databaseName: "{application-database}"
  username: app
  expose:
    type: internal # internal | loadbalancer
                   # gateway is manifest-only for PostgreSQL 17 direct TLS
  backup:
    enabled: true
    schedule: "0 2 * * *"
    retentionDays: 7
