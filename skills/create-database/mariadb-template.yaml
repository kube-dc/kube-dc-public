apiVersion: db.kube-dc.com/v1alpha1
kind: KdcDatabase
metadata:
  name: "{database-name}"
  namespace: "{backing-namespace}"
spec:
  engine: mariadb
  version: "11.4"
  replicas: 1
  cpu: "1"
  memory: 2Gi
  storage: 20Gi
  databaseName: "{application-database}"
  username: app
  expose:
    type: internal # internal | loadbalancer; Gateway is not MariaDB-compatible
  backup:
    enabled: true
    schedule: "0 2 * * *"
    retentionDays: 7
