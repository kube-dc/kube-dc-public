apiVersion: security.kube-dc.com/v1alpha1
kind: ManagedSecret
metadata:
  name: "{name}"
  namespace: "{project-backing-namespace}"
spec:
  # opaque | password | api-key | tls | db-static
  type: opaque
  description: "What this secret is used for"

  sync:
    # true projects values through External Secrets Operator.
    # false keeps values in OpenBao only; read them with:
    # kube-dc secrets get {name} --value
    enabled: true
    targetSecretName: "{target-secret}"
    refreshInterval: 1h
    # Empty or omitted means all keys.
    # keys:
    #   - API_KEY

  # Optional: meaningful for type=password. Use only when the installation
  # advertises scheduled ManagedSecret rotation.
  # rotation:
  #   enabled: true
  #   interval: 90d
  #   generator:
  #     length: 32
  #     charset: alnum-symbol
