apiVersion: kube-dc.com/v1
kind: Project
metadata:
  name: "{project}"
  namespace: "{organization}"          # Organization API namespace
spec:
  # Required Project VPC subnet. Choose a private range that does not overlap
  # networks these workloads need to reach.
  cidrBlock: "{project-cidr}"

  # Required and immutable: cloud | public
  # public is accepted only when the provider has enabled public Projects.
  egressNetworkType: cloud

  # Optional. Normally let the platform select the gateway address.
  # gwLanIp: {gateway-address}
