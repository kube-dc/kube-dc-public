apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: debug-net
  name: debug-net
  namespace: shalb-dev
spec:
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: debug-net
  template:
    metadata:
      labels:
        app: debug-net
    spec:
      containers:
      - name: debug-net
        image: shalb/go-pinger:0.0.11
        imagePullPolicy: Always
        args:
          - "-i"
          - "1.0"
          - "-t"
          - "2.0"
          - "-v"
          - "1.1.1.1"
          - "88.99.218.47"
          - "8.8.4.4"
          - "8.8.8.8"
          - "9.9.9.9"
          - "1.1.1.1"
          - "1.0.0.1"
        env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
        securityContext:
          capabilities:
            add: ["NET_RAW", "NET_ADMIN"]

        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
